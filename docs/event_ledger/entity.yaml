# Entity-layer event ledger — TCK-20260808-ENTITY-EVENT-LEDGER
#
# Catalogs every EntityUpdate field (src/core/updates.py) against real observability-event
# coverage (docs/simulation_quality/event_type_coverage.md's exhaustive event catalog) — not just
# whether a mutation is *scored*, but whether ANY event exists for it at all, even unscored.
# Schema mirrors docs/parity_ledger/schema.json's discipline. First phase of an eventual
# all-layers catalog, scoped to entity (center, lowest lifecycle layer) only — region/faction/
# world layers are explicitly future phases.
#
# status: observed (an event reliably captures this mutation) | silent (no event anywhere) |
#         partial (some fields/cases observed, others not)

