# Gate conformance map (TCK-20261010-PERF-M2-T06-GATE-CONFORMANCE).
#
# Maps every live `assert_perf_threshold` / `perf_check` call site under tests/ to a clause ID from
# docs/performance/performance_clause_inventory.md (section 3 rows PC-, CC-, BP-, OA-, OI-, RG-, RP-) or to the literal `none` (the check enforces no
# documented clause). `related` names clauses the check concerns but does not enforce. A site is keyed `file::function#N`, N being its 1-based
# position among the helper calls in that function in source order; no line numbers, so a moved line does not break the map.
# tests/docs/test_gate_conformance_map.py fails on an unmapped site, an unknown clause ID and an entry whose site no longer exists.

sites:
  - site: tests/arena/test_arena_stress.py::test_arena_stress_50v50#1
    clause: none
    note: "absolute tick ceiling for the arena stress scenario; no clause sets a per-scenario ceiling"
  - site: tests/certification/test_cert_long_run_stability.py::test_long_run_pure_stability#1
    clause: OI-06
    note: "rss_bounded: OI-06 states bounded RSS containment over a long run; the check uses 2x growth or 512 MB"
  - site: tests/certification/test_cert_long_run_stability.py::test_long_run_pure_stability#2
    clause: none
    note: "latency_stable: p95 drift within 1.5x or +15 ms; no clause"
  - site: tests/certification/test_cert_long_run_stability.py::test_long_run_pure_stability#3
    clause: none
    related: [OI-05]
    note: "caches_bounded: cache sizes within 10*N and 2*N; OI-05 requires registered caches and a max-items policy, not these bounds"
  - site: tests/certification/test_cert_long_run_stability.py::test_long_run_pure_stability#4
