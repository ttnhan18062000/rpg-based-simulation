# Live checks that are not helper call sites. The call-site test cannot see them (it looks for the two helper names), so it does NOT cover them;
# the decision (TCK-20261010-PERF-M2-T06-GATE-CONFORMANCE, 2026-10-24) is to list them here with their clause or `none`, and the test only
# checks that each listed path exists and each clause ID is real. A check added outside the helpers is not caught by the test.

other_checks:
  - path: src/perf/regression_gate.py
    check: "PerfRegressionGate (p95 and p99 tolerance 10 %, peak RSS 15 %, memory delta)"
    clause: [BP-10, BP-12]
    note: "BP-11 states 15 % for p99 and the code uses 10 %; the gate is applied to no real measurement"
  - path: src/perf/long_run_harness.py
    check: "long-run stability invariants (rss_bounded, latency_stable, caches_bounded, gc_stable)"
    clause: [OI-06, BP-13]
    note: "the numbers appear in no document"
  - path: src/perf/benchmark_record.py
    check: "compare() and the tripwire thresholds (max(5 ms, base x 1.40), report-only)"
    clause: [PC-13, BP-09]
    note: "the tripwire projection; final value published in performance_contract.md section 5"
  - path: tests/perf/test_perf_regression_baseline.py
    check: "nightly local regression test against the promoted baselines"
    clause: [PC-07, PC-13]
    note: "soft, nightly"
  - path: tests/perf/conftest.py
    check: "PerfBudget / assert_within_budget against perf_baselines.json"
    clause: [none]
    note: "no document mentions PerfBudget"
  - path: .github/workflows/test.yml
    check: 'CI selectors: -m "not slow and not extra_slow" on pull requests; perf-cert-arena paired tripwire step'
    clause: [none]
    note: "selection, not a clause"
