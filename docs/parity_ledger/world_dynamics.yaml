- id: WORLD-103
  text: 'SpawnService two-tier cadence: before late_spawn_threshold_tick (default 500)
    spawn base_spawn_batch_size (default 1) entities per below-density region per
    50-tick interval; at or after the threshold spawn late_spawn_batch_size (default 2)
    per region per interval to compensate late-run combat attrition. Batch is always
    capped by the density deficit (target_count - current_count) so target is never
    exceeded. Batch index 0 uses original RNG keys (preserving early-game determinism);
    subsequent batch entries use suffixed keys (e.g. "{r_id}_b1"). Implemented in
    TCK-20260627-P2B-SPAWN-CADENCE.'
  status: verified
