- id: WORLD-104
  text: >
    Regional resource scarcity pressure propagates to adjacent regions (E21E). After
    per-region resource pressure is computed, RegionalPressureModel.propagate_cross_region()
    adds PROPAGATION_FACTOR (0.30) × neighbor resource intensity to each adjacent region's
    resource pressure. Two regions are adjacent when their bounding boxes are within
    ADJACENCY_GAP (50 units) of each other. Propagated pressure is bidirectional and
    capped at 1.0. Regions with no native resource pressure that receive spread from
    neighbours get a new resource pressure entry at confidence=0.65.
  status: verified
  priority: P1
  legacy_evidence: null
  v2_evidence: >
    src/domains/world_emergence/models.py — RegionalPressureModel.ADJACENCY_GAP=50.0,
    PROPAGATION_FACTOR=0.30; _are_adjacent(); propagate_cross_region().
    src/domains/world_emergence/phase.py — step 2b calls propagate_cross_region after
    RegionalPressureModel.evaluate(). Verified by TCK-20260628-E21E-CROSS-REGION-PRESSURE.
  proof_type: parity
  test_path: tests/unit/domains/world_emergence/test_phase8_regional_pressure_model.py::test_propagate_cross_region_adjacent_regions_receive_spread
  divergence_note: >
    New mechanic added by TCK-20260628-E21E-CROSS-REGION-PRESSURE. No prior behavior
    existed — resource pressure was evaluated per-region in isolation.
  support_boundary: null
  support_boundary: null

- id: WORLD-105
  text: >
    Seasonal calamity pressure propagation (E52E): every SEASONAL_PROPAGATION_INTERVAL=500
    ticks, each region with calamity_intensity >= PROPAGATION_THRESHOLD=0.10 spreads
    intensity to adjacent regions (adjacency defined by RegionalPressureModel._are_adjacent,
    ADJACENCY_GAP=50 units). Propagated amount = source.calamity_intensity * PROPAGATION_FACTOR=0.15,
    capped at 1.0. Per-neighbor update takes the maximum proposed value across all source
    regions (prevents runaway amplification). Source region is never self-updated. Wired into
    WorldDynamicsSystem step 3.8 under the world_dynamics cadence gate.
