- id: WORLD-DEMO-006
  text: 'WorldCompiler.compile() seeds RegionState.population_cohorts at world-assembly
    time. For each region, declared population = sum(PopulationSpec.count for specs
    with matching spawn_region). Counts are split into young/adult/elder using a fixed
    30/50/20 ratio via largest-remainder (Hamilton apportionment) rounding, guaranteeing
    exact-sum reproduction at any population size. Seeded PopulationCohort instances
    keep birth_rate=0.02/mortality_rate=0.01 (dataclass defaults) untouched. A region
    with zero matching PopulationSpec entries gets population_cohorts={}, on which
    DemographicCycleService''s guard (cohort.py:349) no-ops via plain dict truthiness.
    Seeding is pure arithmetic (no RNG), preserving compile() determinism. Because
    population_cohorts was always {} for the entire lifetime of E52A-COHORT-MODEL
    before this ticket, CanonicalStateHasher.get_hash()/RegionState.to_canonical_dict()
    had never been exercised against a non-empty population_cohorts dict: it previously
    passed raw PopulationCohort dataclass instances straight through, which json.dumps()
    cannot serialize. Fixed by adding PopulationCohort.to_canonical_dict() (src/domains/demographics/cohort.py)
    and calling it from RegionState.to_canonical_dict() (src/core/state.py) instead
    of passing the dataclass through unchanged -- a determinism/canonical-hashing
    regression found and fixed during this ticket''s Test phase, Architecture-Verify-approved.'
  status: verified
  priority: P1
