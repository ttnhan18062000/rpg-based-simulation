- id: WORLD-076
  text: Spawn avoids occupied tile or uses conflict-safe placement.
  status: verified
  priority: P0
  legacy_evidence: null
  v2_evidence: 'Root cause fixed by TCK-20260817-STANDARD-SPAWN-OCCUPANCY-COLLISION-RNG-ROOT-CAUSE:
    WorldCompiler.compile() step 6 (src/worldbuilding/compiler.py) drew each entity''s
    spawn tile purely as a hash of (seed, entity_id, sub_id) via DeterministicRNG.get_int(),
    with no occupancy awareness -- confirmed as the exact cause of the entity-6/entity-14
    tile-(27,38) collision this entry previously flagged as divergent. Fix: compile()
    now tracks occupied_entity_tiles (seeded from blocked_tiles/buildings and resource_node
    positions, updated as each entity is placed) and, only when a drawn tile actually
    collides, calls the new _resolve_entity_spawn_tile() helper to deterministically
    re-roll (bumped sub_id, still a pure function of seed/entity_id/sub_id) or, as
    a last resort, raster-scan the region''s bounding box for a free tile. Entities
    that never collided are never perturbed -- verified: a full corpus sweep (all
    18 worlds x seeds 42/137/999 = 63 combos) recompiled before/after the fix confirms
    zero entity positions changed except the 39 combos that had a real collision (all
    39 now resolved), and 3 repeated compiles of the same world/seed produce a bit-identical
    state_hash.

    '
  proof_type: parity
  test_path: tests/engine/test_hard_law_monitor.py::test_seed42_entity6_entity14_tile_27_38_collision
  divergence_note: 'Historical record (not deleted, per the INFRA-270 lineage convention):
    this entry was flipped to divergent by TCK-20260716-PLACELEGAL-HARDLAW after its
