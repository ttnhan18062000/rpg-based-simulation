- id: WORLD-029
  text: Calamity aura and regional hazards apply local debuffs/drain.
  status: verified
  priority: P0
  legacy_evidence: EnvironmentService handles hazard_level and calamity_intensity
    scaling.
  v2_evidence: "src/world/environment.py::EnvironmentService.calculate_hazard_drain\
    \ resolves the entity's catalog faction id (get_faction_id_str) and, via FactionSemanticsService.get_hazard_immunities,\
    \ exempts entities whose faction endures the region's hazard_kind (RegionState.hazard_kind)\
    \ from drain; all other entities take the unchanged hazard_level/calamity_intensity-scaled\
    \ drain. See src/engine/world_dynamics.py for the per-tick call site. TCK-20260703-SIMQ-UPLIFT3-WORLD-CORPUS\
    \ extended this corpus-wide, 7 modules (orc_clan_territory, bandit_road_trade_pressure,\
    \ old_mine_resource_loop, forest_warden_grove, undead_battlefield, nomadic_herd,\
    \ sunken_swamp_border) / 6 factions now declare hazard_kind/hazard_immunities,\
    \ exercised across the 5 newly-anchored worlds (frontier_extended, frontier_living_world,\
    \ wilderness_survival, highland_traverse, swamp_border_world), not only wolf_den_near_forest/goblin_camp_conflict.\
    \ TCK-20260708-DUNGEON-URBAN-POPULATION-COLLAPSE closed the remaining corpus gap\
    \ \u2014 3 more modules (ruins_mystery_quest, scalable_bandit_camp, trading_company_hub)\
    \ now declare hazard_kind matching their populating faction's hazard_immunities\
    \ (undead_remnants gains no new immunity \u2014 UNDEAD_CORRUPTION already existed;\
    \ merchant_league gains a new NATURAL_TERRAIN hazard_immunities entry), and urban_political's\
    \ stale compiled artifact (predating bandit_road_trade_pressure.yaml's already-landed\
    \ hazard_kind fix) was refreshed via a recompile \u2014 exercised by dungeon_crawl,\
    \ hero_guild_routing, and urban_political. TCK-20260708-GENERATED-FRONTIER-LATE-TICK-POPULATION-COLLAPSE\
    \ closed the last remaining module gap \u2014 moon_cult_ruins's moon_cave region\
    \ now declares a new hazard_kind, \"ARCANE_CORRUPTION\", matching a new arcane_circle\
    \ hazard_immunities entry (arcane_circle previously had zero hazard_immunities,\
    \ same pattern as merchant_league's prior fix) \u2014 exercised by generated_frontier_3_42,\
    \ the sole world composing moon_cult_ruins."
  proof_type: parity
  test_path: tests/unit/world/test_regional_consequences.py, tests/unit/worldassembly/test_corpus_diversity.py::test_hazard_kind_matches_populating_faction_immunity,
    tests/unit/worldassembly/test_corpus_diversity.py::test_population_stability,
    tests/unit/worldassembly/test_corpus_diversity.py::test_generated_frontier_3_42_extended_population_stability,
    tests/unit/worldbuilding/test_world_compiler.py::test_urban_political_resolved_bandit_road_hazard_kind_matches_source
  divergence_note: null
  support_boundary: null
- id: WORLD-060
  text: Regional hazards drain HP/Readiness based on intensity.
  status: verified
  priority: P0
  legacy_evidence: null
  v2_evidence: "src/world/environment.py::EnvironmentService.calculate_hazard_drain\
    \ \u2014 drain is hazard_level * (1.0 + calamity_intensity) * 10, scaled by MIASMA,\
    \ EXCEPT an entity whose resolved faction (FactionDefinition.hazard_immunities)\
    \ declares endurance to the region's hazard_kind (RegionState.hazard_kind), which\
    \ takes zero drain unconditionally. Endurance is faction-declared, not derived\
    \ from hostility-to-hero or from a legacy faction bucket (TCK-20260701-HAZARD-NATIVE-IMMUNITY).\
    \ TCK-20260703-SIMQ-UPLIFT3-WORLD-CORPUS extended this mechanism corpus-wide (7\
    \ modules, 6 factions, including a new \"UNDEAD_CORRUPTION\" hazard_kind for undead_battlefield\
    \ / undead_remnants), exercised across 5 newly-anchored worlds instead of only\
    \ wolf_den_near_forest/goblin_camp_conflict. TCK-20260708-DUNGEON-URBAN-POPULATION-COLLAPSE\
    \ fixed 3 remaining never-anchored modules (ruins_mystery_quest, scalable_bandit_camp,\
    \ trading_company_hub) that had never declared hazard_kind at all \u2014 the resolver's\
    \ PHYSICAL default (nothing immune) was silently draining their populating factions\
    \ unconditionally, reproducing the exact population-collapse pattern this parity\
    \ entry guards against. urban_political's compiled artifact was also refreshed\
    \ to pick up bandit_road_trade_pressure.yaml's already-fixed hazard_kind (stale-compile\
    \ bug, same class, separate cause). TCK-20260708-GENERATED-FRONTIER-LATE-TICK-POPULATION-COLLAPSE\
    \ fixed the last remaining never-declared module, moon_cult_ruins (moon_cave region),\
    \ gaining a new \"ARCANE_CORRUPTION\" hazard_kind matched by a new arcane_circle\
    \ hazard_immunities entry \u2014 exercised by generated_frontier_3_42."
  proof_type: parity
  test_path: tests/unit/world/test_regional_consequences.py, tests/unit/worldassembly/test_corpus_diversity.py::test_hazard_kind_matches_populating_faction_immunity,
    tests/unit/worldassembly/test_corpus_diversity.py::test_population_stability,
    tests/unit/worldassembly/test_corpus_diversity.py::test_generated_frontier_3_42_extended_population_stability,
    tests/unit/worldbuilding/test_world_compiler.py::test_urban_political_resolved_bandit_road_hazard_kind_matches_source
  divergence_note: null
  support_boundary: null
