    \ region's resource pressure. Two regions are adjacent when their bounding boxes\
    \ are within ADJACENCY_GAP (50 units) of each other. Propagated pressure is bidirectional\
    \ and capped at 1.0. Regions with no native resource pressure that receive spread\
    \ from neighbours get a new resource pressure entry at confidence=0.65.\n"
