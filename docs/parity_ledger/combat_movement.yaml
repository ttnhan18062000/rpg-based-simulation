- id: COMB-295
  text: 'TCK-20260806-PUSH-CUTOVER-COMBAT-ECONOMY-FACTION (final child of TCK-20260806-SIMQ-OBSERVABILITY-PUSH-MIGRATION-EPIC)
    -- cuts COMBAT observability event emission (combat_damage, combat_initiated,
    near_death_survival, entity_killed, hazard_drain_applied, hero_death_unrecorded)
    over to the apply-layer shaper registry (src/observability/event_shapers.py, built
    across INFRA-324/325) as the live default path. `ENABLE_PUSH_EVENT_SHAPERS` flipped
    to default "ON" (`FeatureFlagManager.__init__`) -- validated by TCK-20260806-PUSH-SHADOW-VALIDATION-PERF''s
    130/131-tick real-corpus match before this flip. `event_extractor.py`''s old diffing
    branches for these events are NOT deleted -- flag-gated (`if not _push_shapers_active:`)
    to fire only when the flag is explicitly set away from "ON", providing a real,
    working rollback (not a partial one) rather than requiring a code revert if a
    production issue surfaces.

    `entity_killed`/`hero_death_unrecorded` required special handling, not a clean
    branch removal: the shaper''s version is narrower by design (same-tick `outcome_kind=="KILL"`
    only, per INFRA-324''s reopen fix), while the old extractor''s Kill-events branch
    covers ANY `lifecycle.active` transition (old-age death, delayed hazard-transition
    death -- both confirmed real by the validation ticket). Removing the old branch
    wholesale would have silently dropped coverage for these non-KILL-tagged causes
    in production, not deferred it. Fixed by narrowing the old branch''s condition
    instead of removing it: `is_shaper_owned_kill = (_push_shapers_active and real_combat_upd
    is not None and real_combat_upd.outcome_kind == "KILL")`; the old branch fires
    `if not is_shaper_owned_kill`. When the flag is off, `is_shaper_owned_kill` is
    always False, restoring byte-identical pre-cutover behavior. Verified directly
    with real, non-mocked kernel runs (not just unit tests): `dungeon_crawl_seed42_500t`
    with the flag absent (real `AuthoritativeState. feature_flags` defaults to `{}`,
    confirmed) delivered all 39 combat/economy/faction events via `source_system="event_shapers"`;
    the same world with `ENABLE_PUSH_EVENT_SHAPERS="OFF"` produced byte-identical
    event counts via `source_system="event_extractor"`, confirming the rollback path
    is real, not theoretical. `hero_guild_routing_seed42_500t` confirmed the delayed-hazard-death
    case (entities 26/28/30, tick 5) still correctly emits `combat_kill` from the
    old extractor even in the new default-ON state.

    '
  status: verified
  priority: P0
  legacy_evidence: null
  v2_evidence: 'src/observability/event_extractor.py: `_push_shapers_active` flag
    read added at the top of `extract()` (defaults `"ON"` matching `FeatureFlagManager`''s
    new default when `state.feature_flags` doesn''t override it); combat_damage/combat_initiated/near_death_survival/
    hazard_drain_applied branches guarded `if not _push_shapers_active:`; Kill-events
    branch narrowed (not guarded wholesale) per the `is_shaper_owned_kill` logic above.
    src/domains/optimization/feature_flags.py:25 (`ENABLE_PUSH_EVENT_SHAPERS` default
    flipped OFF->ON). src/engine/kernel.py:909-935 (`_phase_observability`''s shaper-events
    block now extends `generated_events` -- delivered through the identical record/timeline
    path as `EventExtractor`''s own output -- when the flag is "ON"; "SHADOW" mode
    keeps constructing and logging only, for future Phase-2 validation reuse).

    '
  proof_type: regression
  test_path: 'tests/unit/observability/ full suite (798 passed, 6 skipped, unchanged
    from pre-cutover -- existing MagicMock-based tests are unaffected by the new default
    because MagicMock''s auto-attribute-creation on an unconfigured `feature_flags`
