    flip legal -> illegal as the new "none"-hostility relationship makes them protected allies; the
    remaining non-perspective-source pairs show no Friendly-Fire verdict change (same-bucket, "none"
    hostility, both fallbacks already agreed). The combat_rewards.py/is_hostile_compat() delta
    (alignment_bucket-based) independently flips False -> True for 4 of these pairs
    (orc_clan->wild_beast_pack, bandit_company->goblin_warband, bandit_company->undead_remnants,
    orc_clan->swamp_tribe) — confirming the two consumers' fallbacks are genuinely independent, not
    redundant checks of the same thing.
