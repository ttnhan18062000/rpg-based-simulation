  text: 'SHATTER combat mechanic: a "frozen" StatusEffectState present on the defender
    triggers a 1.5x attacker damage multiplier (atk_mult *= 1.5, trace["SHATTER"]
    = 1.5) in CombatResolutionSystem.calculate_tactical_multipliers(); "stunned" (without
    "frozen") does NOT trigger SHATTER -- the asymmetry is intentional and pinned
    by test.'
  status: verified
  priority: P0
  legacy_evidence: null
  v2_evidence: 'src/engine/combat.py:84-86 (CombatResolutionSystem.calculate_tactical_multipliers
    -- `if any(s.kind == "frozen" for s in defender.combat.status_effects): atk_mult
    *= 1.5; trace["SHATTER"] = 1.5`), reading the typed CombatComponent.status_effects:
    List[StatusEffectState] field (src/core/state.py). Migrated by TCK-20260831-STATUS-EFFECT-STATE-UNIFICATION
    off the prior identity.properties.get("status_frozen") dict lookup; zero production
    writers existed for the old dict flag pre-migration.'
  proof_type: parity
  test_path: tests/unit/combat/test_combat_legality_regression.py::test_shatter_logic
  divergence_note: null
