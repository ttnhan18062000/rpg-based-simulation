- id: COMB-296
  text: 'TCK-20260808-ENTITY-VITALS-OBSERVABILITY-GAP -- wound infliction, wound healing,
    and scar gain (EntityUpdate.wound_update / WoundState, ScarState) were durable
    state with zero observability coverage distinct from CombatUpdate''s own already-observed
    hp_delta/outcome (docs/event_ledger/entity.yaml ENTITY-018, previously `status:
    silent`). Adds three new events to src/observability/event_extractor.py''s diff
    loop: `wound_sustained` (new wound ID appears in entity.combat.wounds; severity
    CRITICAL >=0.7 / WARNING >=0.4 / INFO otherwise, keyed off the existing `WoundState.severity`
    field, no new threshold invented), `wound_healed` (an existing wound''s `healed`
    flag flips False->True), and `scar_gained` (new scar ID appears in entity.combat.scars).
    Full-coverage-by-design, same rationale as SUB-375''s biological/ stamina events
    (grouped in the same ticket, split across ledger files because wounds are a CombatUpdate
    field, not a biological/stamina one).

    '
  status: verified
  priority: P2
  legacy_evidence: null
  v2_evidence: '`wound_sustained` has a real production producer (`CombatResolutionSystem._get_wound_infliction`,
    `src/engine/combat.py:605-617`), gated only by `ENABLE_COMBAT_ENGAGEMENT` -- confirmed
    via a real, non-mocked `Kernel.tick_once()` integration test (`tests/integration/combat/test_wound_healing_permanence.py::test_wound_healed_and_scar_gained_have_zero_production_producers`)
    that observes a real wound land in `kernel.state.entities[...].combat.wounds`
    (authoritative state, not events) at tick 9 of a deterministic 40-tick run at
    seed 42. `wound_healed` and `scar_gained` have zero production producers, independent
    of `ENABLE_COMBAT_ENGAGEMENT`''s gate state: the only production constructor of
    `WoundUpdate` anywhere in `src/` (`combat.py:617`) never populates `wounds_heal`
    or `scars_add` (re-confirmed by full-repo grep this session), and the same 40-tick
    real-Kernel run never observes a `healed: False -> True` transition or a `ScarState`
    addition, in authoritative state, across the whole run -- see `TCK-20260824-WOUND-HEALING-DECISION`
    (wounds are declared intentionally permanent; no healing trigger is built).


    `src/observability/event_extractor.py`''s wound/scar diff blocks (lines ~280-281,
    ~302-303) previously had an independent bug (`isinstance(x, list)` instead of
    `isinstance(x, (list, tuple))`) that silently dropped event emission for all three
    events -- `wound_sustained`, `wound_healed`, and `scar_gained` -- once state was
    committed as a tuple by the real apply path (which it always is in production).
    This bug is now fixed by `TCK-20260829-HOTFIX-WOUND-SCAR-EVENT-EXTRACTOR-TUPLE-BLIND`:
    both checks now read `isinstance(x, (list, tuple))`, matching the pre-existing
    correct pattern already used elsewhere in the same file (`src/observability/event_extractor.py:1499`,
    `:1583`). `wound_sustained` now genuinely fires through the real event-observability
    layer, confirmed via a new real, non-mocked `Kernel.tick_once()` regression test
    (`tests/integration/observability/test_kernel_event_recording.py::test_wound_sustained_fires_through_real_tick_once_loop`)
    that observes the event land in `kernel._event_recorder.events` at tick 9 of the
    same deterministic 40-tick fixture, produced by the same real production wound.
    `wound_healed`/`scar_gained` event-layer reachability is fixed uniformly by the
    same change, but this does not make either event fire in production: no code anywhere
    constructs a non-empty `wounds_heal`/`scars_add` (see the zero-producer proof
    above), so there is nothing left for the now-correct diff blocks to detect.


    '
  proof_type: regression
  test_path: 'tests/unit/observability/test_event_extractor_vitals.py:: test_wound_sustained_severity_mapping,
    ::test_wound_healed_fires, ::test_scar_gained_fires; tests/integration/combat/test_wound_healing_permanence.py::test_wound_healed_and_scar_gained_have_zero_production_producers;
    tests/integration/observability/test_kernel_event_recording.py::test_wound_sustained_fires_through_real_tick_once_loop

    '
  divergence_note: null
  support_boundary: Emitted events are classified `unscored_intentional` (docs/simulation_quality/event_type_coverage.md
    Section 5) -- not wired to any SimQ pillar. `wound_sustained` now has both a real
    production producer (gated only by `ENABLE_COMBAT_ENGAGEMENT`) and confirmed real
    event-layer reachability, fixed by `TCK-20260829-HOTFIX-WOUND-SCAR-EVENT-EXTRACTOR-TUPLE-BLIND`
    (the prior `isinstance(x, list)` bug that silently dropped all wound/scar event
