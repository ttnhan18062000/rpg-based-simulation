    FactionAwarenessService.compute_tension_updates() emits FactionUpdate(tension_delta=+0.1)
    for each RESOURCE_DEPLETED WorldEvent whose region_id is in a faction's territory.
    Tension is capped at [0.0, 1.0] by apply.py (authoritative path). Uses
    state.recent_world_events (last-tick window — one-tick lag inherent). (E53Ad)
  status: verified
