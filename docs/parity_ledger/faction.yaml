    (WorldCompiler.compile()), sourced either from the catalog default (0.0) or a
    composition-level faction_tension_overrides entry
    (WorldAssemblyResolver.assemble()). Closes the "no bootstrap" gap where
    AuthoritativeState.factions was permanently seeded at tension_level=0.0 for every
    compiled world, which meant compute_transitions()'s pair_tension > 0.4 threshold
    could never fire and diplomatic_transition/faction_tension_delta had 0
    calibration_hits (TCK-20260702-SIMQ-UPLIFT2-FACTION).
    TCK-20260704-SIMQ-CORPUS-STRESS-WORLDS extends this with a second, authored-from-inception
    data point at frontier_extended-comparable scale (62 entities/9 regions):
    data/worlds/frontier_marches/world.yaml seeds faction_tension_overrides
    ({bandit_company: 0.5, orc_clan: 0.5}), confirmed to compile with 0 warnings and to seed
    FactionState.tension_level=0.5 for both factions via the same WorldCompiler.compile()/
    WorldAssemblyResolver.assemble() plumbing above — no new code path exercised, just a second
    real-world composition proving the mechanism scales beyond urban_political's 30-entity/
    3-region footprint.
  status: verified
  priority: P1
  legacy_evidence: null
  v2_evidence: >
    src/worldbuilding/schema.py::FactionSpec.initial_tension_level (bounded [0.0, 1.0]);
    src/worldassembly/schema.py::WorldCompositionSpec.faction_tension_overrides +
    NormalizedWorldComposition.faction_tension_overrides (mirrored, required for
