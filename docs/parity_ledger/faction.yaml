- id: FAC-011
  text: >
    MilitaryConflictPhase.execute() drains military_strength by 0.001/tick for each faction
    currently at WAR (deduplicated per faction, regardless of number of WAR pairs).
    When drain would push a faction from >= 0.3 to < 0.3, a WAR_ENDED_EXHAUSTION WorldEvent
    is emitted (significance=0.80) with subject="{fid_a}:{fid_b}".
    The autonomous WAR→NEUTRAL transition fires via DiplomaticStateMachine.compute_transitions()
    (Phase 8d) when both factions have military_strength < 0.3 on the prior state.
    Orphaned siege_state (region under siege but factions no longer at WAR) is cleared by
    emitting WorldUpdate(siege_state_clear=True, service_availability_delta=+1.0) at the
    top of execute() each tick. (E53Cd)
