- id: FAC-009
  text: >
    SiegeState is a frozen dataclass (slots=True) on RegionState.siege_state.
    RegionState.service_availability (float, default 1.0) tracks degraded service
    level during siege. WorldUpdate fields service_availability_delta, siege_state_set,
    siege_state_clear, siege_progress_delta drive siege apply-path mutations.
    apply_plan clamps service_availability to [0.0, 1.0] and siege_progress to [0.0, 1.0].
    siege_state_clear takes priority over siege_state_set for clearing. (E53Cb)
  status: verified
  priority: P1
  legacy_evidence: null
  v2_evidence: >
    src/core/state.py (SiegeState, RegionState.siege_state, RegionState.service_availability);
    src/core/updates.py (WorldUpdate.siege_state_set, siege_state_clear, siege_progress_delta,
    service_availability_delta, merge());
    src/engine/apply_plan.py (region apply block lines 125-140)
  proof_type: parity
  test_path: tests/unit/faction/test_siege_model.py
  divergence_note: null
  support_boundary: null

- id: FAC-010
  text: >
    When RegionState.siege_state.siege_progress >= 1.0 (clamped by apply_plan from previous
    tick), MilitaryConflictPhase.execute() emits: WorldUpdate(siege_state_clear=True,
    service_availability_delta=+1.0) to restore the region; FactionUpdate(territory_add)
    for the attacker and FactionUpdate(territory_remove) for the defender; WorldEvent
    TERRITORY_TRANSFERRED with subject="{attacker}:{defender}:{region_id}" (significance=0.85).
    No siege degradation delta is emitted on the transfer tick.
    RegionState.owner_faction_id (Optional[int]) is NOT set during transfer — the int/str
    type mismatch with FactionState.faction_id:str is a known limitation; authoritative
    ownership is tracked via FactionState.territory. (E53Cc)
  status: verified
  priority: P1
  legacy_evidence: null
  v2_evidence: >
    src/engine/military_conflict.py (execute — territory transfer block);
    src/domains/world_emergence/schema.py (WorldEventCategory.TERRITORY_TRANSFERRED);
    src/domains/campaigns/orchestrator.py (_SIGNIFICANCE_MAP["TERRITORY_TRANSFERRED"]);
    src/engine/apply.py (lines 328-354, territory_add/remove application)
  proof_type: parity
  test_path: tests/unit/faction/test_territory_transfer.py; tests/integration/scenarios/test_faction_campaign.py
  divergence_note: >
    RegionState.owner_faction_id not updated on transfer (int vs str type mismatch).
    Authoritative ownership via FactionState.territory only.
  support_boundary: null

- id: FAC-011
  text: >
    MilitaryConflictPhase.execute() drains military_strength by 0.001/tick for each faction
    currently at WAR (deduplicated per faction, regardless of number of WAR pairs).
    When drain would push a faction from >= 0.3 to < 0.3, a WAR_ENDED_EXHAUSTION WorldEvent
    is emitted (significance=0.80) with subject="{fid_a}:{fid_b}".
    The autonomous WAR→NEUTRAL transition fires via DiplomaticStateMachine.compute_transitions()
    (Phase 8d) when both factions have military_strength < 0.3 on the prior state.
    Orphaned siege_state (region under siege but factions no longer at WAR) is cleared by
    emitting WorldUpdate(siege_state_clear=True, service_availability_delta=+1.0) at the
    top of execute() each tick. (E53Cd)
  status: verified
  priority: P1
  legacy_evidence: null
  v2_evidence: >
    src/engine/military_conflict.py (exhaustion drain loop, orphan cleanup, WAR_ENDED_EXHAUSTION);
    src/domains/world_emergence/schema.py (WorldEventCategory.WAR_ENDED_EXHAUSTION);
    src/domains/campaigns/orchestrator.py (_SIGNIFICANCE_MAP["WAR_ENDED_EXHAUSTION"]);
    src/domains/faction/diplomatic_state_machine.py (compute_transitions WAR→NEUTRAL rule)
  proof_type: parity
  test_path: tests/unit/faction/test_war_exhaustion.py; tests/integration/scenarios/test_faction_campaign.py::test_war_exhaustion_ends_conflict
  divergence_note: >
    SEEK_PEACE directive (transient FactionDirective) is not implemented — FactionDirective
    cannot flow through StateUpdate. The autonomous Phase 8d WAR→NEUTRAL rule covers the
    same outcome when both factions hit < 0.3.
  support_boundary: null
