- id: TOWN-187
  text: >
    Resource regeneration is density-dependent: nodes in heavily populated regions regenerate
    slower, creating scarcity pressure that drives entity migration and territorial competition.
    effective_regen = max(1, round(regen_rate_per_tick * density_mod)) where
    density_mod = max(0.25, 1.0 - entity_count/16 * 0.75) (linear from 1.0 at 0 entities
    to 0.25 at ≥16 entities). Effective regen is always at least 1 charge per ecology cycle.
  status: verified
  priority: P1
  legacy_evidence: null
  v2_evidence: >
    src/world/ecology.py — ResourceEcologyService.DENSITY_CAP=16, DENSITY_FLOOR=0.25;
    _density_modifier(entity_count) → linear interpolation; process_ecology() calls
    _region_entity_counts(state) once per cycle and applies density_mod per node.
    Verified by TCK-20260628-E21D-DENSITY-REGEN.
  proof_type: parity
  test_path: tests/unit/world/test_resource_ecology.py::test_crowded_region_reduces_effective_regen
  divergence_note: >
    New mechanic introduced in TCK-20260628-E21D-DENSITY-REGEN. No prior behavior existed —
    regen was flat (regen_rate_per_tick per cycle regardless of entity density).
  support_boundary: null

