- id: SOC-CHRON-003
  text: "ChronicleNamer produces human-readable deterministic names for milestones\
    \ and eras. name_milestone(entry, entity_names, faction_names=None, region_names=None)\
    \ resolves subject as follows: if subject_id contains \":\" \u2192 split on first\
    \ \":\" into source_id / target_id, resolve each via faction_names (fallback to\
    \ raw ID) \u2192 {source_faction} / {target_faction}; elif template uses {region_name}\
    \ \u2192 resolve via region_names (fallback to raw subject_id); else \u2192 safe\
    \ int-cast of subject_id against entity_names (raw-string fallback). Template\
    \ applied via format_map(defaultdict(str, ...)) to avoid KeyError on extra or\
    \ missing keys. TEMPLATES keys are lowercase (E53Da: renamed from uppercase to\
    \ match E53Bd lowercase emission). Faction templates: war_declared, territory_transferred,\
    \ alliance_formed, peace_treaty, betrayal, siege_begins. Faction era names: war_declared\
    \ \u2192 \"The Age of War\", alliance_formed \u2192 \"The Age of Alliances\",\
    \ territory_transferred \u2192 \"The Age of Conquest\". name_era fallback: \"\
