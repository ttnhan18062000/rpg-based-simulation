- id: SOC-CHRON-002
  text: >
    ChronicleGrouper transforms flat NarrativeLedgerEntry lists into a four-level
    ChronicleHierarchy (events → incidents → episodes → eras). Filtering: only
    chronicle-worthy entries (EventSignificanceScorer.is_chronicle_worthy) pass
