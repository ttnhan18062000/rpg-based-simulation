    Patch.apply() merge path StrategicComponent.contracts already uses. ContractService.get_project_mapping()
    returns None for MARRIAGE by construction -- it is not widened, so MARRIAGE never
    materializes a tier-5 strategic project. Bigamy prevention, household/family/dependents
