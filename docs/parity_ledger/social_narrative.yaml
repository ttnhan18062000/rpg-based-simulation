    Enum) (src/core/models/social.py:7-11) with values NEUTRAL/FRIEND/RIVAL. It is
    settable only through the authoritative update path: SocialBondUpdate.role_set:
    Optional[RelationshipRole] = None (src/core/updates.py:276, on the SocialBondUpdate
    dataclass starting line 270), applied in RelationshipService.process_update()
    (src/systems/social_systems/relationships.py:16) via a set-if-provided clause
    `role=b_upd.role_set if b_upd.role_set is not None else bond.role` (src/systems/social_systems/relationships.py:61)
    -- no direct mutation, consistent with the authoritative-update law already governing
    this method under SOC-217. PartyCompositionScorer.score() (src/systems/social_systems/party_composition.py)
    adds a new ROLE_AFFINITY_WEIGHT=0.10 term (party_composition.py:47, alongside
    the existing TRUST_BONUS_WEIGHT=0.15 term at party_composition.py:46 from SOC-244)
    via score_role_affinity() (party_composition.py:158-166) and _candidate_role_value()
    (party_composition.py:143), folded into score()''s weighted sum (party_composition.py:171-201)
    as: score = clamp(base_score + TRUST_BONUS_WEIGHT(0.15)*trust_term + ROLE_AFFINITY_WEIGHT(0.10)*role_term,
    0.0, 1.0), where role_term is the mean across the candidate pool of the acting
    entity''s directed bond role toward each candidate: FRIEND -> +1.0, RIVAL -> -1.0,
    NEUTRAL-or-no-bond -> 0.0 (empty pool -> 0.0). This produces a strictly ordered,
    measurably different score for otherwise-identical pools with fixed familiarity/sentiment/OCEAN
    inputs: score(FRIEND) > score(NEUTRAL) > score(RIVAL). RelationshipRole is independent
    of nemesis_ids/grudge_history-driven nemesis promotion: no code path in the nemesis-promotion
    logic reads RelationshipRole, and no code path that sets role_set reads or writes
    nemesis_ids/grudge_history.'
