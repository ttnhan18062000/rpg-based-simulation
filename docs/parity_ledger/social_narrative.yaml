- id: SOC-CROSS-EP-005
  text: "evaluate_social_consequence() is a pure, deterministic function that reads\
    \ cross-episode social memory from CampaignState and returns a list of SimulationEvent\
    \ instances when an entity encounter triggers one of three consequence event kinds:\
    \ KNOWN_TRAITOR_SPOTTED fires when faction_social_memories entity_hostility >=\
    \ 0.5 (traitor-level grudge persisted from a prior episode); LEGENDARY_ARRIVAL\
    \ fires when social_memories faction_reputation[\"default\"] >= 0.9 (outstanding\
    \ cross-episode reputation); OLD_DEBT_COLLECTED fires when relationship_scores\
    \ has a score >= 0.5 for any known entity (at most one per encounter, first by\
    \ sorted key for determinism). Function never mutates entity, campaign_state,\
    \ or any registry. Does not import from src.engine or src.core.state. Events are\
    \ SimulationEvent subclasses (Pydantic BaseModel) \u2014 not raw domain objects.\
    \ All three event kind string constants are importable directly from src.observability.events.\
    \ Wired into a real call site: CampaignOrchestrator._build_initial_state() calls\
    \ evaluate_social_consequence() once per spawned entity, iterating sorted(entities.keys())\
    \ for deterministic emission order, with faction_id = f\"faction_{entity.identity.faction}\"\
    \ (matching _extract_faction_carry_forwards()'s existing convention). Returned\
    \ events are emitted via self._event_recorder.record() directly (SimulationEvent,\
    \ not WorldEvent \u2014 this constructor call site has no StateUpdate/ApplyPath\
    \ world_events_add merge step available). Read-only: never mutates entity, campaign_state,\
    \ or the entities dict; no-ops safely when no event_recorder is injected.\n"
