- id: SOC-228
  text: >
    PartyLifecycleService.check_leadership() evaluates sociability-based leadership
    election every LEADERSHIP_CHECK_INTERVAL (100) ticks. If the highest-sociability
    member exceeds the current leader's sociability by >= 0.2, the new leader is
    elected (lowest entity id as tiebreaker). A LeadershipChangedEvent (category=social,
    event_type=leadership_changed) is emitted with old_leader_id, new_leader_id,
    group_id, and morale payload. Sociability is read from
    entity.identity.personality.sociability. No election fires when the interval
    has not elapsed.
  status: verified
