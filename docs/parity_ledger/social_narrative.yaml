- id: SOC-CHRON-001
  text: 'EventSignificanceScorer classifies NarrativeLedgerEntry objects for Chronicle
    inclusion. score() returns BASE_SIGNIFICANCE.get(event_type, 0.1) + hero_bonus
    (0.3 if payload["entity_role"]=="HERO"), capped at 1.0. is_chronicle_worthy()
