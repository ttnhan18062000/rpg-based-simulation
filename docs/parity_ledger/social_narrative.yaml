    \ = (state.clans[clan_id].clan_reputation / 2.0) if the source belongs to a Clan\
    \ else 0.5; the pinned no-clan-case formula (public_trust * 0.7 + history_trust\
    \ * 0.3) is preserved bit-for-bit because the delta term evaluates to exactly\
    \ 0.0 when clan_trust == 0.5 (no Clan / neutral default). Cross-referenced by\
