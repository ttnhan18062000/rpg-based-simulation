- id: SOC-241
  text: 'TCK-20260807-QUEST-EVENT-TYPE-FILTER-BUG -- `event_extractor.py`''s "Quest
    progress lifecycle events" block (the source of `quest_event`, translated by `quality_hub.py`''s
    `_translate_quest_event()` into `quest_started`/`quest_completed`/`quest_failed`
    for `NarrativeScorer`) had no `isinstance(qstate, QuestState)` filter -- it constructed
    a `QuestEvent` for every strategic project of any kind (quests or not), mislabeling
    `GoalKind`-typed AI strategic goals (`TOWN_RETURN`/`COMBAT_ENGAGE`/`HARVESTING`/etc.)
    as quest activity. Confirmed via real corpus data (`TCK-20260806-SIMQ-QUEST-COMPLETION-PACING-PROBE`
    Finding 2): 182-700 "quest_event" messages per 2000-tick run, none an actual quest.
    Also read `.status` (generic `ProjectStatus`) instead of `.quest_status` (the
    `QuestStatus` field `QuestService`/`QuestResolutionSystem` actually mutate).

    A second, deeper bug found during this ticket''s own Implement phase: `QuestEvent.status`
    is a top-level Pydantic field, never copied into `.payload` by `QuestEvent.__init__`
    -- `ObservabilityEventEnvelope.from_simulation_event()` only carries `.payload`
    through, so `_translate_quest_event()`''s `payload.get("status", "started")` always
    returned the default `"started"` regardless of the real status, even with a correct
    field read. Fixed narrowly at `event_extractor.py`''s own construction sites (`payload={"status":
    ...}` added explicitly), not at the `QuestEvent`/`ObservabilityEventEnvelope`
    class level -- confirmed `src/observability/behavior/normalizer.py:244` already
    correctly prefers the direct attribute over payload for a different consumer,
    so a class-level change carried unnecessary wider risk.

    Also found: `QuestStatus` has no `FAILED` value at all (`ACTIVE`/`COMPLETED`/
    `REWARD_PENDING`/`REWARDED` only, per `docs/simulation/quest_contract.md`''s own
    documented lifecycle) -- `NarrativeScorer`''s `quest_failed` branch (`src/simulation_quality/scorers/
    narrative.py:84-85`) can therefore never fire from a real quest''s own lifecycle;
    a permanent structural limitation, not a new bug, not fixed here (out of scope
    -- would require either a new `QuestStatus` value or a different failure-detection
    mechanism entirely).

    '
  status: verified
  priority: P2
  legacy_evidence: null
  v2_evidence: 'src/observability/event_extractor.py -- QuestState import, isinstance-gated
