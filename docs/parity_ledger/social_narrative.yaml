- id: SOC-CROSS-EP-004
  text: 'FactionSocialMemory provides a collective faction-level hostility record
    that persists across episodes regardless of whether individual faction members
    survive. entity_hostility (Dict[int, float]) tracks per-entity offense scores
    (max of all observed offenses); episode_of_offense (Dict[int, int]) tracks the
    first episode the offense was recorded. FactionSocialMemoryExporter.build_from_events()
    is a pure function processing social event dicts with kind "betrayal" or "attack"
    and a faction_id. Max-hostility semantics: existing scores are never lowered.
    First-offense episode semantics: episode_of_offense is set only on first occurrence.
    CampaignState.faction_social_memories (Dict[str, FactionSocialMemory]) is serialized
    with str-keyed to_dict/from_dict, sorted for determinism. int entity_id keys are
    str-converted for JSON and restored to int on read.

