- id: SOC-260
  text: 'Genetic inheritance/combination (idea 32, Reproduction): GeneticsSystem.combine_profiles(parent_a,
    parent_b, *, combat_lean, seed) -> GeneticProfile (src/systems/lifecycle_systems/genetics.py)
    is GeneticsSystem/GeneticProfile''s first real, live, non-test, non-shim caller.
    Per attribute, the child multiplier is a convex combination of both parents''
    values, convex-blended with a generate_profile_from_seed(seed) perturbation draw
    (0.6/0.4 weighting), then -- only when combat_lean is True and the attribute is
    strength_mult/agility_mult/constitution_mult -- pulled 35% of the remaining distance
    toward the 1.3 ceiling; the result is clamped to [0.8, 1.3]. Every step is a convex
    combination of values already in that range or an explicit clamp, so the range
    law holds by construction. combat_lean is True only when both parents'' IdentityComponent.role
    == EntityRole.HERO; any other parent-role pairing (civilian CITIZEN/SHOPKEEPER,
    WORKER/GUARD, or a mismatch) falls through to the same neutral default -- this
    is the general fallthrough for any non-double-HERO pairing, not a rule scoped
    narrowly to CITIZEN/SHOPKEEPER. LifecycleComponent gains genetic_profile: Optional[GeneticProfile]
    (default None, to_canonical_dict() asdict()-serialized), written only through
    LifecycleUpdate.genetic_profile_set applied via LifecyclePatch.apply -- the sole
    authoritative LifecycleComponent write path, never a direct replace(). V2EntityBuilder.birth_record()
    gains parent_a_genetic_profile/parent_b_genetic_profile/parent_a_role/parent_b_role
    kwargs (all Optional, default None) that trigger combine_profiles() and write
    the result via .lifecycle(genetic_profile=...); a missing parent profile falls
    back to generate_profile_from_seed() seeded on that parent''s entity id, since
    no live spawn path yet populates a parent''s own genetic_profile. Cross-references
    SOC-259 (the birth-record schema this entry''s write path extends). The natural-creature
    and magical/demonic parentless spawn paths never pass parent profiles, so genetic_profile
    stays None for those entities (confirmed by dedicated anti-drift test).'
