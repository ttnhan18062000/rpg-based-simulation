- id: SOC-CROSS-EP-003
  text: >
    SocialMemoryDecay.apply_decay() decays cross-episode relationship scores and
    faction reputation toward neutral before each episode import. Positive scores
    (friendships) decay at 40% per episode (half-life ≈ 3 episodes); negative scores
    (grudges) decay at 10% per episode (half-life ≈ 7 episodes), making betrayal
    harder to forget than cooperation. Faction reputation always decays at the
    friendship rate. Decay is pure and deterministic: no randomness, no side effects;
    uses round(..., 4) for bounded float precision. Applied inside
    SocialMemoryImporter.apply() before merging scores, transparent to callers.
  status: verified
  priority: P1
