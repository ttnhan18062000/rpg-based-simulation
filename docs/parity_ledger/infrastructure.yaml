    ::test_spend_proxy_by_phase_merges_casing_variants; ::test_normalization_leaves_unknown_workflow_and_unrecognized_phase_untouched;
    ::test_create_tickets_prefix_family_agent_not_merged_into_a_literal. All 6 new plus the 1
