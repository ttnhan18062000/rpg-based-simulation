    at :444, :485, :566, :635, :751, :812, :961, :1053, :1116, :1170 (each now `events.length
    + 1 + seqOffset`). tools/agent-monitoring/validate.py:170-192 (`compute_multi_invocation_collision_report(events)`
    -- Counter-based grouping on `(phase == "Scope", seq == 1, run_id)`, flags any
