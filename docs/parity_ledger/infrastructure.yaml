- id: INFRA-357
  text: 'Knowledge Gateway MCP budget-accounting JSON structural-overhead closure
    -- TCK-20260818-KGMCP-BUDGET-JSON-OVERHEAD-ACCOUNTING (follow-up to INFRA-356,
