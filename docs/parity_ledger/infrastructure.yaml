- id: INFRA-255
  text: >
    normalized_score uses max(floor_tick, last_event_tick) as divisor for all pillars,
    where floor_tick = max(1, current_tick // 4) and last_event_tick is the tick of the
    most recent scored event tracked by PillarAccumulator. Falls back to current_tick
    when last_event_tick == 0 (no events scored). Idle post-event ticks do not dilute
    grades; initialization-burst pillars are damped by the floor.
    (TCK-20260702-SIMQ-UPLIFT-GRADE-DECAY)
  status: verified
  priority: P1
  legacy_evidence: null
  v2_evidence: >
    src/simulation_quality/quality_report.py (QualityReportBuilder.build):
    floor_tick = max(1, effective_tick // 4);
    effective_denominator = max(floor_tick, last_event_tick) if last_event_tick > 0 else effective_tick.
    src/simulation_quality/pillar_accumulator.py: last_event_tick field tracked in add().
  proof_type: parity
  test_path: tests/simulation_quality/test_report.py::test_combat_grade_stable_across_tick_counts_for_same_activity
  divergence_note: >
    Introduced by TCK-20260702-SIMQ-UPLIFT-GRADE-DECAY. Prior formula divided by current_tick;
    same raw_score received B at 401t vs A at 200t (H2 dilution artifact). Floor prevents
    S-inflation for initialization-burst pillars (AGENCY fires all events at tick 1).
    Rationale class: Bug Fix / Bounded.
    (TCK-20260707-SIMQ-LONGRUN-HOTPILLAR-ANCHORS) unit_faction_tension_seed42 1000t→2000t FACTION
    A→B is a second confirming data point: raw_score/event_count byte-identical (145.0/29) across
    both runs, normalized_score halves exactly as floor_tick doubles (250→500) — matching
    dungeon_crawl's already-documented A→B pattern.
    Cross-check (TCK-20260713-SIMQ-SCORE-CEILING-FIX): this formula is unchanged by that ticket —
    the fix found WORLD/ECONOMY/PROGRESSION/INFORMATION could never reach A/S under the formula
    as-is because their positive per-event weights were too small relative to this same divisor,
    not because the divisor itself was wrong (confirmed by NARRATIVE/COMBAT reaching real A/S
    spread under the identical formula). See WORLD-110 (world_dynamics.yaml) and
    SIMQ-CALIBRATED-001 for the weight-side fix.
  support_boundary: null

