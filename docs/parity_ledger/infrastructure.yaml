- id: INFRA-200
  text: >
    ShutdownReport dataclass (src/core/lifecycle.py) produced by Kernel.shutdown()
    and cached as _last_shutdown_report. Accessible via kernel.shutdown_report().
    Fields: workers_started, workers_stopped, open_file_handles (psutil or -1),
    pending_replay_flushes (from replay_metrics()), survival_event_counts (from
    EventRecorder._survival_event_counts), outcome ("SUCCESS"/"PARTIAL"/"FAILED"),
