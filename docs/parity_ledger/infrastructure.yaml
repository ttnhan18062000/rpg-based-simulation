    + pass/fail/error/skip status from the head JUnit XML), parse_collect_only_ids()/_normalize_collect_only_node_id()
    (parses and normalizes the base branch''s collect-only listing to the same classname::name
    form), and classify_new_vs_existing() (splits head test IDs into new-vs-existing
    buckets, each with its own passed/failed/errors/skipped counts, errors broken
    out as its own column to match the existing all-tests row''s shape). render_markdown_table()
    and main() both gain an optional, default-None breakdown/base_collect_only_path
    parameter -- omitted or None output is byte-for-byte identical to the pre-extension
    behavior. The Job summary step now unconditionally passes "/tmp/base-collect.txt"
    as a third CLI argument; on a non-PR run (push/schedule/workflow_dispatch) or
    any git fetch/worktree/collection failure, that file never exists, main() treats
    a missing/empty path as base_ids=None, and classify_new_vs_existing() returns
    None -- the single fallback path that covers both "no PR to diff against" and
    "PR present but base-branch collection failed," rendering only the pre-existing
    single-row table with no error or broken output. Known limitation (not fixed by
    this ticket): the base-branch collect-only pass reuses the head job''s already-installed
    requirements.txt environment rather than a fresh base-branch install, so dependency
    drift between base and head can cause some base-branch tests to fail to collect
    -- this degrades to over-counting tests as "new" (fail-open), never a hard failure.
