- id: INFRA-284
  text: >
    Outlier flagging added to the agent-monitoring retro report (TCK-20260719-RETRO-OUTLIER-FLAGS):
    D25 (experiments/audit_expansion/PROPOSAL.md F2/F3) found a ~2000x duration_s spread and a
    >10x cost_proxy_score spread within the same phase/agent pair, both with zero recorded
    investigation -- nothing in generate_retro.py flagged either before this ticket. Fix: a new
    generic _flag_outliers(items, group_key_fn, value_fn, multiplier) helper groups items,
    computes each group's statistics.median, and returns items exceeding
    OUTLIER_MEDIAN_MULTIPLIER=3 times that median (a group below _OUTLIER_MIN_GROUP_SIZE=3 is
    skipped -- a 1-2-point median is not a meaningful baseline), excluding null values from both
    the candidate set and the median basis. Wired for duration_s (grouped by tier -- runs.jsonl
    has no phase field, and a global median across hotfix/standard/epic would be meaningless given
    their differing natural durations) and cost_proxy_score (grouped by *normalized* phase, reusing
    TCK-20260719-PHASE-AGENT-CASE-FOLD's _normalize_phase from the immediately-preceding ticket in
    the same batch -- a casing-fragmented phase would otherwise silently split one real outlier
    group into several too-small groups). New "outliers" key added to compute_retro_metrics()'s
    return dict, plus a matching conditionally-rendered "## Outliers" Markdown section (placed
    immediately after the existing "## Slow Runs" section, with explanatory text distinguishing
    the two -- Slow Runs is a fixed 30-min absolute threshold, Outliers is a relative Nx-median
    signal, and the two may legitimately both flag the same run without being redundant).
    Real-data end-to-end verification (generate_retro.py --all against the full live corpus)
    automatically surfaced D25's own originally-cited 34,837 cost_proxy_score finding as a live
    444.1x outlier, confirming the fix closes the gap D25 identified. Explicitly does NOT expose
    the new key to the Agent Ops Dashboard -- src/api/agent_ops_dashboard/ingest.py's
    get_agent_monitoring_stats() builds AgentMonitoringStats via explicit per-field typed submodel
    construction, not **metrics passthrough, so the new key is silently absent there until a
    separate, deliberate future ticket wires it through (confirmed by direct code read, not
    assumed from the source proposal's claim that the dashboard "benefits automatically" -- that
    claim is false and the ticket body corrects it explicitly).
  status: verified
  priority: P2
  legacy_evidence: null
  v2_evidence: >
    tools/agent-monitoring/generate_retro.py:218 (`OUTLIER_MEDIAN_MULTIPLIER = 3`), :222
    (`_OUTLIER_MIN_GROUP_SIZE = 3`), :225 (`def _flag_outliers(items, group_key_fn, value_fn,
    multiplier=OUTLIER_MEDIAN_MULTIPLIER)`), wired into `compute_retro_metrics()`'s new `outliers`
    key at :501 (duration_s grouped by `r.get("tier", "unknown")`, cost_proxy_score grouped by
    `_normalize_phase(e) or "?"`), with matching Markdown rendering in `generate()` immediately
