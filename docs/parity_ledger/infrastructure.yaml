- id: INFRA-288
  text: 'Resume-across-sessions `seq` collision fix (TCK-20260728-MONITORING-PAUSE-RESUME-SEQ-
    COLLISION): a third, distinct mechanism from TCK-20260711-MONITORING-TOOLCOUNT-SIDECAR-
    COLLISION (INFRA''s already-documented within-session gaps). When a ticket''s
    run is paused mid-pipeline and resumed later as a genuinely separate `implement-ticket.js`
    invocation sharing the same `run_id`, every `seq`-producing site (`pushEvent`''s
    `events.length + 1` and each of the 10 `writeSidecar(events.length + 1, ...)`
    call sites, plus the Scope-phase resume-branch''s own inline sidecar write) derived
    `seq` purely from the resumed session''s own in-memory `events` array, which restarts
    at 0 -- so the resumed session''s `seq` values silently collided with and aliased
    onto the pre-pause session''s `(run_id, seq)` buckets in `tools.jsonl`, corrupting
    `tool_call_count`/`cost_proxy_score` attribution for every phase from the resume
    point onward. Confirmed concretely on TCK-20260714-SIMQ-WEIGHTS-PILLAR-COLLISION
    (5 of 6 post-resume phases reported the exact ground-truth values of the pre-pause
    session''s phase at the same seq) and empirically bounded to 8 affected `run_id`s
    in the live corpus via the `>1 Scope/seq=1 event` signature. Fix: new `tools/agent-monitoring/seq_offset.py::compute_seq_offset(run_id,
    events)` (pure, read-only) looks up the max prior `seq` already recorded for `run_id`
    in `agent-monitoring/events.jsonl` (0 for a brand-new ticket); `implement-ticket.js`
    computes it once at Scope-phase resume via `resolveSeqOffset(ticketId)` into a
    `seqOffset` variable, then adds `+ seqOffset` to all 11 seq-producing expressions
    (`pushEvent`''s and all 10 `writeSidecar` call sites) plus the Scope resume-branch''s
    inline `seq: seqOffset + 1`. Detection: new `tools/agent-monitoring/validate.py::compute_multi_invocation_collision_report()`
    flags any `run_id` with more than one `phase="Scope", seq=1` event (the historical
    signature used to find the 8 affected run_ids), wired into `main()`''s printed
    report alongside the existing `compute_tool_count_drift_report`. Prevention-only,
    matching the sibling ticket''s precedent -- historical corrupted `tool_call_count`/`cost_proxy_score`
    values for the 8 already-affected run_ids are not backfilled. No `src/` file touched
    -- this is agent-orchestration/monitoring- pipeline tooling only, no simulation
    engine, mechanics, or determinism behavior involved.

    '
  status: verified
  priority: P2
  legacy_evidence: null
  v2_evidence: 'tools/agent-monitoring/seq_offset.py (`compute_seq_offset(run_id,
    events)`, pure/read-only, plus a `MARKER:`-prefixed-JSON `__main__` CLI entrypoint
    mirroring `scope_ticket_relocate.py`''s shape). .claude/workflows/implement-ticket.js:47-66
