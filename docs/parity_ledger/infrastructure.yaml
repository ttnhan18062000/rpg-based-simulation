- id: INFRA-258
  text: >
    Kernel tick-alignment fix: Kernel._phase_advancement() (src/engine/kernel.py:702-736)
    reassigns self._state to the post-advance tick before calling _phase_observability(prior_state,
    update), but three Resolution-phase-stamped properties (last_assimilated_tick,
    phase.py:77; last_calamity_tick_set, calamity.py:56; RuntimeStatus.last_transition_tick,
    runtime_status.py:79, set via reset_dwell() from _phase_init(), kernel.py:535-541) are all
    stamped using the pre-advance tick. EventExtractor.extract()'s and _phase_observability's
    == tick checks (event_extractor.py:286, event_extractor.py:899, kernel.py:836) compared these
    against the post-advance tick local, so belief_assimilated/belief_updated, calamity_spawned,
    and GovernorModeChanged could never match through the real Kernel.tick_once() loop — a
    pre-existing bug discovered while empirically verifying
    TCK-20260703-SIMQ-INFORMATION-BELIEF-TRIGGER's Step 6 against the real Kernel loop (not
    introduced by that ticket's schema/compiler/resolver work). Fixed by comparing each of the 3
    sites against prior_state.tick (already an in-scope parameter at all 3 call sites) instead of
    the shared post-advance tick variable, leaving the tick label on every emitted
    SimulationEvent (including InvariantViolation and GovernorModeChanged's own tick field)
    unchanged. Verified correct for all 3 event types via 3 dedicated unit tests
    (tests/integration/observability/test_kernel_event_recording.py) that drive the real
    Kernel.tick_once() loop directly, all passing:
    test_belief_assimilated_fires_through_real_tick_once_loop,
    test_calamity_spawned_fires_through_real_tick_once_loop,
    test_governor_mode_changed_fires_through_real_tick_once_loop.
    belief_assimilated/belief_updated additionally confirmed firing (calibration_hits == 1 per
    run) across all 7 urban_political_* calibration runs via calibrate_simq.py through the live
    loop, and GovernorModeChanged confirmed firing naturally (63-73 occurrences) in the existing
    dungeon_crawl_seed{42,123,456}_2000t / sandbox_world_seed42_2000t baselines (infrastructure
    telemetry, not SimQ-scored). calamity_spawned's fix mechanism is proven correct by its
    dedicated unit test (which constructs a state meeting CalamityService's spawn gates
    directly), but a one-off diagnostic calibration run (dungeon_crawl_seed42_5200t, not added
    to grade_anchors.json) did not naturally produce a calamity_spawned event: CalamityService
    additionally requires calamity_intensity > 0.3 in some region, which is only raised when a
    hero-kind entity dies in a hazard_level > 0.5 region; in that run's RNG/gameplay, monsters
    died but no hero died, so intensity never crossed the threshold. This is a separate,
    pre-existing content/mechanics precondition, unrelated to and not fixed by this kernel
    tick-alignment fix — the fix un-blocks calamity_spawned's tick-gate comparison, not its
    content-side intensity precondition. Do not read this entry as claiming calamity_spawned
    now produces calibration_hits > 0 in any calibrated scenario.
  status: verified
  priority: P1
  legacy_evidence: null
  v2_evidence: >
    src/engine/kernel.py:702-736 (Kernel._phase_advancement(), prior_state/self._state
    reassignment ordering); src/engine/kernel.py:806-855 (_phase_observability(), the
    prior_state.tick fix at line 836); src/observability/event_extractor.py:286,899 (the two
    prior_state.tick fixes); src/domains/information/phase.py:77 (last_assimilated_tick stamped
