- id: INFRA-380
  text: 'CI job summary reporting: each of the 9 fast-lane pytest jobs in .github/workflows/test.yml
    emits --junit-xml=reports/junit/<job-key>.xml, and a subsequent if: always() ''Job
    summary'' step pipes tools/ci_junit_summary.py''s markdown output (pass/fail/error/skip
    counts plus duration) into $GITHUB_STEP_SUMMARY. main() always returns 0 so the
    summary step can never become a second failure gate independent of the pytest
    job''s own exit code. The slow and migration-lanes jobs are deliberately left
    untouched since neither shares the fast-lane jobs'' single pytest-line shape.
    (TCK-20260823-CI-STEP-SUMMARY-REPORTING)


    Extended by TCK-20260824-CI-NEW-EXISTING-TEST-SPLIT: on pull_request runs only
    (if: github.event_name == ''pull_request''), each of the 9 jobs gains two additional
    steps after Run -- a ''Fetch base branch for collect-only diff'' step (git fetch
    origin "${{ github.base_ref }}" --depth=1 then git worktree add /tmp/base-checkout
    FETCH_HEAD, each guarded by its own fail-open ''if ! ...; then ...; exit 0; fi'')
    and a ''Base branch test collection'' step (cd /tmp/base-checkout && pytest <job''s
    own path list> -m "not slow and not extra_slow" --collect-only -q > /tmp/base-collect.txt
    2>&1 || true, run only if the worktree directory exists). The cd-prefixed form
    is deliberate: a bare pytest ...  line would be independently tokenized by tools/gate_checks/ci_workflow_test_coverage.py::_extract_pytest_paths.
