    (`def _normalize_phase(e)`), :130 (`def _normalize_agent(e)`) -- all three resolve via
    `vocabulary.py`'s `infer_workflow`/`WORKFLOW_PHASES`/`WORKFLOW_AGENTS`, the same imported
    module object `record_events.py`/`validate.py` already share (no second hardcoded vocabulary
    list). Wired into `compute_retro_metrics()`'s `agent_status_distribution`,
    `spend_proxy_by_phase`, `spend_proxy_by_agent` aggregations, and the new
