- id: INFRA-347
  text: 'Knowledge Gateway MCP Phase 3 packet-assembly hardening -- TCK-20260816-KGMCP-P3-PACKET-DEDUP-BUDGET-ENFORCEMENT
    (sibling of TCK-20260816-KGMCP-P3-PACKET-CACHE-SCHEMA-MIGRATIONS/INFRA-346, twice
    reviewed by Architecture-Review with 2 real safety-critical corrections, both
    independently proven non-vacuous by Architecture-Verify via live break/restore).
    This ticket does NOT originate multi-provider packet deduplication or caller-budget
    enforcement -- both mechanisms (deduplicate_statements()/assemble_within_budget()/kgmcp_char_heuristic_v1())
    already existed as real, tested code as of Phase 1''s TCK-20260815-KGMCP-P1-PACKET-ASSEMBLY,
    per INFRA-336''s own corrected text. Instead it hardens both: (1) replaces dedup
    identity from casefold-text equality with a single shared _content_hash() sha256
    helper (one call site in the whole module, verified by direct grep), threaded
    through Statement.evidence_hash and _dedup_key(); (2) adds a conflict-signal-aware
    dedup guard -- _conflict_signal_index_pairs(), reusing the existing _structural_supersession_signal()
    primitive build_conflicts() already calls -- plus a fail-loud cardinality assertion
    in assemble_packet() (len(statements) == len(context_search results) + (1 if graphify
    else 0)) so two conflict-flagged items can never silently collapse into one deduplicated
    statement even when their rendered text is byte-identical (AC4, the ticket''s
    single most safety-critical requirement); and (3) adds PacketAssembly.budget_truncated/omitted_statement_count
    visibility fields, threaded into knowledge_gateway_mcp.py''s _run_knowledge_context()
    response and the router-failure fallback_response, plus additive (non-schema_version-bumping)
    properties on knowledge_context_response.schema.json, so budget-driven truncation
    is always visible, never silent (AC2/AC3). Deduplication continues to never merge
    genuinely conflicting claims into one silently-resolved item (AC4); tools/knowledge_gateway_router.py
    remains byte-unchanged (AC5).'
