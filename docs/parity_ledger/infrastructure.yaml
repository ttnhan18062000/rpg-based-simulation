- id: INFRA-273
  text: 'F6 (docs/audits/D06_longrun_health.md, kernel.py''s tick-budget watchdog/mid-tick
    emergency throttle) is confirmed to extend beyond COGNITION/decision_divergence_detected
    to SOCIAL/ECONOMY/COMBAT/PROGRESSION/NARRATIVE/WORLD -- previously only proven
    for COGNITION (TCK-20260713-SIMQ-COGNITION-LOOPDET-NONDETERMINISM). TCK-20260715-SIMQ-ANCHOR-LOAD-
    SENSITIVITY-SWEEP''s idle-vs-induced-load repro found every one of its 14 investigated
    anchors'' drifted pillar(s) genuinely load/timing-sensitive, across all 6 of the
    above pillars, at both 200t and 1000t tiers. Two mechanisms confirmed, both rooted
    in the same dropped-resolution-queue-item throttle behavior: (1) COGNITION''s
    already-known refire mechanism (decision_divergence_detected has no dedup gate,
    re-evaluated every tick); (2) a newly-characterized "cascading divergence" mechanism
    for the delta-gated SOCIAL/COMBAT/ PROGRESSION/NARRATIVE/WORLD events (event_extractor.py)
    -- these fire once per genuine state transition, not every tick, so they cannot
    refire like COGNITION''s event, but a dropped resolution-queue item on tick T
    diverges that entity''s subsequent state from what it would otherwise have been,
    cascading into a materially different total event count for the rest of the run,
    not just a single event''s tick shifting by a few ticks. Also confirmed: combat_damage/entity_killed
    (CombatDamageEvent/CombatKillEvent) ARE constructed in event_extractor.py via
    this-tick delta gating -- correcting that investigation''s earlier finding that
    they came from an unlocated separate emission path. Also confirmed: F6-class variance
    is not exclusive to ~1000t+ runs -- two of the 14 anchors (urban_political_selfmodel_probe_seed42_200t,
    generated_frontier_3_42_seed123_200t) showed genuine variance at 200 ticks, below
    D06''s documented ~tick 300-320 onset heuristic (sharpens, does not contradict,
    that section''s existing "reliably reproducible" hedge).

    '
