    compared against the old extractor''s real `simulation_events.jsonl` output: 130/131
    active ticks match exactly, 0 payload mismatches. Full trace, methodology, and
    both bugs'' root-causing documented in `stored_artifacts/TCK-20260806-PUSH-SHADOW-VALIDATION-PERF/investigation.md`.

    '
