    Fixed by TCK-20260824-HOTFIX-COLLECTONLY-CLASS-NORMALIZE: _normalize_collect_only_node_id()
    previously normalized only the leading file-path segment of a collect-only node
    ID, leaving every class-name segment (including nested classes) as its own separate
    ''::''-delimited piece -- e.g. "path/to/file.py::TestFoo::test_bar" normalized
    to "path.to.file::TestFoo::test_bar" (two ''::''). JUnit XML''s own classname
    attribute instead folds the file path AND every class level into one dotted string,
    leaving only the method name after a single ''::'' (classname="path.to.file.TestFoo"
    name="test_bar", i.e. "path.to.file.TestFoo::test_bar", one ''::''). The two forms
    never matched, so classify_new_vs_existing() misclassified every class-based test
    (including nested classes) as "new" regardless of whether it actually changed
    -- confirmed via direct local reproduction of PR #68''s real CI job, where a PR
    adding only 2 new test files reported 933 "new" out of 2659 total tests. _normalize_collect_only_node_id()
    now dot-joins the normalized file segment together with every intervening class
    segment (not just the file path), keeping only the final method-name segment after
    the single trailing ''::'', for any nesting depth -- "path/to/file.py::ClassA::ClassB::test_method"
    now normalizes to "path.to.file.ClassA.ClassB::test_method". The no-class case
    ("path/to/file.py::test_method" -> "path.to.file::test_method") is unchanged.
    (TCK-20260824-HOTFIX-COLLECTONLY-CLASS-NORMALIZE)

