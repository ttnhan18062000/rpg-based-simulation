- id: INFRA-214
  text: "ScenarioRuntimeService kernel lifecycle (Epic 3.1A+3.1B+3.2C): ScenarioRuntimeService owns a Kernel for one scenario run, exposing start/pause/resume/step/abort. Tick loop is synchronous; pause()/resume() are cooperative flag operations. abort() calls kernel.shutdown() to prevent QueueDrainWorker thread leaks. ScenarioObjectiveState enum (RUNNING/OBJECTIVE_MET/OBJECTIVE_FAILED/STALLED/ABORTED) tracks execution-level state. VictoryCondition schema added to SimulationScenarioDefinition (kinds: tick_limit, entity_count). ObjectiveEvaluator (pure static, E31B) evaluates conditions after each tick: tick_limit fires OBJECTIVE_MET when state.tick >= value; entity_count fires OBJECTIVE_FAILED when alive entities (e.combat.alive) < value. Stall detector fires STALLED after STALL_THRESHOLD (50) consecutive zero-event ticks. Evaluation order: objective conditions before stall detector. _evaluate_after_tick() wired into both _run_loop() and step(); step() raises RuntimeError in any terminal state. E32C additions: initial_state: Optional[AuthoritativeState] = None parameter on __init__ allows CampaignOrchestrator to inject carry-forward entity state before first tick; final_state property returns self._kernel.state (None before start); _build_kernel() seeds DeterministicRNG from initial_state.seed when provided (INFRA-101/102 determinism)."
