    (TCK-20260719-PHASE-AGENT-CASE-FOLD): direct measurement against live agent-monitoring/
    events.jsonl found 9 implement-ticket phases with genuine casing fragmentation (Finalize/
    finalize/FINALIZE, Implement/implement/IMPLEMENT, Investigate/investigate/INVESTIGATE, Parity/
    parity/PARITY, Plan/plan/PLAN, Review/review, Scope/scope, Test/test/TEST, Verify/verify),
    silently undercounting real per-phase failure rates when read naively (e.g. Review's true
    18.2% failure rate was invisible split across casing variants -- and, separately, no
    phase-keyed ok/failed breakdown existed anywhere in generate_retro.py's output at all before
    this ticket, so the rate was not computable regardless of casing). Fix: generate_retro.py
    gained _canonicalize()/_normalize_phase()/_normalize_agent() helpers, resolving each event's
    workflow via vocabulary.py's infer_workflow() and casefold-matching against that workflow's
    own WORKFLOW_PHASES/WORKFLOW_AGENTS canonical set (never inventing a canonical spelling for an
    unmatched value -- a genuinely unrecognized phase/agent, or an event from an unknown workflow,
    passes through unchanged). Wired into all 3 existing phase/agent-keyed aggregations
    (agent_status_distribution, spend_proxy_by_phase, spend_proxy_by_agent), plus a new
    phase_status_distribution output (mirroring agent_status_distribution's shape, keyed by
    normalized phase instead) and a matching new "## Phase Status Distribution" report section --
    both additions were necessary to make the ticket's own Review-failure-rate claim testable at
    all, not present before this ticket. tools/agent-monitoring/validate.py's drift-visibility
    report (compute_drift_report) is deliberately, verifiably untouched (zero source diff) --
    that module correctly keeps reporting casing variants as distinct entries by design, decoupled
    from this ticket's read-time merge-for-aggregation concern.
