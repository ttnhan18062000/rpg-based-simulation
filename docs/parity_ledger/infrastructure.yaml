- id: INFRA-274
  text: 'Plan-phase "unresolved questions" gate false-positive fix (TCK-20260716-PLAN-GATE-SUBSTRING-FALSEPOS):
    the orchestrator''s Plan-phase gate previously tested `planText.toLowerCase().includes(''unresolved
    question'')` against the planner agent''s free-text return summary, which false-triggered
    `NEEDS_HUMAN_INPUT` whenever that prose contained a phrase like "No unresolved
    questions: ..." (the plural "questions" substring-matches "question" even when
    no genuine section exists). Fixed by replacing the prose substring check with
    an orchestrator-run `bash()` read of the actual generated `staging_artifacts/${tid}/plan.md`
    file, testing via `re.search(r''^##\s+Unresolved Questions\s*$'', text, re.MULTILINE)`
    for a genuine H2 markdown heading, mirroring this same file''s existing `tagCheckOutput`/`archCheckOutput`
    orchestrator-run-check-against-durable-state convention (marker-prefix output,
    `indexOf` + `JSON.parse`). True-positive path (a real `## Unresolved Questions`
    heading present) is unchanged: same `NEEDS_HUMAN_INPUT` status, `pushEvent(''Plan'',
    ''planner'', ''blocked'', ...)`, monitoring write, and return message. This is
    agent-orchestration workflow tooling (which of two Plan-phase gate branches the
    pipeline takes) -- no simulation engine, mechanics, or determinism behavior is
    involved.


    UPDATE (TCK-20260827-PLAN-GATE-HEADING-CONTENT-BLIND-FALSEPOS): `plan_has_unresolved_questions_heading()`
    was heading-presence-only, which still false-triggered `NEEDS_HUMAN_INPUT` for
    a genuinely resolved plan, because the planner agent''s own prompt always writes
    the `## Unresolved Questions` heading, filling it with "None." when there is nothing
    to flag rather than omitting it (found live during TCK-20260824-OCCUPATION-CHANGE-TRIGGER).
    Fixed by making the check content-aware: it now inspects the section body (from
    immediately after the heading to the next `##` H2 heading or EOF). An empty/whitespace-only
    body, or a body whose first non-blank line starts with the word "None" (case-insensitive,
    word-boundary matched -- "Nonetheless, ..." does NOT count as "None") returns
    `False` (no gate). Any other body content still returns `True`, same `NEEDS_HUMAN_INPUT`
    gating as before this fix. Same function name/signature (`plan_path: str -> bool`);
    both real call sites (`.claude/workflows/implement-ticket.js`''s Plan-gate ~line
    654-680, and `tools/agent_replay/runner.py::replay_slice()`) needed zero changes.


    '
