- id: INFRA-295
  text: "New 3-level SQLite retrieval cache -- TCK-20260729-RETRIEVAL-CACHE-LEVELS\
    \ -- implementing docs/observability/retrieval_retention_redaction_policy.md's\
    \ Decision C category names (retrieval_index_cache / retrieval_query_cache / retrieval_packet_cache)\
    \ and MAY-Contain / PROHIBITED field list over three independently-invalidatable\
    \ tables. Embedding/index cache keys on content hash + embedding/chunking version,\
    \ recomputing (miss) and evicting stale same-hash rows on either version change.\
    \ Query-result cache keys on normalized query + filters + corpus_generation +\
    \ retrieval_version, stale-rejecting (distinct reason codes per changed field)\
    \ rather than silently missing when corpus_generation or retrieval_version changes\
    \ under an otherwise-identical query. Context-packet cache keys on a packet key\
    \ hash and invalidates on any single cited-source hash mismatch, corpus_generation\
    \ change, or policy_version change -- operating on raw fields only, since `ContextPacket`\
    \ has no code class yet (context_packet_contract.md \xA74). `corpus_generation`\
    \ is a read-only proxy derived from `knowledge-index/manifest.json`'s existing\
    \ `built_at` field (never a new field written into `knowledge_search.py`); `retrieval_version`\
    \ is a new module-owned constant (`RETRIEVAL_VERSION = 1`), manually bumped on\
    \ breaking key/invalidation changes. A shared `_validate_may_list_kwargs()` guard\
    \ wraps all three write paths, raising `ValueError` on any field outside the `MAY_LIST_COLUMNS`\
    \ allowlist -- no raw prompt/chunk/source text is ever stored. Owns an isolated\
    \ `knowledge-index/retrieval_cache.db` file, distinct from `knowledge-index/knowledge.db`,\
    \ specifically because `knowledge_search.py`'s `cmd_build()` and `cmd_build_incremental()`\
    \ unconditionally `unlink()` and rewrite `knowledge.db` on every rebuild -- sharing\
    \ that file would silently destroy every cached row on every index rebuild. Each\
