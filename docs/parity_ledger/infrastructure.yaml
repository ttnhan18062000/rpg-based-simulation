    \ content/mechanics precondition, unrelated to and not fixed by this kernel tick-alignment\
    \ fix \u2014 the fix un-blocks calamity_spawned's tick-gate comparison, not its\
    \ content-side intensity precondition. Do not read this entry as claiming calamity_spawned\
    \ now produces calibration_hits > 0 in any calibrated scenario.\n"
