- id: INFRA-323
  text: 'TCK-20260806-SIMQ-EXTRACTOR-HAZARD-COMBAT-MISCLASSIFICATION-FIX -- event_extractor.py''s
    combat-damage/combat-initiated/near-death-survival branches (lines 136-227) previously
    classified ANY hp_diff<0 as combat, regardless of cause, because they read a nonexistent
    attribute (`e_upd.combat_upd`) instead of the real `EntityUpdate.combat` field.
    `getattr(e_upd, "combat_upd", None)` silently returned None every time (no AttributeError,
    since a default was given), so attacker_id/killer_id were always None and the
    outcome_kind-based hazard exclusion INFRA-273 documents for hazard_drain_applied''s
    own detection branch (a separate, correctly- written code path at line ~419) was
    never actually reachable for the combat branches -- they had no working causal-attribution
    mechanism at all, not just a missing HAZARD filter. Fixed by a new `_real_combat_update(e_upd)`
    helper: reads the real `.combat` field, requires `attacker_id is not None` (confirmed
    as the correct primary discriminant -- every real damage-dealing CombatUpdate
    in combat.py sets it, hazard drain and biological/starvation damage in world_dynamics.py/biological.py
    never do), and excludes outcome_kind in ("HAZARD","REJECTED") as defense-in-depth.
    A plain outcome_kind allow-list alone (e.g. including "SURVIVE") was considered
    and rejected during investigation: CombatUpdate''s own dataclass default for outcome_kind
    is "SURVIVE", and biological.py''s starvation/exhaustion damage (src/systems/lifecycle_systems/biological.py:40)
    relies on that default without setting an explicit tag -- an outcome_kind-only
    filter would have let biological damage through as "combat" the same way hazard
    damage previously did. Also fixed as the same root cause: the Kill-events branch''s
    killer_id (same wrong-attribute bug, corrected to use the real field; whether
    CombatKillEvent should fire at all on a non-combat death remains open, explicitly
    not decided by this fix) and the despawn-lifecycle branch''s has_attacker check
    (previously always False due to the same bug, meaning every real combat kill was
    also incorrectly co-emitting demographic_mortality alongside CombatKillEvent --
    now correctly suppressed for genuine combat kills). near_death_survival gained
    the same guard; it previously had no causal check at all, firing on any HP-threshold
    crossing regardless of cause.

    '
