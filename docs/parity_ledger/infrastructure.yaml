    site and the 3 browser-facing dashboard routes, each of which also carries the
    sibling per-client admission-control dependency alongside it -- see INFRA-378),
    and indirectly, as require_admission/require_admission_header_or_query/require_admission_ws''s
    own chained first parameter, at the remaining 23 sites once the sibling admission-control
    ticket (INFRA-378, TCK-20260823-HTTP-PER-CLIENT-ADMISSION-CONTROL) replaced the
    bare require_api_key dependency in place there. Either way the API-key check always
    resolves before admission control runs. Keys are stored hashed-at-rest (SHA-256)
    in RuntimeProfile.api_key_hashes (a plain str of comma-separated ''client_id:sha256hex''
    pairs, loaded via ConfigLoader''s CLI>Env>YAML>Defaults chain / RPG_API_KEY_HASHES
    env var / --api-key-hashes CLI flag) and compared via hmac.compare_digest (never
    ==). stream.router''s 3 WebSocket routes use a dedicated require_api_key_ws dependency
    that raises WebSocketException instead of HTTPException, since FastAPI''s websocket
    dependency resolution (fastapi/routing.py get_websocket_app) runs before websocket.accept()
    and only WebSocketException is safely converted to a clean websocket.close() by
    Starlette''s ExceptionMiddleware. The 3 browser-facing dashboard routes (/api/v1/observability/ui
    and its 2 redirects) and the 3 WebSocket routes additionally accept a ''key''
    query-param as a documented, narrower-scoped auth channel (keys can appear in
    URLs/access logs/browser history) since a plain browser fetch()/WebSocket() cannot
    attach a custom header. The resolved ClientIdentity (frozen, hashable, with a
    client_id string field) is a reusable identity object for the sibling per-client
    admission-control ticket (TCK-20260823-HTTP-PER-CLIENT-ADMISSION-CONTROL).'
