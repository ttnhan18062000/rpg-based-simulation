- id: INFRA-397
  text: "QualityPersistence.write() still batches flush() calls at a deterministic\
    \ interval (_FLUSH_INTERVAL=50 records, per-instance _pending_writes counter reset\
    \ to 0 on each flush) \u2014 unchanged. EventRecorder no longer uses a per-record\
    \ counter/threshold at all (TCK-20260830-HOTFIX-EVENT-RECORDER-BATCH-FLUSH-VISIBILITY-REGRESSION):\
    \ _write_envelope_to_file() never flushes directly; QueueDrainWorker (src/observability/queue.py)\
    \ gained an optional flush_fn callback invoked once after each non-empty drain\
    \ cycle, wired to EventRecorder._flush_file(). This fixes a real regression the\
    \ original _FLUSH_INTERVAL=50 counter introduced: a single low-volume event written\
    \ between drain cycles never became visible on disk until 50 records accumulated\
    \ or shutdown, breaking any consumer reading simulation_events.jsonl mid-run (confirmed\
    \ via 4 real test failures in tests/simulation_quality/test_traceability_path.py).\
    \ flush() is still called unconditionally on shutdown for both writers (QualityPersistence.shutdown(),\
    \ EventRecorder shutdown path), so no pending data is lost on a clean shutdown.\
    \ On an unclean crash between batch boundaries, QualityPersistence may still lose\
    \ up to 49 unflushed records; EventRecorder now loses at most one drain cycle\
    \ worth (~_worker.interval_sec, 0.01s by default) regardless of record volume.\
    \ This is non-authoritative telemetry (SimQ score records, observability event\
    \ envelopes), not durable simulation state."
