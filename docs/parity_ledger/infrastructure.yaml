- id: INFRA-273
  text: >
    F6 (docs/audits/D06_longrun_health.md, kernel.py's tick-budget watchdog/mid-tick emergency
    throttle) is confirmed to extend beyond COGNITION/decision_divergence_detected to
    SOCIAL/ECONOMY/COMBAT/PROGRESSION/NARRATIVE/WORLD -- previously only proven for COGNITION
    (TCK-20260713-SIMQ-COGNITION-LOOPDET-NONDETERMINISM). TCK-20260715-SIMQ-ANCHOR-LOAD-
    SENSITIVITY-SWEEP's idle-vs-induced-load repro found every one of its 14 investigated
    anchors' drifted pillar(s) genuinely load/timing-sensitive, across all 6 of the above
    pillars, at both 200t and 1000t tiers. Two mechanisms confirmed, both rooted in the same
    dropped-resolution-queue-item throttle behavior: (1) COGNITION's already-known refire
    mechanism (decision_divergence_detected has no dedup gate, re-evaluated every tick); (2) a
    newly-characterized "cascading divergence" mechanism for the delta-gated SOCIAL/COMBAT/
    PROGRESSION/NARRATIVE/WORLD events (event_extractor.py) -- these fire once per genuine state
    transition, not every tick, so they cannot refire like COGNITION's event, but a dropped
    resolution-queue item on tick T diverges that entity's subsequent state from what it would
    otherwise have been, cascading into a materially different total event count for the rest
    of the run, not just a single event's tick shifting by a few ticks. Also confirmed:
    combat_damage/entity_killed (CombatDamageEvent/CombatKillEvent) ARE constructed in
    event_extractor.py via this-tick delta gating -- correcting that investigation's earlier
    finding that they came from an unlocated separate emission path. Also confirmed: F6-class
    variance is not exclusive to ~1000t+ runs -- two of the 14 anchors
    (urban_political_selfmodel_probe_seed42_200t, generated_frontier_3_42_seed123_200t) showed
    genuine variance at 200 ticks, below D06's documented ~tick 300-320 onset heuristic
    (sharpens, does not contradict, that section's existing "reliably reproducible" hedge).
  status: verified
  priority: P2
  legacy_evidence: null
  v2_evidence: >
    staging_artifacts/TCK-20260715-SIMQ-ANCHOR-LOAD-SENSITIVITY-SWEEP/repro_sweep.md Sections
    2-7 (per-anchor idle-vs-induced-load trial tables, budget_warnings/watchdog_trips counts
    confirming genuine throttle activity, per-pillar event_count/score variance across trials).
    docs/simulation_quality/eval_matrix_results.md "Anchor Reliability Verification, Part 2"
    subsection (14 per-anchor summaries).
    UPDATE 2026-07-16 (TCK-20260715-SIMQ-CORPUS-DIVERSITY-SESSION-LOAD-FLAKE): CI's `slow` job
    (`.github/workflows/test.yml`) now runs this file's 32 `-m slow` guards as isolated
    per-test subprocesses (new Makefile target `simq-corpus-diversity-slow-isolated`, wired
    in ahead of the existing sequential invocation, which now `--ignore`s this file) instead
    of one long sequential in-process run, directly targeting the cumulative-session-load
    mechanism this entry documents. See
    staging_artifacts/TCK-20260715-SIMQ-CORPUS-DIVERSITY-SESSION-LOAD-FLAKE/isolation_comparison.md
    for the controlled-comparison data: 2 isolated runs (0/2 failures) and 1 fresh sequential
    run (0/32 failures) this session, alongside the 2 prior sequential-session failures cited
    above. Honest disclosure, not overclaimed: this session's own fresh sequential run was
    also clean, so the isolated-vs-sequential contrast in this specific comparison rests on
    pooling with the parent ticket's older failing samples, not on a live within-session A/B
    difference -- the comparison artifact states this plainly. The remedy's justification is
    architectural (subprocess isolation structurally removes the cross-test session-load
    carryover mechanism) rather than purely statistical; sample size (5 sequential-style
    observations, 2 isolated observations total) remains too thin to confirm or refute the
    original ~1-in-16 flake-rate estimate either way.
    UPDATE 2026-07-16 (TCK-20260716-SIMQ-URBAN-POLITICAL-FULL-PILLAR-SWEEP): COMBAT,
    PROGRESSION, and WORLD were checked against real fresh-draw evidence for the
    urban_political_seed123_1000t anchor for the first time (this anchor's originally-scoped
    pillars were ECONOMY/SOCIAL only) and confirmed small/bounded deviation (max 0.009,
    0.0151, 0.012 respectively, well inside default tolerance) -- consistent with this
    entry's mechanism-2 cascading-divergence claim for these pillars, no contradiction. Also,
    new evidence: this sweep's COGNITION finding (8 fresh draws, 2/8 spiking to 0.4380 and
    1.6159 against an anchor of 0.0440, a ~36x swing) is the first confirmation that
    mechanism-1 (COGNITION's no-dedup-gate refire, previously characterized only by
    TCK-20260713-SIMQ-COGNITION-LOOPDET-NONDETERMINISM for a different anchor/tier) can also
    manifest at large single-draw magnitude on an anchor this entry's own mechanism-1/
    mechanism-2 distinction did not previously have COGNITION evidence for. This does not
    contradict or restate the existing mechanism-1/mechanism-2 distinction above -- it is a
    new anchor/tier data point for mechanism-1, cross-referenced here. See
    stored_artifacts/TCK-20260716-SIMQ-URBAN-POLITICAL-FULL-PILLAR-SWEEP/investigation.md.
  proof_type: regression
  test_path: >
    tests/unit/worldassembly/test_corpus_diversity.py -m slow --resource-budget large -k
    "grade_stability" (14 dedicated guards, one per anchor, all green -- each guard's own
    docstring cites the specific repro evidence for that anchor/pillar).
    UPDATE 2026-07-16 (TCK-20260715-SIMQ-CORPUS-DIVERSITY-SESSION-LOAD-FLAKE):
    `make simq-corpus-diversity-slow-isolated` (all 32 `-m slow` guards in this file, run as
