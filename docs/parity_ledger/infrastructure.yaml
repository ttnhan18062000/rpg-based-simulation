    tools.jsonl once per write-batch and computes {(run_id, seq): (tool_call_count,
    cost_proxy_score)} for every (run_id, seq) pair whose run_id belongs to the implement-ticket
    workflow (via vocabulary.py's infer_workflow), reusing cost_proxy.py's
