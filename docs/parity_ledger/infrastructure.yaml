  text: 'Per-client API-key authentication (src/api/auth.py) gates every route in
    src/api/server.py except /health (liveness probe, the sole exemption). Auth is
    the first-resolved dependency at all 27 protected route sites: directly via dependencies=[Depends(require_api_key)]
