- id: INFRA-381
  text: 'TCK-20260824-PARITY-NEXT-ID-LOOKUP -- added next_available_id(shard_filename)
    and search_existing_entries(query, ...) to tools/gate_checks/parity_updater_static.py,
    giving the parity-updater agent (and the Parity-phase orchestrator step) deterministic
    lookups instead of eyeballing the shard''s own entry list. next_available_id derives
    prefix and zero-pad width from the shard''s own existing ids (mirroring _ID_PATTERN
    / docs/parity_ledger/schema.json''s id format) and returns max-numeric-suffix
    + 1, not entry-count + 1 -- shards have gaps (INFRA-379 is the real-world precedent:
    384 entries, highest id 379), so a count-based next-id would collide. Raises ValueError
    when the shard has no entry with a valid id, since there is nothing to derive
    a prefix from. search_existing_entries is a plain case-insensitive substring search
    over each entry''s text/v2_evidence fields (not fuzzy/semantic), scoped to one
    shard or all of CANONICAL_LEDGER_FILES, returning one {id, shard, matched_field,
    excerpt} dict per field match. .claude/workflows/implement-ticket.js''s Parity
    phase now runs a second orchestrator bash() call reusing expected_subsystems_for_files''
    own candidate-shard output, calling next_available_id once per distinct candidate
    shard and injecting the result as a new ''Next available ID per candidate shard''
    prompt hint line (a shard with no valid id is reported as ''unavailable: <reason>''
    rather than failing the phase). search_existing_entries is documented in .claude/agents/parity-updater.md
    as an agent-invoked Bash tool only -- not auto-wired into the orchestrator, since
    there is no automatic query string to feed it. This entry originally dogfooded
    next_available_id(''infrastructure.yaml'') to pick its own id at authoring time
    (INFRA-380), and search_existing_entries(''parity_updater_static'', shard_filename=''infrastructure.yaml'')
    confirmed no pre-existing entry covered this concern before writing. Renumbered
    to INFRA-381 during a merge with origin/main, which had independently landed an
    unrelated INFRA-380 entry (TCK-20260823-CI-STEP-SUMMARY-REPORTING) in the time
    between this entry''s authoring and this branch merging -- a real, expected consequence
    of next_available_id() computing against each branch''s own pre-merge view of
    the shard, not a bug in the function itself. No src/ files changed -- pure Claude-agent-workflow
    orchestration tooling. TCK-20260831-PARITY-LEDGER-ID-PATTERN-MULTISEGMENT fixed
    a latent cross-family leak bug in next_available_id itself: it previously tracked
    a single global max-suffix across the whole shard rather than per prefix family,
    so in a shard mixing a bare-prefix family (WORLD-NNN) with a higher-numbered multi-segment
    family (WORLD-DEMO-NNN/WORLD-CULT-NNN), the bare family''s max suffix could leak
    into and skew the multi-segment family''s next-id proposal (or vice versa). Reworked
    to track max_suffix_by_prefix keyed on the full captured prefix (including multi-segment
    prefixes), reporting whichever prefix belongs to the last matching entry in the
    shard''s own file order -- unchanged single-family behavior when a shard has only
    one id family. This also required widening _ID_PATTERN itself from ^([A-Z]+)-([0-9]{3})$
    to ^([A-Z]+(?:-[A-Z]+)*)-([0-9]{3})$, mirroring the identical fix independently
    made to tools/parity_ledger_writer.py''s _ID_PATTERN and docs/parity_ledger/schema.json''s
    byte-identical properties.id.pattern, which had been silently rejecting the already-live
    multi-segment WORLD-DEMO-001..006 / WORLD-CULT-001..003 ids.'
