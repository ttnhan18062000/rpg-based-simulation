    for the controlled-comparison data: 2 isolated runs (0/2 failures) and 1 fresh
    sequential run (0/32 failures) this session, alongside the 2 prior sequential-session
    failures cited above. Honest disclosure, not overclaimed: this session''s own
    fresh sequential run was also clean, so the isolated-vs-sequential contrast in
    this specific comparison rests on pooling with the parent ticket''s older failing
    samples, not on a live within-session A/B difference -- the comparison artifact
