- id: INFRA-252
  text: "tools/evaluate_simq.py standing harness: --dry-run diffs existing data/calibration/\
    \ reports against grade_anchors.json (25 entries); full mode re-runs calibrate_simq.py\
    \ for all fast anchor scenarios. Exit 0=all pass, 1=regress, 2=setup error. make\
    \ evaluate (dry-run) and make evaluate-full targets added to Makefile. UPDATE\
    \ 2026-07-13 (TCK-20260713-SIMQ-EVAL-PROFILE-BUG): full-mode's _run_calibration()\
    \ previously forwarded the grade_anchors.json run_key's profile-name prefix straight\
    \ through as calibrate_simq.py's --name (world) argument, which only happened\
    \ to work when the profile name and world directory name were identical. For any\
    \ anchor whose profile name is a variant/probe of a shorter world name (e.g. urban_political_selfmodel_probe),\
    \ this silently pointed --name at a nonexistent world directory. calibrate_simq.py's\
    \ old _load_world_state() masked this by falling back to a meaningless generic\
    \ synthetic scenario instead of erroring, so full-mode evaluate runs could silently\
    \ score the wrong (or a fabricated) world. Fixed by adding _resolve_world_name(),\
    \ which probes data/worlds/ directly (progressively stripping trailing name segments)\
    \ to recover the real world directory, and by forwarding --profile plus an explicit\
    \ --output pinned to the run_key so the correct calibration profile is applied\
    \ and the report lands under the expected run_key. UPDATE 2026-07-13 (TCK-20260713-SIMQ-RAWSCORE-PERSIST):\
    \ grade_anchors.json's per-pillar schema changed to {grade, score} objects (see\
    \ INFRA-250); main()'s call site now extracts just the grade (anchor_grades =\
