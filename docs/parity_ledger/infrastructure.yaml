    \ == tick checks (event_extractor.py:286, event_extractor.py:899, kernel.py:836)\
    \ compared these against the post-advance tick local, so belief_assimilated/belief_updated,\
    \ calamity_spawned, and GovernorModeChanged could never match through the real\
    \ Kernel.tick_once() loop \u2014 a pre-existing bug discovered while empirically\
    \ verifying TCK-20260703-SIMQ-INFORMATION-BELIEF-TRIGGER's Step 6 against the\
    \ real Kernel loop (not introduced by that ticket's schema/compiler/resolver work).\
    \ Fixed by comparing each of the 3 sites against prior_state.tick (already an\
    \ in-scope parameter at all 3 call sites) instead of the shared post-advance tick\
    \ variable, leaving the tick label on every emitted SimulationEvent (including\
    \ InvariantViolation and GovernorModeChanged's own tick field) unchanged. Verified\
    \ correct for all 3 event types via 3 dedicated unit tests (tests/integration/observability/test_kernel_event_recording.py)\
    \ that drive the real Kernel.tick_once() loop directly, all passing: test_belief_assimilated_fires_through_real_tick_once_loop,\
    \ test_calamity_spawned_fires_through_real_tick_once_loop, test_governor_mode_changed_fires_through_real_tick_once_loop.\
    \ belief_assimilated/belief_updated additionally confirmed firing (calibration_hits\
    \ == 1 per run) across all 7 urban_political_* calibration runs via calibrate_simq.py\
    \ through the live loop, and GovernorModeChanged confirmed firing naturally (63-73\
    \ occurrences) in the existing dungeon_crawl_seed{42,123,456}_2000t / sandbox_world_seed42_2000t\
    \ baselines (infrastructure telemetry, not SimQ-scored). calamity_spawned's fix\
    \ mechanism is proven correct by its dedicated unit test (which constructs a state\
    \ meeting CalamityService's spawn gates directly), but a one-off diagnostic calibration\
