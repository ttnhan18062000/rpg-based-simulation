  proof_type: contract
  test_path: >
    tests/tools/test_generate_retro.py::test_duration_outlier_flagged_relative_to_tier_median_not_global
    (proves tier-scoped, not global, median -- a standard-tier outlier is flagged while an
    epic-tier run with the same absolute duration is not, since epic's own group is below the
    minimum size); ::test_duration_outlier_excludes_null_from_flagging_and_median;
    ::test_duration_outlier_skips_group_below_minimum_size;
    ::test_cost_proxy_outlier_flagged_relative_to_normalized_phase_median (proves the
    PHASE-AGENT-CASE-FOLD synergy -- 'Investigate'/'investigate' merge into one group);
    ::test_cost_proxy_outlier_excludes_events_with_no_score;
    ::test_outliers_section_omitted_when_none_flagged;
    ::test_outliers_section_rendered_when_flagged. All 7 new plus the 1 updated
    (test_compute_retro_metrics_returns_all_documented_keys) re-run and confirmed passing as part
    of this parity update (33/33 in test_generate_retro.py), alongside
    test_agent_ops_dashboard_stats.py (8/8, confirms the new outliers key doesn't break the
