- id: INFRA-324
  text: "TCK-20260806-PUSH-SHAPER-REGISTRY-COMBAT (epic child 2 of TCK-20260806-SIMQ-OBSERVABILITY-PUSH-MIGRATION-EPIC)\
    \ -- adds a new, parallel, SHADOW-only apply-layer event-emission path for COMBAT,\
    \ alongside (not replacing) the existing diff-based `EventExtractor`. New module\
    \ `src/observability/event_shapers.py`: a `SHAPER_REGISTRY` mirroring `QualityHub.SCORER_REGISTRY`'s\
    \ shape, and `CombatShaper`, which derives `combat_damage`/`combat_initiated`/`near_death_survival`/`entity_killed`/\
    \ `hazard_drain_applied`/`hero_death_unrecorded` from `prior_state` + `update`\
    \ alone -- the same two objects already available as `ApplyPath.apply_generation()`'s\
    \ own input parameters, before any state reconstruction -- reusing `event_extractor._real_combat_update()`\
    \ (from INFRA-323) as the single source of truth for the attacker_id-primary combat-classification\
    \ discriminant. Confirmed via direct trace of `apply.py`/`apply_plan.py` that\
    \ no hook into `ApplyPath.apply_generation()` or `ApplyPlanBuilder` internals\
    \ is needed -- `CombatUpdate` already carries `hp_delta`/`alive_set`/`attacker_id`/`outcome_kind`,\
    \ sufficient to derive every migrated event from `prior_state.entities[eid]` +\
    \ the update's own delta fields. New flag `ENABLE_PUSH_EVENT_SHAPERS` (registered\
    \ in `FeatureFlagManager.__init__` for documentation consistency, but read directly\
    \ from `prior_state.feature_flags` inside `Kernel._phase_observability()` -- NOT\
    \ routed through `FeatureFlagManager`/`run_phase()`, since that mechanism gates\
    \ pipeline *phases*, not this observability-only comparison path). `SHADOW` mode\
    \ constructs events and logs a count via `logger.debug()`; nothing is delivered\
    \ to `self._event_recorder`/the live `BoundedObservabilityQueue` -- wrapped in\
    \ try/except so a bug in this experimental path can never affect the real tick.\n\
    A full event-coverage audit (epic-level investigation.md) confirmed 4 core COMBAT\
    \ events are cleanly migratable and found 2 more (`hazard_drain_applied`, `hero_death_unrecorded`)\
    \ safe to migrate alongside them (same typed-record read, physically colocated\
    \ in the old extractor). `demographic_mortality` (despawn branch) was explicitly\
    \ deferred -- broader than combat, covers non-combat death causes too. `combat_resolved`/`attrition_threshold_crossed`\
    \ were re-confirmed dead code (never emitted by any path in this repo, referenced\
    \ only in the scorer's own `EVENT_TYPES`/`score()`) -- disclosed, not migrated,\
    \ since nothing exists to migrate.\nA known, disclosed, narrow limitation was\
    \ found and NOT fixed here (see support_boundary): `apply.py:93-110`'s passive\
    \ health decay and `apply.py:489-521`'s level-up heal/stat-clamp both mutate HP\
    \ at apply-time without ever touching `EntityUpdate.combat` -- if either coincides\
    \ with a real combat hit on the same entity in the same tick, this shaper's `damage`/`hp`/`is_lethal`\
    \ *payload values* (not event *types*, which stay correct) could diverge from\
    \ the old extractor's materialized-state read. Carried forward as an explicit,\
    \ named check for `TCK-20260806-PUSH-SHADOW-VALIDATION-PERF` to quantify before\
    \ cutover.\nUPDATE 2026-08-06 (TCK-20260806-PUSH-SHADOW-VALIDATION-PERF): that\
    \ ticket's real, non-mocked 6-world comparison found 2 real bugs in this entry's\
    \ original implementation, both fixed by reopening this same ticket rather than\
    \ patched around downstream. (1) `entity_killed` false positive on hazard-caused\
    \ \"death\": the original implementation derived death from `alive_set` (which\
    \ maps to `CombatComponent.alive`, confirmed `src/engine/patches.py:301`) -- a\
    \ different field from `LifecycleComponent.active`, which `LifecycleSystem.resolve_lifecycle()`\
    \ (`src/systems/lifecycle_systems/lifecycle.py:40`) only transitions on `outcome_kind==\"\
    KILL\"` or old-age, never on `alive_set` alone. Fixed by gating `entity_killed`/`hero_death_unrecorded`\
    \ on `outcome_kind==\"KILL\"` directly -- this also disclosed a second, related,\
    \ accepted limitation: a hazard-caused `combat.alive=False` can transition `lifecycle.active`\
    \ on a LATER tick with zero `EntityUpdate.combat` present at that tick, invisible\
    \ to this shaper by construction; confirmed rare (1 occurrence / 6 worlds x 500\
    \ ticks), accepted as disclosed, not fixed. (2) Missing volumization rule: the\
    \ original implementation never ported `event_extractor.py`'s \"skip routine non-lethal\
    \ combat_damage in LIGHT/LONG_RUN mode\" rule -- a plain omission, not an edge\
    \ case, causing real over-firing in every sustained-combat sequence since `ObservabilityConfig`'s\
    \ default mode is LIGHT. Fixed by adding a `mode` parameter to the `EventShaper`\
    \ protocol and `CombatShaper.shape()`, threaded through `kernel.py`'s already-\
    \ computed `obs_mode`. Post-fix re-verification: 130/131 active ticks match the\
    \ old extractor exactly across the same 6-world real comparison, 0 payload-value\
    \ mismatches.\nUPDATE 2026-08-06 (TCK-20260806-PUSH-SHAPER-REGISTRY-WORLD-DYNAMICS):\
    \ the `demographic_mortality` deferral above is now closed, not superseded \u2014\
    \ Phase 2's `WorldDynamicsShaper` (`docs/parity_ledger/world_dynamics.yaml` `WORLD-115`)\
    \ migrates it, confirming the original \"broader than combat\" classification\
    \ was a real, correctly-drawn scope boundary at the time (Phase 1 was COMBAT-only),\
    \ not an error: `StateUpdate.entities_remove` plus the same `_real_combat_update()`\
    \ helper this entry's own `CombatShaper` already uses give the \"despawn without\
    \ a combat attacker\" signal without new instrumentation, once a ticket's scope\
    \ was WORLD/demographic rather than strictly COMBAT. See `WORLD-115` for the full\
    \ mechanism and real-kernel verification evidence.\n"
