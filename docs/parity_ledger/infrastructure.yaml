- id: INFRA-223
  text: >
    _phase_persistence() sets TICK_END.hash conditionally: SHA-256 canonical hash when
    replay_allowed AND (audit_mode OR replay_richness=="FULL"); sentinel string "SKIPPED"
    when replay_allowed=True but replay_richness!="FULL" and audit_mode=False (DEGRADED
    mode); no TICK_END event at all when replay_allowed=False (SURVIVAL mode). NORMAL and
    CONSTRAINED modes use replay_richness="FULL" and therefore compute the canonical hash
    every tick. StateFingerprinter (MD5) is emitted in REFINED_UPDATE events whenever
    replay_allowed=True but covers a narrower domain than CanonicalStateHasher (excludes
