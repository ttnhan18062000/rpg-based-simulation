- id: INFRA-358
  text: 'Engine-liveness /health and external-watchdog alert wiring -- TCK-20260817-ENGINE-LIVENESS-HEALTH-EPIC.
    Previously /health (src/api/server.py) was a hardcoded {"status": "ok"} stub with
    no dependency on V2EngineManager, so it could report healthy forever even if the
    background tick thread died. It now calls V2EngineManager.get_health_status(),
    which combines two new read-only accessors -- is_thread_alive (self._thread.is_alive())
    and last_tick_age_seconds (staleness over the already-populated _tick_times deque,
    falling back to _started_at before the first tick completes) -- into a real ok/degraded/unhealthy
    status, evaluated independently of operator-pause state so a normal POST /api/v1/control/pause
    never reports unhealthy. HTTP 503 is returned only when the thread is actually
    dead (unhealthy); ok/degraded both stay HTTP 200, preserving the existing healthy-startup
    contract tests/api/test_rest_parity.py:18-22 already asserts. Separately, SimulationWatchdog''s
    existing log-only critical escalation (src/observability/watchdog.py) now also
    routes a WatchdogTrip AlertEvent through the already-built AlertsManager/AlertRouter/WebhookAlertSink
    stack (reused as-is, no new sink code), using a run_id read from /health''s own
    new engine.run_id field (backed by Kernel.run_id) instead of an invented placeholder.
    docker-compose.yml''s watchdog service gained operator-configurable, default-disabled
    SIM_ALERTS_WEBHOOK_URL/SIM_ALERTS_WEBHOOK_ENABLED env vars. Honest caveat, not
    overclaimed: out of the box, with no SIM_ALERTS_WEBHOOK_URL set, the webhook sink
    stays disabled and the escalation remains effectively log-only in practice --
    only the capability to reach a real external channel is added by this entry.'
  status: verified
  priority: P0
  legacy_evidence: null
  v2_evidence: 'src/api/engine_manager.py: V2EngineManager.is_thread_alive, V2EngineManager.last_tick_age_seconds,
