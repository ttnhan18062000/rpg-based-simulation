    Security-Review phase (after the production security-reviewer agent() call at
    ~line 1364, before the if (securityReview.verdict !== ''APPROVED'') block at ~line
    1378). A candidate model (claude-fable-5-1 -- a distinct model family from whatever
    the main-loop/production reviewer call inherits, chosen to de-correlate failure
    modes) runs against the same diff/evidence the production reviewer just judged,
    on an identical prompt, for logging only. Gated behind SHADOW_REVIEWER_LOGGING_ENABLED
    (strict "1" string equality, off by default) AND a bounded per-reviewer sample
    window (tools/agent-monitoring/shadow_reviewer_window.py::is_shadow_window_open(),
    thresholds 50 for architecture-reviewer / 10 for security-reviewer, sized from
    real historical event volume: 478 vs. 14 historical Architecture-Verify/Security-Review
    events, a ~34:1 ratio) -- once a reviewer''s window closes, zero further candidate
    calls are made for it. The candidate verdict never reaches pushEvent(..., ''failed'',
    ...), writeMonitoring(), or an early return -- both shadow blocks sit structurally
    before the production if-check and never reference the production result variable
    at all, so this is a construction-level guarantee, not a conditional one. Each
    shadow call''s own tool-call footprint is attributed via writeSidecar() to its
    own (run_id, negative_seq) bucket -- seq = -(SHADOW_SEQ_BASE[reviewer] + prior_count_this_run_this_reviewer),
    SHADOW_SEQ_BASE = {architecture-reviewer: 100, security-reviewer: 200} -- provably
    disjoint from the real per-phase seq range (>= 1) and from INFRA-299''s own small
    -1..-5 shadow-packet range, so it never folds into the production call''s tools.jsonl
    cost/tool-count bucket. The verdict itself is written via a new module, tools/agent-monitoring/shadow_reviewer_events.py::emit_shadow_reviewer_event()
    (validates via record_events.validate_record(), writes via writer.write_lines()
    -- not built on tools/retrieval_events.py::emit_retrieval_event(), whose own RETRIEVAL_EVENT_FIELDS
    unknown-field guard would reject this ticket''s candidate_* field family), carrying
    candidate_model, candidate_verdict, candidate_violations_count, and its own independently-computed
    candidate_tool_call_count/candidate_cost_proxy_score (via cost_proxy.compute_cost_proxy_score(),
    formula untouched) plus candidate_wall_time_ms/workflow_wall_time_ms (via a new
    captureEpochMs()/workflowStartMs orchestrator helper pair). Fail-open at three
    levels: shell (2>/dev/null || true), Python (try/except Exception: pass), and
    a wrapping JS try/catch (so even agent() throwing on an API error/timeout cannot
    abort the phase) -- same convention as SHADOW_CONTEXT_PACKET_ENABLED (INFRA-299).
    Does not extend to the pre-Implement Review phase''s separate architecture-reviewer
    call (against prose plan.md, a different call site/input shape), does not widen
    the Security-Review tag-gated trigger condition, and does not build any promotion/"enough
    evidence" comparison-decision logic -- is_shadow_window_open() is a pure mechanical
    stop condition only.'
