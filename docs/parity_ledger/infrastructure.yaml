- id: INFRA-218
  text: "CampaignOrchestrator multi-episode orchestration (Epic 3.2C): CampaignOrchestrator
    drives a sequence of SimulationScenarioDefinitions defined by CampaignManifest. Each
    run_episode() call: builds initial AuthoritativeState from persistent carry-forward data,
    runs one ScenarioRuntimeService episode to terminal objective state, extracts carry-forward
    via _advance_state(), appends EpisodeSummary to episode_history, increments episode_index.
    EntityCarryForward extraction: level <- entity.identity.evolution_level; xp <-
    entity.identity.evolution_points; alive <- entity.lifecycle.active (NOT combat.alive);
    reputation <- entity.social.public_reputation; equipment keys are EquipSlot.name strings.
    FactionCarryForward synthesis: faction_id = f'faction_{faction_int}'; alive = any entity
    with that faction_int has lifecycle.active=True; tension=0.0 (E32D enriches).
    Dead entities (alive=False) and destroyed factions (alive=False) excluded from next
    episode's initial_state injection. Episode RNG seed = CampaignManifest.base_seed +
    episode_index; both AuthoritativeState.seed and DeterministicRNG seeded identically
    (INFRA-101/102). CarryForwardRules boolean dataclass enables per-category toggle.
    CampaignManifest is distinct from analysis-domain CampaignSpec in schema.py."
