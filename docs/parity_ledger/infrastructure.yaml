    can also manifest at large single-draw magnitude on an anchor this entry''s own
    mechanism-1/ mechanism-2 distinction did not previously have COGNITION evidence
    for. This does not contradict or restate the existing mechanism-1/mechanism-2
    distinction above -- it is a new anchor/tier data point for mechanism-1, cross-referenced
    here. See stored_artifacts/TCK-20260716-SIMQ-URBAN-POLITICAL-FULL-PILLAR-SWEEP/investigation.md.
    UPDATE 2026-08-06 (TCK-20260806-PUSH-CUTOVER-COMBAT-ECONOMY-FACTION): a full `make
    simq-full-audit-full` run (79 scenarios, required by that ticket''s own corpus-parity
    Scope item) showed hero_guild_routing_seed42_500t with COMBAT.event_count=0, ECONOMY.event_count=0,
    FACTION.event_count=0 against a non-zero COMBAT anchor. Root-caused, not assumed:
