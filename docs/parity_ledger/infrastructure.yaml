    added to `FeatureFlagManager.__init__`''s dict, default OFF). tools/calibrate_simq.py
    (`_KNOWN_FLAGS` list extended). Verified via real, non-mocked kernel integration
    runs across 6 real worlds (`dungeon_crawl`, `sandbox_world`, `hero_guild_routing`,
    `urban_political`, `wilderness_survival`, `crowded_frontier`, seed 42, 500 ticks
