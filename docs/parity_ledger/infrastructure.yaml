- id: INFRA-294
  text: 'New reciprocal-rank-fusion (RRF) module over the existing dense (embeddings)
    and lexical (BM25) knowledge indexes -- TCK-20260729-HYBRID-RETRIEVAL-FUSION.
    Fixes a confirmed live bug at both `tools/knowledge_search.py::cmd_query()`''s
    hybrid branch and `tools/search_mcp.py::_run_search()`: BM25 scores were only
    ever looked up for rows that had already survived the dense-channel ANN''s bounded
    candidate cut, so a high-BM25, low-semantic-similarity exact match was structurally
    unreachable -- silently dropped from every agent''s `search_docs` MCP call. The
    fix independently retrieves a bounded top-N from each channel, unions by doc_id,
    and fuses via the literal RRF formula (score = sum of 1/(k+rank)), replacing the
    old linear-weighted `_hybrid_score()` formula for the hybrid path only (`_hybrid_score()`
    itself is untouched, still serving `--mode vector`/`--mode keyword` and `tools/search_server.py`,
    deliberately out of this ticket''s scope). Metadata filtering (`authority`/`freshness`,
    resolved via a query-time join against `docs/REGISTRY.yaml`) excludes non-matching
    candidates from each channel''s ranked list before fusion, not after. Follows
    the INFRA-281 through INFRA-293 agent-tooling-infrastructure precedent for ledgering
    this class of code-producing tooling change.

    '
  status: verified
  priority: P2
  legacy_evidence: null
  v2_evidence: 'tools/hybrid_retrieval.py:59-76 (`def reciprocal_rank_fusion()` --
    literal `score = sum(1/(k+rank))` per channel, union over all doc_ids, deliberately
    distinct in name and signature from `tools/eval_search.py::_reciprocal_rank()`,
    an MRR@10 building block over a single ranked list), :104-120 (`def resolve_metadata()`
    -- query-time join against `docs/REGISTRY.yaml`, resolving to the `UNRATED` ("unrated")
    sentinel for any `knowledge_docs` row with no registry entry, never a fabricated
    `P2`/`historical`-looking default), :127-150 (`def filter_candidates()` -- excludes
    non-matching doc_ids from each channel''s ranked list before it ever reaches `reciprocal_rank_fusion()`,
    not a post-hoc down-rank), :164-183 (`class HybridResult` -- the designed, stable
    return shape), :193-210 (`def _dense_candidates()` -- the sole ANN-query seam,
    parameterized on `dense_candidate_k`), :224-317 (`def hybrid_fuse_and_filter()`
    -- the orchestration: independent bounded dense + lexical retrieval, union, pre-fusion
    filter, RRF fusion, deterministic tie-break by doc_id on equal score). tools/knowledge_search.py''s
    `cmd_query()` hybrid branch and tools/search_mcp.py''s `_run_search()` both route
    through `hybrid_fuse_and_filter()`; their `--mode vector`/`--mode keyword` (`knowledge_search.py`)
    and `section` post-filter (`search_mcp.py`) code paths are byte-for-byte unchanged.

    '
