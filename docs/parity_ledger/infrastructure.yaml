    COMBAT, PROGRESSION, and WORLD were checked against real fresh-draw evidence for
    the urban_political_seed123_1000t anchor for the first time (this anchor''s originally-scoped
    pillars were ECONOMY/SOCIAL only) and confirmed small/bounded deviation (max 0.009,
