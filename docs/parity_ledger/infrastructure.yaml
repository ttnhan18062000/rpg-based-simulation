    ~0.003ms/tick throughout), a new, more complete characterization of this entry''s
    dropped-resolution- queue-item mechanism than the "cascading divergence" (partial,
    not total, event-count shift) previously documented above -- this run shows the
    mechanism can starve a domain''s real event count to zero entirely, not just shift
    it. This is additional confirming evidence for this entry, not a new anchor exception
    requiring its own ticket: no anchor value or override table was touched by TCK-20260806-PUSH-CUTOVER-COMBAT-ECONOMY-FACTION,
    since grade_anchors.json/test_grade_regression.py were explicitly out of scope
    for that migration ticket. See staging_artifacts/TCK-20260806-PUSH-CUTOVER-COMBAT-ECONOMY-FACTION/investigation.md
    "Full-corpus verification" section for the full repro methodology and raw-JSONL
    evidence.

    UPDATE 2026-08-06 (TCK-20260806-PUSH-SHADOW-VALIDATION-PERF-PHASE2): a 6-world
    x 500-tick event-stream comparison across the complete Phase 2 shaper registry
    (StrategyShaper/ ProgressionShaper/WorldDynamicsShaper/SocialShaper/DeferredInstrumentationShaper)
    found exact parity in 5 of 6 worlds and 6 event-type mismatches in the 6th (urban_political,
    run with 2 extra CPU-intensive feature flags -- ENABLE_SOCIAL_COOPERATION, ENABLE_SELF_MODEL_COGNITION).
    Root-caused via the same differential-repro discipline as the update above: re-ran
    the identical urban_political config twice more in isolation, isolating self_model_updated
    -- baseline (unmodified, single-pipeline) OFF-mode alone already showed 2.8% run-to-run
    variance (9023 vs 9275), and the ON-mode configuration (both pipelines active,
    per this epic''s still- unguarded-until-cutover design) showed ~18% variance between
    otherwise-identical runs (4298- 4373 vs 5227-5152). Within each individual ON
    run, the two pipelines'' counts stayed close to each other (as expected, since
    both read the same tick''s update data) -- the large swings are between separate
    kernel invocations, not between the two pipelines within one invocation. This
    is the same mechanism, now confirmed present for the Phase 2 registry too, not
    just Phase 1''s 3 domains: more shaper CPU work per tick increases watchdog-trip
    frequency in the already-most-loaded world in the test set, cascading into genuinely
    different simulation trajectories between runs -- not a defect in either the old
    extractor or the new shapers. No anchor or grade_anchors.json value was touched.
    See staging_artifacts/TCK-20260806-PUSH-SHADOW-VALIDATION-PERF-PHASE2/investigation.md
    for the full repro methodology.

