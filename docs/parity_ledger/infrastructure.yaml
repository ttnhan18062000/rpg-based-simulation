- id: INFRA-320
  text: >
    TCK-20260702-OBSISO-ISOLATION-PROOF (G5) -- tools/calibrate_simq.py's _run_engine() hard-fails
    a calibration run when SimQ lost events to either of the two independent loss mechanisms:
    BoundedObservabilityQueue overflow-evict (queue.dropped_count > 0) or ObservabilityMode
    SURVIVAL mode-shed (observability_status()["survival_counts"] non-empty, which bypasses the
    queue entirely -- SimQ receives nothing while the run appears to complete normally). Previously
    neither condition was checked anywhere in calibrate_simq.py or evaluate_simq.py, so a run that
    silently dropped or shed events could still produce a "successful" quality_report.json with a
    misleadingly clean grade. The guard reads kernel.event_recorder.observability_status() and
    .queue.dropped_count once, immediately after the tick loop (kernel.shutdown() is still called
    unconditionally afterward for resource cleanup; the CalibrationIntegrityError raise is a
    separate statement never nested inside that call's exception-swallowing try/except, so it can
    never be silently caught). On every run (pass or fail) a typed RunHealthRecord sidecar
    (quality_report.run_health.json, src/simulation_quality/run_health.py) is written next to
    quality_report.json via QualityPersistence.write_run_health()'s tmp-write-then-os.rename()
    pattern -- additive, QualityReport's own schema is untouched. evaluate_simq.py's --dry-run path
    reads this sidecar and warns (non-fatal) when guard_passed is false, since a dry-run never
    re-executes the engine and cannot observe a live drop itself; evaluate-full inherits the
    hard-fail directly since it calls calibrate_simq.main().
  status: verified
  priority: P0
  legacy_evidence: null
  v2_evidence: >
    tools/calibrate_simq.py (_run_engine(), post-tick-loop guard reading
    kernel.event_recorder.observability_status() / .queue.dropped_count, CalibrationIntegrityError
    raised as its own statement after the unconditional kernel.shutdown() try/except, never nested
    inside it); src/simulation_quality/run_health.py (RunHealthRecord dataclass, to_dict/from_dict);
    src/simulation_quality/persistence.py (QualityPersistence.write_run_health() static method);
    tools/evaluate_simq.py (_warn_if_run_health_guard_failed(), called from the --dry-run path).
  proof_type: regression
  test_path: tests/simulation_quality/test_calibrate_simq.py::TestQueueOverflowGuard::test_calibrate_simq_fails_on_forced_queue_overflow,tests/simulation_quality/test_calibrate_simq.py::TestQueueOverflowGuard::test_calibrate_simq_succeeds_normally_with_zero_drops,tests/simulation_quality/test_calibrate_simq.py::TestSurvivalModeGuard::test_survival_mode_flags_run_instead_of_silently_grading,tests/simulation_quality/test_evaluate_harness.py::TestQueueOverflowGuardIntegration::test_evaluate_simq_flags_queue_overflow_run
