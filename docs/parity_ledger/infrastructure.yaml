    value for those records -- mirrors record_run.py's compute_duration_s "always overrides"
    precedent exactly. implement-ticket.js's writeMonitoring prompt had its old TOOL_STATS-compute
    step removed entirely (an agent following the prompt no longer computes or transmits these two
    fields at all). Records for implement-epic/create-tickets (neither registers a per-agent-call
    sidecar) are left completely untouched by compute_tool_stats -- no key added if not already
    present, preserving their documented "100% missing, no sidecar" behavior, verified by a direct
    regression test. duration_s was investigated in the same pass and confirmed already resolved
    (99.13% coverage, single miss an expected in-progress run) -- no code change made for it.
