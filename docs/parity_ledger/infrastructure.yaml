    regression scan surfaced 61 pillar-level score-tolerance diffs across 76 anchors
    (0 band-level regressions). 41 of these diffs (39 unique anchors, all COGNITION)
    reconciled exactly against the corrected pillar-scoped weight arithmetic -- verified
    per-event by reconstructing each anchor''s pre-fix raw score with the buggy flat-dict-winner
    value substituted back in for each of the 7 known colliding keys, and confirming
    the reconstruction matches the committed (buggy) anchor to floating-point precision
    -- and were re-anchored directly in grade_anchors.json. The remaining 20 diffs
    (14 unique anchors) do NOT reconcile against the weight-collision arithmetic:
    4 are COGNITION event-count anomalies matching the already-closed TCK-20260713-SIMQ-COGNITION-LOOPDET-NONDETERMINISM''s
    F6 kernel-watchdog signature on scenarios that ticket never swept; the remaining
    16 touch pillars the weight fix never reads (SOCIAL, COMBAT, PROGRESSION, NARRATIVE)
    or have a reconstructed pre-fix value that equals the current post-fix value verbatim
    (proving the weight fix caused zero change there). These 14 anchors are intentionally
    left un-reconciled and are NOT evidence against the INFRA-271 fix -- they are
    tracked as a separate, load-sensitivity investigation in TCK-20260715-SIMQ-ANCHOR-LOAD-SENSITIVITY-SWEEP
