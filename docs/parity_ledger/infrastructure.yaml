    Dead entities (alive=False) and destroyed factions (alive=False) excluded from next
    episode's initial_state injection. Episode RNG seed = CampaignManifest.base_seed +
    episode_index; both AuthoritativeState.seed and DeterministicRNG seeded identically
    (INFRA-101/102). CarryForwardRules boolean dataclass enables per-category toggle.
