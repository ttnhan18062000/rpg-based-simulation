- id: INFRA-277
  text: 'Ticket/run status-drift regression check (TCK-20260718-STATUS-DRIFT-REPAIR):
    tools/gate_checks/status_drift_check.py detects two historical data-drift classes
    so the one-time repair does not silently regress. check_ticket_status_drift()
    flags any tickets/done/*.md file whose body `## Status` value is not `DONE`, exempting
    {"EPIC_SCOPED", "SCOPED"} (legitimate epic-tier terminal text) and non-`TCK-`-prefixed
    filenames (pre-TCK-naming legacy files) by value/pattern, never a hardcoded filename
    list. check_runs_jsonl_final_status_drift() flags any agent-monitoring/runs.jsonl
    record whose final_status is not already its own uppercase form, skipping records
    that lack the key entirely (legacy status/started_at schema, out of scope by design).
    check_status_drift() aggregates both. Ships unwired -- no Makefile target, no
    .claude/workflows/*.js call site -- a future ticket decides where/whether to gate
    on it. Motivating one-time data fixes: 71 tickets/done/*.md files'' `## Status`
    corrected OPEN/INPROGRESS -> DONE; 7 runs.jsonl records'' final_status normalized
    "done"/"success" -> "DONE" via line-scoped string substitution (line count and
    every non-target byte unchanged), documented as a one-time, audited exception
    to the file''s append-only-for-new-writes contract in docs/agent-monitoring/schema.md''s
    new "Historical Corrections" subsection. No src/ file was touched by this ticket;
    dashboard-frontend''s classifyFinalStatus() (GanttBar.tsx) is unmodified -- the
    bug was purely in the underlying data, not the classifier -- confirmed by manual
    trace that classifyFinalStatus(''DONE'') already returns ''done''.

