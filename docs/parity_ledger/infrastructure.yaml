- id: INFRA-326
  text: 'TCK-20260806-PUSH-CUTOVER-PHASE2 (epic child 8, final child of TCK-20260806-SIMQ-OBSERVABILITY-PUSH-MIGRATION-PHASE2-EPIC)
    -- found and fixed a real total-blackout bug during this cutover''s own real-kernel
    verification, distinct from INFRA-273''s tick-budget-watchdog trajectory divergence.
    `ENABLE_PUSH_EVENT_SHAPERS_PHASE2`''s default was flipped `OFF`->`ON` in `src/domains/optimization/feature_flags.py`,
    and `event_extractor.py`''s own read of the flag (`_push_shapers_phase2_active`)
    was updated to match -- but `src/observability/event_shapers.py`''s `run_shadow_shapers()`
    function reads the *same* flag string via its own, structurally-independent, hardcoded
    default (`"OFF"`, correct at the time it was written during `TCK-20260806-PUSH-SHAPER-REGISTRY-STRATEGY`,
    since Phase 2 wasn''t cut over yet). This ticket updated the first two call sites
    but not the third, since `event_shapers.py`''s own default read wasn''t part of
    this ticket''s initial mental model of "where the flag is read." Result under
    the real post-cutover default state (no explicit override): `event_extractor.py`''s
    legacy branches correctly suppressed (reading the new "ON" default) AND `event_shapers.py`''s
    Phase 2 shaper registry still not delivering (reading its own stale "OFF" default)
    -- every world tested showed `event_extractor=0` AND `event_shapers=0`, a total
    blackout of all ~50 Phase 2 event types with no explicit flag override anywhere.

    This is the same *bug class* Phase 1''s own cutover (INFRA-273''s sibling entries,
    see `TCK-20260806-PUSH-CUTOVER-COMBAT-ECONOMY-FACTION`) did not encounter, because
    Phase 1''s shaper registry (`SHAPER_REGISTRY`) and its delivery gate live inside
    the single, already- unconditional `run_shadow_shapers()` call path with only
    one flag read (`ENABLE_PUSH_EVENT_SHAPERS`) -- Phase 2 introduced a second, independently-read
    flag (`ENABLE_PUSH_EVENT_SHAPERS_PHASE2`) specifically to avoid double-firing
    against Phase 1''s already-`ON` default (see STRAT-247), and that second flag''s
    two read sites (`event_extractor.py` and `event_shapers.py`) are not structurally
    coupled by the type system or any shared constant -- only by convention and comments.

    '
