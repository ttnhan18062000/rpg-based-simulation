- id: PROG-117
  text: >-
    All 7 PROGRESSION event types (xp_granted, level_up, skill_unlocked, trait_expressed,
    pillar_trait_unlocked, progression_conversion_applied, progression_plateau_detected) are
    available via an apply-layer ProgressionShaper (src/observability/event_shapers.py),
    reading IdentityUpdate.evolution_points_delta/evolution_level_set/learned_skills/
    traits_add/breakthroughs_add/unspent_ap_delta directly -- confirmed learned_skills is a
    per-tick accumulator of newly-unlocked skill IDs, not a full-snapshot replacement, by
    tracing its construction site (src/engine/evolution.py:122-125). progression_plateau_detected
    is cross-tick derived via shaper-local state (_last_xp_tick/_emitted_plateau, mirroring
    EventExtractor's identically-named class attributes) and must run for ANY entity with some
    update this tick, not only an identity-specific one -- a real gating bug found via a real
    kernel run (ON mode initially showed event_shapers=0 vs event_extractor=32 for the same
    500-tick run) and fixed by decoupling the plateau check from the id_upd-not-None gate the
    other 6 events correctly use. Post-fix: event_extractor=32, event_shapers=32, exact parity.
    Registered in PHASE2_SHAPER_REGISTRY, gated by ENABLE_PUSH_EVENT_SHAPERS_PHASE2 (default
    OFF, shared with StrategyShaper -- see STRAT-247). SHADOW-only in this ticket; cutover is a
    separate, later Phase 2 child. (TCK-20260806-PUSH-SHAPER-REGISTRY-PROGRESSION)
  status: verified
  priority: P1
  legacy_evidence: null
  v2_evidence: >-
    src/observability/event_shapers.py — ProgressionShaper, PHASE2_SHAPER_REGISTRY["progression"];
    src/engine/kernel.py — ProgressionShaper.reset_run_state() wired into Kernel.__init__;
    real, non-mocked kernel run (dungeon_crawl_seed42_500t) confirmed event_extractor=32,
    event_shapers=32 exact parity for progression_plateau_detected under ON mode post-fix, and 0
    delivered under SHADOW mode
  proof_type: parity
  test_path: >-
    tests/unit/observability/test_event_shapers_progression.py (18 tests, all passing)
  divergence_note: null
  support_boundary: >-
    SHADOW-mode construction only — live delivery (event_extractor.py's branches flag-gated,
    ENABLE_PUSH_EVENT_SHAPERS_PHASE2 flipped to a live default) is a separate, later Phase 2
    cutover ticket's scope.
  update_2026_08_07: >-
    TCK-20260806-PUSH-CUTOVER-PHASE2: cut over to live delivery. ENABLE_PUSH_EVENT_SHAPERS_PHASE2
    default flipped OFF->ON in feature_flags.py; event_extractor.py's legacy PROGRESSION branches
    (xp_granted through progression_plateau_detected) individually flag-gated behind the new
    _push_shapers_phase2_active. See STRAT-247's update note and infrastructure.yaml INFRA-326 for
    the run_shadow_shapers() default-lockstep bug found and fixed during this cutover — affected
    all Phase 2 domains including this one, verified fixed via real 5-world runs.
- id: PROG-118
  text: >
    TCK-20260806-SIMQ-PROGRESSION-CAPABILITY-LIFECYCLE -- adds 2 new PROGRESSION scoring rules per
    quality_scoring_contract.md's own §7.6 audit: `capability_growth_stalled` (entity's level,
    skill count, equipped-gear count, and gold all flat simultaneously for
    `_CAPABILITY_STALL_TICKS` (300) ticks) and `life_arc_incoherent` (entity reaches Hero's Journey
    `lifecycle.generation >= 2` -- a rebirth already occurred -- while still at `evolution_level
    <= 1` with zero unlocked skills). Both are genuinely new signals, not a migration of existing
    behavior, so both are implemented as new, unconditional (NOT flag-gated behind
    `ENABLE_PUSH_EVENT_SHAPERS_PHASE2`) code directly in `event_extractor.py` -- a deliberate
    architecture decision, not an oversight: `ScoringContext` (the push-shaper architecture's own
    read surface) carries no entity-state snapshot at all (confirmed directly,
    `src/simulation_quality/score_record.py`), while `event_extractor.py`'s `extract()` already
    receives both full `prior_state`/`current_state` snapshots, making all 4 capability dimensions
    directly and reliably readable with zero reconstruction risk -- and since no
    `ProgressionShaper` equivalent exists for either event, there is no double-fire risk requiring
    flag-gated mutual exclusion.
  status: verified
  priority: P2
  legacy_evidence: null
  v2_evidence: >-
    src/observability/event_extractor.py -- _CAPABILITY_STALL_TICKS, _LATE_GENERATION_THRESHOLD,
    _last_capability_growth_tick/_emitted_capability_stalled/_emitted_life_arc_incoherent class
    state (cleared in reset_run_state()), new unconditional detection block in the entity loop;
    config/simulation_quality/scoring_weights.yaml -- capability_growth_stalled: -10.0,
    life_arc_incoherent: -15.0; src/simulation_quality/scorers/progression.py -- 2 new EVENT_TYPES
    entries and score() branches, both reading weights from config (no numeric literals).
  proof_type: parity
  test_path: >-
    tests/unit/observability/test_event_extractor_progression.py (new TestCapabilityGrowthStalled/
    TestLifeArcIncoherent classes), tests/simulation_quality/test_progression_scorer.py (new
    coverage for both event types)
  divergence_note: >-
    Update 2026-08-08 (TCK-20260808-LIFE-ARC-REBIRTH-REACHABILITY-INVESTIGATION): this rule's own
    precondition (`lifecycle.generation >= 2`, a rebirth having occurred) was structurally
    unreachable corpus-wide -- the rebirth-granting mechanic itself only existed in
    `resolve_attack()`, a combat function the real corpus never calls. Fixed at the mechanic level
    (combat_movement.yaml COMB-297, intentional_divergences.md §2.34) -- this scorer rule's own
    detection logic is unchanged and was already correct once its precondition becomes reachable.
  support_boundary: >-
