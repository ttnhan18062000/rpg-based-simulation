    names (agility, endurance, intelligence, spirit, wisdom, perception, charisma)
    fall through both branches with a zero AttributeUpdate, while the unspent_ap decrement
    at line 173 is still applied unconditionally. The only implementation that ever
    validated attribute names (AllocateAttributeAction, src/actions/attributes.py)
    was dead code (zero src/ callers) and was deleted per DEV-004.
  proof_type: regression
  test_path: tests/unit/quest/test_progression_regression.py::test_execute_allocate_ap_silently_no_ops_for_unhandled_attribute
  divergence_note: See DEV-004 (docs/guidelines/intentional_divergences.md) -- the
    ALLOCATE_AP action-router branch is kept wired-but-dormant; this gate is not enforced
    on the live path today.
  support_boundary: null
