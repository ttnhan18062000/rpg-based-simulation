- id: PROG-117
  text: 'All 7 PROGRESSION event types (xp_granted, level_up, skill_unlocked, trait_expressed,
    pillar_trait_unlocked, progression_conversion_applied, progression_plateau_detected)
    are available via an apply-layer ProgressionShaper (src/observability/event_shapers.py),
    reading IdentityUpdate.evolution_points_delta/evolution_level_set/learned_skills/
    traits_add/breakthroughs_add/unspent_ap_delta directly -- confirmed learned_skills
    is a per-tick accumulator of newly-unlocked skill IDs, not a full-snapshot replacement,
    by tracing its construction site (src/engine/evolution.py:122-125). progression_plateau_detected
    is cross-tick derived via shaper-local state (_last_xp_tick/_emitted_plateau,
    mirroring EventExtractor''s identically-named class attributes) and must run for
    ANY entity with some update this tick, not only an identity-specific one -- a
    real gating bug found via a real kernel run (ON mode initially showed event_shapers=0
    vs event_extractor=32 for the same 500-tick run) and fixed by decoupling the plateau
    check from the id_upd-not-None gate the other 6 events correctly use. Post-fix:
    event_extractor=32, event_shapers=32, exact parity. Registered in PHASE2_SHAPER_REGISTRY,
    gated by ENABLE_PUSH_EVENT_SHAPERS_PHASE2 (default OFF, shared with StrategyShaper
    -- see STRAT-247). SHADOW-only in this ticket; cutover is a separate, later Phase
    2 child. (TCK-20260806-PUSH-SHAPER-REGISTRY-PROGRESSION) Amended 2026-09-06 (TCK-20260906-ENTITY-EVOLVED-EVENT-GAP):
    ProgressionShaper gained an 8th event type, entity_evolved (species evolution
    at level thresholds 10/25/50, reading EntityUpdate.kind_set directly -- diffed
    against prior_ent.kind, not id_upd, since kind_set lives on EntityUpdate itself,
    not IdentityUpdate like the other 7 events). Verified against the real EvolutionSystem.evaluate()
    output (src/engine/evolution.py) via tests/unit/progression/test_evolution.py::
    test_goblin_evolution_emits_entity_evolved_observability_event. Same rollback-path
    convention as the other 7: event_extractor.py also carries a flag-gated (_push_shapers_phase2_active)
    mirror block.'
  status: verified
  priority: P1
  legacy_evidence: null
  v2_evidence: "src/observability/event_shapers.py \u2014 ProgressionShaper, PHASE2_SHAPER_REGISTRY[\"\
    progression\"]; src/engine/kernel.py \u2014 ProgressionShaper.reset_run_state()\
    \ wired into Kernel.__init__; real, non-mocked kernel run (dungeon_crawl_seed42_500t)\
    \ confirmed event_extractor=32, event_shapers=32 exact parity for progression_plateau_detected\
    \ under ON mode post-fix, and 0 delivered under SHADOW mode"
  proof_type: parity
  test_path: tests/unit/observability/test_event_shapers_progression.py (18 tests,
    all passing)
  divergence_note: null
  support_boundary: "SHADOW-mode construction only \u2014 live delivery (event_extractor.py's\
