  support_boundary: >-
    Empirical calibration-run verification (1000t urban_political seed123; 1000t
    hero_guild_routing seed42 with ENABLE_ADVENTURE_ROUTING=ON; 500t simq_routing_test seed42
    with ENABLE_ADVENTURE_ROUTING=ON) found zero resource_harvested/item_crafted/trade_executed/
    shop_transaction events in any run — the AC's "real calibration run" bar is unmet, though
