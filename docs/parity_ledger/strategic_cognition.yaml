- id: STRAT-255
  text: >-
    TCK-20260811-REGION-STABILIZATION-GOAL-SCORER -- a new `RegionStabilizationGoalScorer`
    (implementing the existing `GoalScorer` protocol) exists, is registered under a new
    `GoalKind.REGION_STABILIZATION = "region_stabilization"` (src/core/strategic.py, sorts after
    `recover`, before `resolve_blocker`/`social`/`social_contract`/`town_return`/
    `z_adventure_route`), and is a real, unit-tested tier-5 candidate returned by
    `GoalRegistry.get_all_scores()`. It resolves the entity's current region via
    `LegalityServiceV2.get_region_for_position()`, calls a newly extracted shared helper,
    `EventInterpreter.compute_danger_urgency(region)`, and -- if the region is dangerous --
    computes `raw_score = urgency * 2.9` (recalibrated from the pre-migration
    `interpret_regional_danger()`'s `urgency * 100`, which was only valid while `kind="stabilize"`
    was a bare string outside `_score_scale_max()`'s `ProjectKind` classification). A new
    `ProjectKind.STABILIZE = "stabilize"` enum member resolves the missing-enum-member gap that
    made the pre-migration raw score silently fall onto the wrong (100-ceiling) scale.
    `EventInterpreter.interpret_regional_danger()` no longer builds a `ProjectState` or writes
    `current_project_id_set` directly -- it is simplified to concern-generation only, closing the
    confirmed arbiter-bypass site. `StrategicIntelligenceSystem`'s tier-5 winner-construction site
    (src/systems/strategic_systems/intelligence.py, ~line 1505) gained a matching materialization
    branch for a `REGION_STABILIZATION` win, using `best_candidate.metadata.get("raw_score", 0.0)`,
    deliberately never `.utility`. The scorer's `target_pos` is the region's own centroid, fixing an
    inherited "wins but stalls" defect (a bare region id was never tactically resolvable).

    Disclosed scope boundary, un-softened per Design Decision #1 (this is the single most
    consequential decision in this ticket's plan): unlike TCK-20260811-SOCIAL-CONTRACT-GOAL-SCORER
    (whose live-reachability rode on an independent, already-live production writer,
    `execute_recruit()`), `interpret_regional_danger()` has no independent live writer this scorer
    could instead read from -- it has zero production callers, before or after this migration, and
    still does not after this ticket (it exists only for its own concern-generation unit tests). The
    new scorer instead re-implements the hazard-threshold/urgency decision to read `state.regions`
    directly, which means **registering `RegionStabilizationGoalScorer` makes LEG-RPG-116
    (regional-danger-driven stabilization) live-reachable in production for the first time ever** --
    cadence-gated (`SystemCadence.strategic_intelligence`, default every 10 ticks,
    per-entity-staggered) and work-queue-budgeted (`StrategicWorkQueue.build()`, default budget=50),
    the same throttling every other tier-5 scorer (`ADVENTURE_ROUTE`, `SOCIAL_CONTRACT`) already
    operates under -- not "unconditional every tick." This is a genuine, disclosed
    behavior-availability change, not merely a bypass-closure on an already-live path.
