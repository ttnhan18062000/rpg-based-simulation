- id: STRAT-235
  text: >-
    QuestGenerationSystem.quest_to_project() creates the first (active) objective with
    ObjectiveStatus.ACTIVE, not UNRESOLVED. The StrategicIntelligenceSystem.fused_strategic_pass()
    only processes objectives with status==ACTIVE for blocker resolution and navigation;
    an UNRESOLVED first objective causes the quest project to be silently inert.
    Material blockers on an entity produce at least one resource_expedition quest template
    via generate_from_blockers(), and the resulting ProjectState is accepted by
    evaluate_project_switch() when it outscores the current project. (TCK-20260627-P1B-QUEST-ACTIVATION)
  status: verified
  priority: P1
