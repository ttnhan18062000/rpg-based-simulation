  divergence_note: null
  support_boundary: >-
    Reachability (objective -> ActionIntentAdapter.execute()) is proven for every ObjectiveKind
    at the unit/integration level. Whether execution produces a live economy event in real
    calibration play depends on separate, out-of-scope factors documented in STRAT-246 below
    (ENABLE_ADVENTURE_ROUTING default-off in most calibration profiles; AdventureRouteScorer
    scoring competition against form_party/gather_resource). The third factor previously listed
    here — ObjectiveIntentResolver's REACH_RESOURCE -> MOVE_TO mapping never transitioning to a
    harvest/interact action on arrival — was closed by
    TCK-20260714-SIMQ-HARVEST-RESOURCE-ARRIVAL-TRANSITION via call-site gating in
    TacticalDecisionSystem's Pillar 5.1 elif branch (src/engine/tactical.py:260-295), which now
    captures the previously-discarded node_id and, once dist <= 1.0 and node_id is not None,
