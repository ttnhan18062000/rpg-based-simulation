    ObjectiveStatus.ACTIVE (index-0), remaining objectives use UNRESOLVED (index>0);
    src/systems/strategic_systems/intelligence.py — fused_strategic_pass() active_obj
    check at L396 requires ObjectiveStatus.ACTIVE; evaluate_project_switch() at L881
