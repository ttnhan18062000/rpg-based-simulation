    task/navigation/interaction EntityUpdate; ACQUIRE_ITEM, REACH_RESOURCE, BUY_ITEM, and every
    other ObjectiveKind System A (src/domains/adventure/) or System B
    (src/systems/strategic_systems/intelligence.py) could produce fell through to a bare idle
    EntityUpdate at tactical.py:319. ObjectiveIntentResolver (src/domains/adventure/resolver.py),
    which already maps every ObjectiveKind to an executable ActionIntent, was orphaned dead code —
    called only by its own unit test. Fixed by wiring ObjectiveIntentResolver.resolve() +
    ActionIntentAdapter.execute() into a new elif branch in tactical.py's Pillar 5.1
    (src/engine/tactical.py:260-287), reached whenever obj.kind is neither REACH_LOCATION
    (existing, unmodified branch) nor DEFEAT_ENEMY (handled by the separate hostile-engagement
    branch, tactical.py:321-666).
  proof_type: regression
  test_path: >-
    tests/unit/tactical/test_objective_pursuit_coverage.py::test_objective_kind_acquire_item_produces_executable_action;
    tests/unit/tactical/test_objective_pursuit_coverage.py::test_objective_kind_reach_resource_produces_executable_action;
    tests/unit/tactical/test_objective_pursuit_coverage.py::test_objective_kind_reach_resource_arrival_produces_harvest_action;
