- id: STRAT-254
  text: 'TCK-20260811-SOCIAL-CONTRACT-GOAL-SCORER -- a new `SocialContractGoalScorer`
    (implementing the existing `GoalScorer` protocol) exists, is registered under
    a new `GoalKind.SOCIAL_CONTRACT = "social_contract"` (src/core/strategic.py, deliberately
    NOT `"z_"`-prefixed so it sorts ahead of `ADVENTURE_ROUTE` on an exact-utility
    tie), and is a real, unit-tested tier-5 candidate returned by `GoalRegistry.get_all_scores()`.
    It scans an entity''s ACTIVE RECRUITMENT/LOAN contracts, computes `raw_score =
    clamp(trust*1.0 + urgency*1.0 + value*0.9 - risk_weight*0.3, 0.0, 2.9)` per contract
    from real state (`entity.social.bonds`/`trust_history`, `contract.expiry_tick`/`terms`),
    and reduces multiple simultaneous active contracts to one candidate (highest raw
    score wins, ties broken by contract id ascending) inside a single `score()` call.
    `ContractService.accept_contract()` (src/systems/social_systems/contracts.py)
    no longer builds `ProjectState`/`ObjectiveState` inline or writes `current_project_id_set`
    directly -- it now only transitions contract status, closing the confirmed arbiter-bypass
    site. `StrategicIntelligenceSystem`''s tier-5 winner-construction site (src/systems/strategic_systems/intelligence.py,
    ~line 1468) gained a matching materialization branch for a `SOCIAL_CONTRACT` win,
    using `best_candidate.metadata.get("raw_score", 0.0)`, deliberately never `.utility`
    (the same scale-mismatch defect class fixed in TCK-20260811-INTERRUPTION-BYPASS-RETENTION-MARGIN-SCALE-BUG).
    The materialized `ProjectState.kind` uses `ContractService.get_project_mapping()`''s
    real `ProjectKind` member (RECRUITMENT -> COMBAT, LOAN -> SOCIAL), which lands
    on the same `_ADVENTURE_ROUTE_SCORE_MAX = 2.9` scale as adventure routes via `_score_scale_max()`''s
    `isinstance(kind, ProjectKind)` classification -- a deliberate, disclosed design
    choice (reusing the existing scale rather than extending the classifier), not
    an oversight. Disclosed scope boundary: `accept_contract()` itself has no production
    caller today, but `SocialContractGoalScorer` is confirmed live-reachable via `CoreActions.execute_recruit()`
    (src/engine/domain/core_actions.py:96-105), which builds ACTIVE RECRUITMENT contracts
    directly -- so this fix has real production impact without requiring `accept_contract()`
    to be wired into a live call site.'
