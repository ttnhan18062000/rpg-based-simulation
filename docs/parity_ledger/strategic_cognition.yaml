    (src/engine/intent/action_intent.py). ActionIntentAdapter gained two new dispatch branches,
    REQUEST_CRAFT and BUY_ITEM, routing through ResourceTransferIntent(source_kind="CRAFTING"/"SHOP_BUY")
    into the existing, unmodified ResourceTransactionResolver.resolve() "CRAFTING"/"SHOP_BUY"
    branches (src/core/conservation.py:133,155) — the same authoritative mutation path
