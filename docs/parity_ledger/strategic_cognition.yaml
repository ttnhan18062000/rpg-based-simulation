    dominated at ~80% selection share) though craft_item/buy_item opportunities were confirmed
    generated (ServiceOpportunityProvider.get_opportunities returns real Opportunity records for
    every hero in both runs); (3) ObjectiveIntentResolver.resolve() maps REACH_RESOURCE to
    "MOVE_TO" unconditionally, including on arrival, so the gather_resource routes that *were*
