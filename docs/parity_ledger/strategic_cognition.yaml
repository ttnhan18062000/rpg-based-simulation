  v2_evidence: >
    TCK-20260713-SIMQ-ECONOMY-INTENT-GENERATION-GAP. New elif branch in
    TacticalDecisionSystem.evaluate_entity_intent's Pillar 5.1 (src/engine/tactical.py:260-287),
    reached when obj.kind is neither REACH_LOCATION (existing, unmodified branch,
    tactical.py:214-259) nor DEFEAT_ENEMY (separate hostile-engagement branch,
    tactical.py:321-666): resolves the objective's target position via the same
    int-cast + resource_nodes/buildings lookup REACH_LOCATION already uses
    (_resolve_target_position, extracted as a pure refactor in the same change), then calls
