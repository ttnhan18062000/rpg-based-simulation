- id: STRAT-225
  text: AdventureDecisionPhase.apply() calls ResourceOpportunityProvider.get_opportunities(hero,
    state) concatenated with ServiceOpportunityProvider.get_opportunities(hero, state)
    before AdventureRouteGenerator.generate(), passing the combined result as opportunities=
    so the primary opportunity loop executes and GATHER_RESOURCE/BUY_UPGRADE/CRAFT_UPGRADE/
    REPAIR_GEAR/ASK_INFORMATION/REST_INN route families can be produced each tick.
  status: verified
  priority: P0
  legacy_evidence: null
  v2_evidence: >-
    src/domains/adventure/phase.py — ResourceOpportunityProvider imported at module
    level; opportunities fetched per hero before generate() call
    (TCK-20260619-FIX-ADVENTURE-OPPORTUNITY-WIRING). Decision trace writer import
    hoisted to module level in TCK-20260624-FIX-PERF-BUDGETS, eliminating O(n)
    Pydantic model construction overhead (472ms → <5ms for 100 entities).
    Updated by TCK-20260713-SIMQ-ECONOMY-INTENT-GENERATION-GAP: ServiceOpportunityProvider
    (src/world/providers/services.py), previously defined but never called by
    AdventureDecisionPhase.apply(), is now imported and concatenated with
    ResourceOpportunityProvider's result at the same call site
    (src/domains/adventure/phase.py — "1. Generate candidate route options"), so
    craft_item/buy_item/repair_gear/ask_information/rest_inn opportunities are generated
    at all, not just gather_resource-derived ones. This raised the phase's real per-tick
    cost from ~4-5ms to ~44-48ms for 105 entities (O(services × recipes) growth), which
    required recalibrating this entry's own perf-budget test threshold (20ms → 70ms,
    see test file's inline comment) — not a regression, a real structural cost of closing
    the opportunity-generation gap.
  proof_type: parity
  test_path: tests/perf/test_phase3_adventure_decision_budget.py::test_phase3_adventure_decision_perf_budget
  divergence_note: null
  support_boundary: null
- id: STRAT-226
  text: >-
    GoalRegistry's CombatEngageScorer/CombatRetreatScorer apply a bravery-weighted
    utility term (CombatEngageScorer: utility += bravery×40.0; CombatRetreatScorer:
    utility -= bravery×30.0, src/ai/goals/scorers.py:101-132) that produces ≥1.5×
    combat_engage rate differential between bottom and top bravery quartiles
    (measured mean ratio 1.7421× across a 24-seed aggregate, 16 heroes/8 monsters,
    90x90 topology). The System-A AdventureRouteScorer bravery/caution risk
    multiplier this entry previously cited (src/domains/adventure/scoring.py) is a
    real, live mechanism for its own route family, but RouteFamily.HUNT_WEAK_ENEMY
    (its only combat-tagged route) is confirmed dead code — AdventureRouteScorer
    can never route a hero into combat_engage today. The measured combat_engage
    rate differential is produced entirely by System B (GoalRegistry).
  status: verified
  priority: P1
  legacy_evidence: null
  v2_evidence: >-
    src/ai/goals/scorers.py lines 101-132 — CombatEngageScorer bravery coefficient
    +40.0, CombatRetreatScorer bravery coefficient -30.0; src/ai/goals/__init__.py
    GoalRegistry registration. Measured bottom_rate=0.4576, top_rate=0.7972,
    ratio=1.7421 (24-seed mean, SEEDS=1..24, 16 heroes, 8 monsters, 90x90 topology)
    confirmed by TCK-20260810-COMBAT-BRAVERY-QUARTILE-ENGAGEMENT-INVERSION,
    superseding the stale System-A/E11D attribution and 4.92× figure from
    TCK-20260619-E11D-SCORING-CAL (measured before ENABLE_COMBAT_ENGAGEMENT ran
    end-to-end; the 2x threshold implied by that figure was never reachable once
    combat_engagement actually executed and has been recalibrated to 1.5x).
  proof_type: parity
  test_path: tests/integration/scenarios/test_entity_differentiation.py::test_bravery_quartile_combat_rate_2x
  divergence_note: null
  support_boundary: null
- id: STRAT-227
  text: >-
    AdventureRouteScorer applies a fixed blocker_penalty = 2.0 to any route with
    non-empty blockers; personality_bias weights: greed=0.50 (GATHER_RESOURCE,
    SELL_LOOT_FOR_GOLD, TAKE_EASY_QUEST, QUEST_OPPORTUNITY), sociability=0.40
    (FORM_PARTY), caution/curiosity/industry=0.25 (their respective families);
    confidence_bonus weight = 0.15; risk weight = 0.5 × risk_multiplier; for
    GATHER_RESOURCE routes the benefit term is multiplied by depletion_fraction =
    remaining_charges / max_charges (0.0 when empty, 1.0 when full); all
    constants documented in docs/mechanics/04_strategic_cognition.md §6.4;
    memory_adjustment = ±1.0 when a matching CausalMemoryEntry.future_advice is present
    (avoid_enemy → HUNT_WEAK_ENEMY suppress, boost_party_trust → FORM_PARTY promote),
    all constants documented in docs/mechanics/04_strategic_cognition.md §6.11;
    confidence_bonus for GATHER_RESOURCE/CRAFT_UPGRADE routes with a resolvable
    capability key (resource kind via resource_nodes[target_node_id].kind, or recipe
    id via route.requirements's recipe_known entry) is computed via an ad-hoc
    CapabilityEstimateService.estimate() call instead of route.confidence, same 0.15
    weight; all other routes, and mapped routes whose key cannot be resolved, keep
    route.confidence × 0.15; entity.self_model.capabilities itself remains
    unpopulated in production; all constants documented in
    docs/mechanics/04_strategic_cognition.md §6.12.
  status: verified
  priority: P1
  legacy_evidence: null
  v2_evidence: >-
    src/domains/adventure/scoring.py AdventureRouteScorer.score() — blocker_penalty=2.0,
    confidence_bonus=0.15, greed weight=0.50, sociability weight=0.40, other trait
    weights=0.25 (E11C calibration, TCK-20260628-E11C-WEIGHT-TUNING, 2026-06-28).
    Weights raised from uniform 0.25 after E11B audit showed greed/sociability Δ<0.05.
    Depletion-fraction multiplier on benefit term for GATHER_RESOURCE
    (TCK-20260619-E21C-SCORING-WIRE, 2026-06-20). E12A measurement:
    blocker_frequency=0.0 → blocker constant retained (TCK-20260619-E12B-BLOCKER-RECAL).
    memory_adjustment = ±1.0 fixed magnitude, boolean-gated per advice string, entity's own
    subjective causal-memory belief only, not yet observable in a live run since
    MemoryUpdatePhase has zero pipeline call sites (TCK-20260811-MEMORY-INFORMED-ROUTE-SCORING).
    confidence_bonus capability-driven source for GATHER_RESOURCE/
    CRAFT_UPGRADE, ad-hoc CapabilityEstimateService.estimate() call, SelfModelUpdatePhase.apply()
    still never passes capability_context (TCK-20260811-CAPABILITY-CONFIDENCE-ADVENTURE-SCORING).
  proof_type: parity
  test_path: >-
    tests/unit/domains/adventure/test_phase3_route_scoring.py;
    tests/unit/domains/adventure/test_depletion_scoring.py;
    tests/unit/domains/adventure/test_memory_informed_scoring.py;
    tests/unit/domains/adventure/test_capability_confidence_scoring.py
  divergence_note: null
  support_boundary: null
