- id: STRAT-246
  text: >
    Every ObjectiveKind System A (src/domains/adventure/) or System B
    (src/systems/strategic_systems/intelligence.py) can produce reaches real execution via
    ActionIntentAdapter.execute(), not just REACH_LOCATION.
  status: verified
  priority: P0
  legacy_evidence: null
  v2_evidence: >
    TCK-20260713-SIMQ-ECONOMY-INTENT-GENERATION-GAP. New elif branch in
    TacticalDecisionSystem.evaluate_entity_intent's Pillar 5.1 (src/engine/tactical.py:260-287),
    reached when obj.kind is neither REACH_LOCATION (existing, unmodified branch,
    tactical.py:214-259) nor DEFEAT_ENEMY (separate hostile-engagement branch,
    tactical.py:321-666): resolves the objective's target position via the same
    int-cast + resource_nodes/buildings lookup REACH_LOCATION already uses
    (_resolve_target_position, extracted as a pure refactor in the same change), then calls
    ObjectiveIntentResolver.resolve() (src/domains/adventure/resolver.py, previously orphaned —
    called only by its own unit test) and ActionIntentAdapter.execute()
    (src/engine/intent/action_intent.py). ActionIntentAdapter gained two new dispatch branches,
    REQUEST_CRAFT and BUY_ITEM, routing through ResourceTransferIntent(source_kind="CRAFTING"/"SHOP_BUY")
    into the existing, unmodified ResourceTransactionResolver.resolve() "CRAFTING"/"SHOP_BUY"
    branches (src/core/conservation.py:133,155) — the same authoritative mutation path
    src/engine/blacksmith.py and src/town/shop.py already use — deliberately not
    CraftingSystem.craft() directly, which would bypass intent_results/event_extractor.py's
    item_crafted derivation. AdventureDecisionPhase.apply also now calls
    ServiceOpportunityProvider.get_opportunities (src/domains/adventure/phase.py), previously
    never wired in, so craft_item/buy_item/repair_gear/ask_information/rest_inn opportunities are
    generated at all.

    TCK-20260714-SIMQ-HARVEST-RESOURCE-ARRIVAL-TRANSITION. Closed the REACH_RESOURCE arrival gap
    left open above: the same Pillar 5.1 elif branch (tactical.py:260-295) now captures the
    node_id that _resolve_target_position already resolves (previously discarded), and — when
    obj.kind == ObjectiveKind.REACH_RESOURCE and node_id is not None once dist <= 1.0 — builds an
    ActionIntent(kind="HARVEST_RESOURCE", target_id=node_id) and routes it through
    ActionIntentAdapter.execute()'s existing HARVEST_RESOURCE dispatch, instead of falling through
    to ObjectiveIntentResolver.resolve()'s unconditional REACH_RESOURCE -> MOVE_TO mapping.
    resolver.py is unmodified; its REACH_RESOURCE -> MOVE_TO mapping remains the fallback for the
    rare case where target_pos resolves but node_id does not. The far-away case (dist > 1.0) is
    unchanged.
  proof_type: regression
  test_path: >-
    tests/integrity/test_logic_guards.py::test_objective_intent_resolver_is_reachable_from_production_pipeline;
    tests/unit/tactical/test_objective_pursuit_coverage.py;
    tests/unit/tactical/test_objective_pursuit_coverage.py::test_objective_kind_reach_resource_arrival_produces_harvest_action;
    tests/unit/domains/adventure/test_craft_upgrade_execution.py;
    tests/integration/domains/adventure/test_harvest_to_event.py;
    tests/integration/domains/adventure/test_harvest_to_event.py::test_reach_resource_arrival_produces_resource_harvested_event_through_full_pipeline
  divergence_note: null
  support_boundary: >-
    Empirical calibration-run verification (1000t urban_political seed123; 1000t
    hero_guild_routing seed42 with ENABLE_ADVENTURE_ROUTING=ON; 500t simq_routing_test seed42
    with ENABLE_ADVENTURE_ROUTING=ON) found zero resource_harvested/item_crafted/trade_executed/
    shop_transaction events in any run — the AC's "real calibration run" bar is unmet, though
    reachability itself (this entry's text) is proven at the unit/integration level (test_path
    above) via direct, real-pipeline-component construction (ActionIntentAdapter.execute() ->
    ResourceTransactionSystem.resolve_all() -> EventExtractor.extract() + run_shadow_shapers()'s
    EconomyShaper, no mocks; event_extractor.py's own legacy ECONOMY loop is the flag-gated
    rollback path as of TCK-20260806-PUSH-CUTOVER-COMBAT-ECONOMY-FACTION, not the live terminus).
    Three distinct,
    out-of-scope contributing factors were empirically isolated: (1) ENABLE_ADVENTURE_ROUTING
    defaults to FeatureMode.OFF (src/domains/optimization/feature_flags.py) and the
    urban_political calibration profile never turns it on, so System A never runs in the
    corpus data this ticket's own discovery evidence was drawn from; (2) even with
    ENABLE_ADVENTURE_ROUTING=ON, AdventureRouteScorer selected gather_resource (100/1000 and
    50/500 ticks) but never craft_upgrade/buy_upgrade against competing routes (form_party
    dominated at ~80% selection share) though craft_item/buy_item opportunities were confirmed
    generated (ServiceOpportunityProvider.get_opportunities returns real Opportunity records for
    every hero in both runs); (3) [CLOSED by TCK-20260714-SIMQ-HARVEST-RESOURCE-ARRIVAL-TRANSITION]
    ObjectiveIntentResolver.resolve() mapped REACH_RESOURCE to "MOVE_TO" unconditionally, including
    on arrival, so the gather_resource routes that *were* selected never transitioned to a
    harvest/interact action. The fix is call-site gating in TacticalDecisionSystem's Pillar 5.1
    elif branch (src/engine/tactical.py:260-295), not a change to
    ObjectiveIntentResolver.resolve() itself (resolver.py:23-90 remains untouched and still serves
    as the fallback for the rare/malformed case where target_pos resolves but node_id does not):
    the branch now captures the node_id that _resolve_target_position already returned and
    discarded, and — once dist <= 1.0 (arrived) and node_id is not None — builds an
    ActionIntent(kind="HARVEST_RESOURCE", target_id=node_id) routed through
    ActionIntentAdapter.execute()'s existing HARVEST_RESOURCE dispatch (action_intent.py:78,130),
    which converges on the same authoritative completion path (InteractionSystem.enforce ->
    ResourceTransactionSystem.resolve_all -> run_shadow_shapers()'s EconomyShaper
    resource_harvested derivation, the same live terminus established above; event_extractor.py's
    own resource_harvested branch is the flag-gated legacy rollback path, not the terminus)
    that REACH_LOCATION's arrival branch already uses. Verified end-to-end, non-mocked, by
    tests/integration/domains/adventure/test_harvest_to_event.py::test_reach_resource_arrival_produces_resource_harvested_event_through_full_pipeline.
    None of factors (1) and (2) were touched, per this ticket's explicit scope guards (do not
    touch scorer weights/thresholds, do not touch feature-flag defaults) — they remain
    calibration-profile/scoring-balance questions belonging to the simq_audit/calibration
    workstream and are not filed as separate tickets here.
