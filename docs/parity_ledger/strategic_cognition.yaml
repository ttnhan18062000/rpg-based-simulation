- id: STRAT-227
  text: "AdventureRouteScorer applies a fixed blocker_penalty = 2.0 to any route with\
    \ non-empty blockers; personality_bias weights: greed=0.50 (GATHER_RESOURCE, SELL_LOOT_FOR_GOLD,\
    \ TAKE_EASY_QUEST, QUEST_OPPORTUNITY), sociability=0.40 (FORM_PARTY), caution/curiosity/industry=0.25\
    \ (their respective families); confidence_bonus weight = 0.15; risk weight = 0.5\
    \ \xD7 risk_multiplier; for GATHER_RESOURCE routes the benefit term is multiplied\
    \ by depletion_fraction = remaining_charges / max_charges (0.0 when empty, 1.0\
    \ when full); all constants documented in docs/mechanics/04_strategic_cognition.md\
    \ \xA76.4; memory_adjustment = \xB11.0 when a matching CausalMemoryEntry.future_advice\
    \ is present (avoid_enemy \u2192 HUNT_WEAK_ENEMY suppress, boost_party_trust \u2192\
    \ FORM_PARTY promote), all constants documented in docs/mechanics/04_strategic_cognition.md\
    \ \xA76.11; confidence_bonus for GATHER_RESOURCE/CRAFT_UPGRADE routes with a resolvable\
    \ capability key (resource kind via resource_nodes[target_node_id].kind, or recipe\
    \ id via route.requirements's recipe_known entry) is computed via an ad-hoc CapabilityEstimateService.estimate()\
    \ call instead of route.confidence, same 0.15 weight; all other routes, and mapped\
    \ routes whose key cannot be resolved, keep route.confidence \xD7 0.15; entity.self_model.capabilities\
    \ itself remains unpopulated in production; all constants documented in docs/mechanics/04_strategic_cognition.md\
    \ \xA76.12."
  status: verified
  priority: P1
  legacy_evidence: null
  v2_evidence: "src/domains/adventure/scoring.py AdventureRouteScorer.score() \u2014\
    \ blocker_penalty=2.0, confidence_bonus=0.15, greed weight=0.50, sociability weight=0.40,\
    \ other trait weights=0.25 (E11C calibration, TCK-20260628-E11C-WEIGHT-TUNING,\
    \ 2026-06-28). Weights raised from uniform 0.25 after E11B audit showed greed/sociability\
