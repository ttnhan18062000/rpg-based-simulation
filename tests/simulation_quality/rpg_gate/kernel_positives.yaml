# Each validity id of the rpg gate -> the pytest node ids of its REAL-KERNEL positive tests (TCK-20261019-RPG-GATE-EVERY-VALIDITY-ROW-HAS-A-KERNEL-POSITIVE).
# A kernel positive forces a violation through `build_kernel` and asserts `violations > 0` on the row the metric module emits.
# The node ids come from rpg (the tests are theirs); the map and its lint are testing's:
#   tests/architecture/test_rpg_gate_validity_rows_have_kernel_positives.py
# A new V-id PR adds its entry here together with its test. Controls (the same setup with the check satisfied) are not entries.
