<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RPG Simulation | Strategic Cognition Visualizer</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.26.0/cytoscape.min.js"></script>
    <script src="https://unpkg.com/dagre@0.8.5/dist/dagre.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/cytoscape-dagre@2.5.0/cytoscape-dagre.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&family=JetBrains+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0f172a;
            --surface: rgba(30, 41, 59, 0.7);
            --border: rgba(255, 255, 255, 0.1);
            --text: #f8fafc;
            --text-dim: #94a3b8;
            --accent-directive: #a855f7;
            --accent-project: #3b82f6;
            --accent-objective: #10b981;
            --accent-concern: #ef4444;
            --accent-motive: #f59e0b;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Outfit', sans-serif;
            overflow: hidden;
        }

        #app {
            display: flex;
            width: 100vw;
            height: 100vh;
        }

        #cy {
            flex-grow: 1;
            background-image: 
                radial-gradient(rgba(255,255,255,0.05) 1px, transparent 1px);
            background-size: 32px 32px;
        }

        #sidebar {
            width: 380px;
            background: var(--surface);
            backdrop-filter: blur(12px);
            border-left: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            padding: 24px;
            box-sizing: border-box;
            z-index: 10;
        }

        .header {
            margin-bottom: 32px;
        }

        h1 {
            font-size: 20px;
            font-weight: 600;
            margin: 0;
            letter-spacing: -0.02em;
            background: linear-gradient(to right, #60a5fa, #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .drop-zone {
            border: 2px dashed var(--border);
            border-radius: 12px;
            padding: 32px 20px;
            text-align: center;
            color: var(--text-dim);
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
            margin-bottom: 24px;
        }

        .drop-zone:hover, .drop-zone.active {
            border-color: var(--accent-project);
            background: rgba(59, 130, 246, 0.1);
            color: var(--text);
        }

        .info-panel {
            flex-grow: 1;
            overflow-y: auto;
            display: none;
        }

        .info-panel.visible {
            display: block;
        }

        .node-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .node-kind {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 24px;
        }

        .attr-group {
            margin-bottom: 16px;
        }

        .attr-label {
            font-size: 11px;
            text-transform: uppercase;
            color: var(--text-dim);
            margin-bottom: 4px;
        }

        .attr-value {
            font-family: 'JetBrains Mono', monospace;
            font-size: 13px;
            word-break: break-all;
            background: rgba(0,0,0,0.2);
            padding: 8px;
            border-radius: 6px;
        }

        .legend {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: auto;
            padding-top: 24px;
            border-top: 1px solid var(--border);
        }

        .legend-item {
            display: flex;
            align-items: center;
            font-size: 12px;
            color: var(--text-dim);
        }

        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin-right: 8px;
        }

        /* KIND COLORS */
        .kind-directive { background-color: var(--accent-directive); color: white; }
        .kind-project { background-color: var(--accent-project); color: white; }
        .kind-objective { background-color: var(--accent-objective); color: white; }
        .kind-concern { background-color: var(--accent-concern); color: white; }
        .kind-motive { background-color: var(--accent-motive); color: white; }
    </style>
</head>
<body>

<div id="app">
    <div id="cy"></div>
    <div id="sidebar">
        <div class="header">
            <h1>STRATEGIC COGNITION</h1>
            <div style="font-size: 12px; color: var(--text-dim); margin-top: 4px;">Milestone 7 Engine Visualizer</div>
        </div>

        <div id="dropZone" class="drop-zone">
            Drop cognition_e[id].json here<br>
            <span style="font-size: 12px; opacity: 0.6;">or click to select</span>
            <input type="file" id="fileInput" style="display: none" accept=".json">
        </div>

        <div id="infoPanel" class="info-panel">
            <div id="nodeTitle" class="node-title">Selection Required</div>
            <div id="nodeKind" class="node-kind">None</div>
            <div id="nodeAttrs"></div>
        </div>

        <div class="legend">
            <div class="legend-item"><div class="dot" style="background: var(--accent-directive)"></div>Directive</div>
            <div class="legend-item"><div class="dot" style="background: var(--accent-project)"></div>Project</div>
            <div class="legend-item"><div class="dot" style="background: var(--accent-objective)"></div>Objective</div>
            <div class="legend-item"><div class="dot" style="background: var(--accent-concern)"></div>Concern</div>
        </div>
    </div>
</div>

<script>
    let cy = null;

    const stylesheet = [
        {
            selector: 'node',
            style: {
                'width': 45,
                'height': 45,
                'label': 'data(label)',
                'color': '#f8fafc',
                'font-family': 'Outfit',
                'font-size': '10px',
                'text-valign': 'bottom',
                'text-margin-y': '8px',
                'background-color': '#475569',
                'border-width': 2,
                'border-color': 'rgba(255,255,255,0.1)',
                'overlay-padding': '6px',
                'transition-property': 'background-color, border-color, width, height',
                'transition-duration': '0.2s'
            }
        },
        {
            selector: 'node[kind = "directive"]',
            style: { 'background-color': '#a855f7', 'width': 60, 'height': 60, 'font-weight': 'bold' }
        },
        {
            selector: 'node[kind = "project"]',
            style: { 'background-color': '#3b82f6', 'shape': 'round-rectangle', 'width': 50, 'height': 40 }
        },
        {
            selector: 'node[kind = "objective"]',
            style: { 'background-color': '#10b981', 'shape': 'ellipse' }
        },
        {
            selector: 'node[kind = "concern"]',
            style: { 'background-color': '#ef4444', 'shape': 'triangle' }
        },
        {
            selector: 'edge',
            style: {
                'width': 2,
                'line-color': 'rgba(255,255,255,0.1)',
                'target-arrow-color': 'rgba(255,255,255,0.1)',
                'target-arrow-shape': 'triangle',
                'curve-style': 'bezier',
                'label': 'data(label)',
                'font-size': '8px',
                'color': '#64748b',
                'text-rotation': 'autorotate',
                'text-margin-y': '-10px',
                'arrow-scale': 0.8
            }
        },
        {
            selector: 'edge[kind = "pursuing"]',
            style: { 'line-color': '#60a5fa', 'width': 4, 'target-arrow-color': '#60a5fa' }
        },
        {
            selector: 'edge[kind = "mitigating"]',
            style: { 'line-color': '#f87171', 'line-style': 'dashed' }
        },
        {
            selector: 'node:selected',
            style: {
                'background-color': '#fff',
                'border-color': '#60a5fa',
                'border-width': 4
            }
        }
    ];

    function initCytoscape(elements) {
        if (cy) cy.destroy();
        
        cy = cytoscape({
            container: document.getElementById('cy'),
            elements: elements,
            style: stylesheet,
            layout: { 
                name: 'dagre',
                rankDir: 'TB',
                spacingFactor: 1.2
            }
        });

        cy.on('tap', 'node', function(evt) {
            const node = evt.target;
            showNodeDetails(node.data());
        });

        cy.on('tap', function(evt) {
            if (evt.target === cy) {
                document.getElementById('infoPanel').classList.remove('visible');
            }
        });
    }

    function showNodeDetails(data) {
        const panel = document.getElementById('infoPanel');
        const title = document.getElementById('nodeTitle');
        const kind = document.getElementById('nodeKind');
        const attrs = document.getElementById('nodeAttrs');

        panel.classList.add('visible');
        title.innerText = data.label;
        kind.innerText = data.kind;
        kind.className = 'node-kind kind-' + data.kind;

        let html = '';
        for (const [key, val] of Object.entries(data)) {
            if (['id', 'label', 'kind'].includes(key)) continue;
            
            html += `<div class="attr-group">
                <div class="attr-label">${key}</div>
                <div class="attr-value">${typeof val === 'object' ? JSON.stringify(val, null, 2) : val}</div>
            </div>`;
        }
        attrs.innerHTML = html;
    }

    // File Handling
    const dropZone = document.getElementById('dropZone');
    const fileInput = document.getElementById('fileInput');

    dropZone.onclick = () => fileInput.click();

    dropZone.ondragover = (e) => {
        e.preventDefault();
        dropZone.classList.add('active');
    };

    dropZone.ondragleave = () => dropZone.classList.remove('active');

    dropZone.ondrop = (e) => {
        e.preventDefault();
        dropZone.classList.remove('active');
        const file = e.dataTransfer.files[0];
        handleFile(file);
    };

    fileInput.onchange = (e) => {
        const file = e.target.files[0];
        handleFile(file);
    };

    function handleFile(file) {
        if (!file || !file.name.endsWith('.json')) return;

        const reader = new FileReader();
        reader.onload = (e) => {
            try {
                const data = JSON.parse(e.target.result);
                // cytoscape adapter structure: { elements: { nodes: [], edges: [] }, metadata: {} }
                if (data.elements) {
                    initCytoscape(data.elements);
                    document.getElementById('dropZone').style.display = 'none';
                } else {
                    alert("Invalid format: Missing 'elements' key.");
                }
            } catch (err) {
                alert("Error parsing JSON: " + err.message);
            }
        };
        reader.readAsText(file);
    }
</script>
</body>
</html>
