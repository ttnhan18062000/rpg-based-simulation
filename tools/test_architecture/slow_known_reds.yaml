# Known reds of the `Slow regression` workflow (TCK-20261001-SIMQ-GRADE-ANCHORS-RED-ON-MAIN-UNREPORTED,
# "Reporting-path hardening"). Each entry: a test id pattern (fnmatch on `classname::name` from the JUnit XML),
# the ticket that owns it, the owner (session/role name), added_on and expires_on (ISO dates) and
# kind: broken|flaky. A failing test matching no entry is UNOWNED, and one matching an entry past expires_on is
# EXPIRED; both make the run red. A pattern that matches nothing failing is listed as a stale mapping.
# Re-date, fix or delete an entry deliberately: expiry exists to force that decision. Dates are the reviewer's
# proposal (2026-10-07); the owner can change them. tests/unit/tools/test_slow_regression_report.py lints this file.
# ORDER MATTERS: a test id resolves to the FIRST entry whose pattern matches it, so a narrower entry must come
