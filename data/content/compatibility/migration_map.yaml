# Machine-readable migration map: legacy-to-catalog content migration status.
# Used by: TCK-20260609-HARDCODED-GAMEPLAY-GUARD and TCK-20260609-REGISTRY-BOOTSTRAP-MODES.
#
# Schema: migration_map.v1
# Required fields per entry: legacy_id, legacy_family, catalog_family, catalog_id,
#   adapter, status, fallback_allowed
#
# Status values:
#   catalog_authoritative  - catalog record is the source of truth; legacy ID is a compat alias
#   compat_projected       - legacy ID has a known catalog equivalent; compatibility projection active
#   quarantined            - catalog covers this ID; record retained in LEGACY_FALLBACK block for
#                            debugging only (explicit opt-in mode); no new consumers allowed
#   fallback_only          - no catalog equivalent; legacy hardcoded fallback still required
#   deprecated             - scheduled for removal; no new consumers should reference this
#   removed                - already removed; entry retained for historical traceability
schema_version: "migration_map.v1"
description: >
  Tracks all known legacy IDs and their catalog migration status.
  Sources: src/core/registries.py hardcoded fallback maps,
           src/worldassembly/resolver.py REGION_MIGRATION_MAP,
           src/entities/identity_resolver.py _ROLE_COMPAT / _FACTION_COMPAT,
           data/content/compatibility/legacy_enemy_projection.yaml.

