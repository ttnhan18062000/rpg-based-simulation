# STATE: ADDITIONAL
# TCK-20260831-RACE-RELATIONS-MATRIX: race-level hostility escalation feeding
# RelationProjectionService.project_relation()'s upgrade-only race-hostility step.
#
# Disclosed coverage: 24 directed entries (12 undirected pairs), authored against the
# 66-populated-pair basis (12 races with a real entity_archetypes.yaml spawn path,
# excluding `slime` which has zero archetype entries) -- ~18% coverage, matching the
# P2D-FACTION-RELS precedent's "high-encounter-frequency, not full coverage" framing.
# Rationale: hero-race-vs-monster-race and predator/prey pairs most likely to actually
# co-populate and fight in a real scenario. The remaining 54 of 66 populated undirected
# pairs (elf/dwarf vs wolf/troll/undead/spider/dragonkin/lizardfolk, and all
# monster-vs-monster pairs) are left at neutral default (no entry) -- no evidence found of
# these pairs co-populating in any real corpus world's population recipe, and
# monster-vs-monster pairs rarely fight each other in the current scenario roster.

