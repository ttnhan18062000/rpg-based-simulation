# Terrain move costs (D72, owner ruling 2026-10-14): `move_cost_multiplier` is the readiness cost factor of one step onto the terrain, read by the movement
# legality check through src/content/terrain_cost.py. It is required: a terrain without one does not load. Forest 1.5, swamp 3.0, mountain 4.0, road 0.5,
# plain and grass 1.0 are the ruled values; cave 1.5, ruin 1.5 and river 3.0 are D33 placeholders (a river stays walkable). `snow` and `volcanic` keep the
# numbers they already declared (no world uses them, no ruling yet). The numbers declared here before D72 were never read by any code.
# Cover and high ground (designer application of D33/D56/D72, 2026-10-14): `gives_cover` and `high_ground` are required, read by the combat checks through
# src/content/terrain_cost.py. Cover: forest, mountain, ruin and cave (D33 placeholders). High ground: mountain only. Neither: plain, grass, road, swamp, river,
# snow and volcanic. Before this, the checks named upper-case WALL, FOREST, MOUNTAIN and HILL, so on lower-case catalog terrain neither ever fired.
# STATE: EXISTING-LOGIC
- id: "plain"
  display_name: "Plain"
  move_cost_multiplier: 1.0
  hazard_multiplier: 1.0
  gives_cover: false
  high_ground: false

