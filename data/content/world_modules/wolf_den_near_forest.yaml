# STATE: REDESIGNED-CORE
module_id: "wolf_den_near_forest"
module_type: "ecology"
display_name: "Wolf Den Near Forest"
description: "Animal ecology module proving contextual hostility instead of enemy-by-type."
requires: ["frontier_village_core"]
biomes: ["near_forest", "wolf_den"]
ecologies: ["wolf_den_ecology"]
regions:
  # Overlap-resolution rule (deliberate, not incidental; LOC-08, owner decision 13): wolf_den wins the
  # two regions' shared box x:[70,90], y:[30,55], declared in this module's `region_precedence` below, so its
  # terrain (flat or noise-sampled) owns every tile there and its hazard applies there. This is intentional:
  # wolf_den has the higher hazard_level (2.0 vs 1.0) and is the module's namesake region, so the overlap
  # zone should read as "den territory," not merely "near the forest." The order of these two entries no
  # longer decides it (it used to, by WorldCompiler's old last-region-wins paint rule).
  # See agent-working/stored_artifacts/TCK-20260821-WOLF-DEN-NOISE-MIGRATION/investigation.md Decision 3.
  #
  # Cross-module overlap: precedence against other modules' regions (bandit_road, goblin_camp, the
  # trading hub) is declared by each composition's `region_precedence` in world.yaml, because a module
  # cannot see the neighbours it will be composed with. Before LOC-08, near_forest/wolf_den processed last
  # (topological_sort_modules()'s alphabetical tie-break) and silently overwrote those regions' terrain
  # inside their bounds with forest/swamp noise-fill; the compositions now declare who owns those tiles.
  - id: "near_forest"
    type: "wilderness"
    grid_bounds: [45, 10, 90, 55]
    terrain: "forest"
    terrain_variants:
      - terrain: "forest"
        weight: 3.0
      - terrain: "swamp"
        weight: 1.0
    # ENV-08 (decision 30): the near edge of the wild is survivable for the people who live beside it. The integer drain
    # int(level * 10) has no nonzero step a healthy 110-HP human survives a forage visit through (see the d27 divergence), so 0.
    hazard_level: 0.0
    hazard_kind: "NATURAL_TERRAIN"
    tags: [forest]
  - id: "wolf_den"
    type: "wilderness"
    grid_bounds: [70, 30, 105, 70]
    terrain: "forest"
    terrain_variants:
      - terrain: "forest"
        weight: 3.0
      - terrain: "swamp"
        weight: 1.0
    hazard_level: 2.0
    hazard_kind: "NATURAL_TERRAIN"
    tags: [forest]
    # TCK-20260904-CAMP-CONTENT-AUTHORING-BRIDGE: NEST-kind Place, position is the
    # centroid of grid_bounds. creature_kind=wolf is in CampService.NEST_RACE_KINDS,
    # so with ENABLE_CAMP_NEST_SPREAD=ON this camp's own raid branch is replaced by
    # the Nest-spread offspring branch instead — matches this module's own
    # wild_beast_pack/wolf_pack_small theming exactly. maturity left unset, same
    # caution as every other Stage B Place in this corpus (no calibrated value yet).
    places:
      - id: "wolf_den_nest"
        kind: "nest"
        position: [87, 50]
        creature_kind: "wolf"
# LOC-08 clause 1: this module orders its own regions. wolf_den wins its overlap with near_forest.
region_precedence:
  - winner: "wolf_den"
    over: ["near_forest"]
factions: ["wild_beast_pack"]
populations: ["wolf_pack_small"]
relationships: ["town_to_wild_beasts", "wild_beasts_to_town"]
resources:
  wood_node: 8
  herb_patch: 6
  healing_flower_patch: 3
  # Wild food (Decision 29, SURV-06): forest land is the high-fertility case, charges anchored to the existing wood_node default (10).
  berry_thicket: 10
observability_tags: ["ecology", "wilderness"]
quest_definitions:
  - id: "wolf_hunt_alpha_pack"
    type: "hunt"
    required_participant_tags: ["beast"]
    required_location_tags: ["wilderness", "forest"]
    reward_budget: 120
    procedural_hints:
      difficulty: 2
      escalation: true
    tags: ["wolf", "ecology", "bounty"]
  - id: "wolf_explore_forest_trail"
    type: "explore"
    required_participant_tags: ["beast"]
    required_location_tags: ["wilderness", "forest"]
    reward_budget: 80
    procedural_hints:
      difficulty: 1
      escalation: false
    tags: ["wolf", "ecology", "exploration"]
  - id: "wolf_fetch_herb_gathering"
    type: "fetch"
    required_participant_tags: []
    required_location_tags: ["wilderness", "forest"]
    reward_budget: 80
    procedural_hints:
      difficulty: 1
      escalation: false
    tags: ["wolf", "ecology", "resource"]
