# STATE: ADDITIONAL
module_id: "moon_cult_ruins"
module_type: "conflict"
display_name: "Moon Cult Ruins"
requires: ["frontier_village_core"]
biomes: ["moon_cave"]
regions:
  - id: "moon_cave"
    type: "wilderness"
    grid_bounds: [100, 70, 130, 110]
    terrain: "cave"
    hazard_level: 4.0
    hazard_kind: "ARCANE_CORRUPTION"
    tags: [cave]
    # TCK-20260904-CAMP-CONTENT-AUTHORING-BRIDGE: LAIR-kind Place — no real corpus
    # world had one before this ticket (TCK-20260904-LAIR-ENTITY-ANCHOR's own
    # finding). Position is the centroid of grid_bounds. creature_kind is
    # CAMP/NEST-only (PlaceRecipeSpec), deliberately unset here.
    # BossService.check_for_lair_spawn() mints a real dragonkin occupant per-Place
    # once state.maturity >= 50.0 AND this region's own trauma_score >= 20.0
    # (src/world/boss.py:217-228) — a per-tick simulation condition, not a
    # compile-time guarantee. moon_cave is the corpus's best structural fit: a
    # cave at the top hazard_level (4.0), so it accrues trauma faster than any
    # lower-hazard candidate. Deliberately NOT placed in mountain_pass_zone —
    # that region is authored as intentionally place-free "pure transit terrain",
    # guarded by test_place_wiring.py::
    # test_hero_guild_routing_real_content_produces_expected_non_uniform_place_kinds.
    places:
      - id: "moon_cave_lair"
        kind: "lair"
        position: [115, 90]
factions: ["moon_cult", "arcane_circle"]
populations:
  - "moon_cult_apprentice_circle"
resources:
  moon_resin_tree: 3
  crystal_outcrop: 4
relationships: ["moon_cult_to_town"]
observability_tags: ["conflict"]
quest_definitions:
  - id: "mcult_investigate_ritual_site"
    type: "investigate"
    required_participant_tags: ["humanoid", "magic_sensitive"]
    required_location_tags: ["cave", "wilderness"]
    reward_budget: 150
    procedural_hints:
      difficulty: 3
      escalation: true
    tags: ["cult", "arcane", "mystery"]
  - id: "mcult_explore_cave_network"
    type: "explore"
    required_participant_tags: ["humanoid", "magic_sensitive"]
    required_location_tags: ["cave", "wilderness"]
    reward_budget: 120
    procedural_hints:
      difficulty: 3
      escalation: false
    tags: ["cult", "arcane", "exploration"]
  - id: "mcult_defend_arcane_circle"
    type: "defend"
    required_participant_tags: ["humanoid", "magic_sensitive"]
    required_location_tags: ["cave", "wilderness"]
    reward_budget: 200
    procedural_hints:
      difficulty: 4
      escalation: true
    tags: ["cult", "arcane", "defense"]
