# STATE: LEGACY-EXPORT
module_id: "goblin_camp_conflict"
module_type: "conflict"
display_name: "Goblin Camp Conflict"
requires: ["frontier_village_core"]
biomes: ["goblin_camp"]
ecologies: ["goblin_camp_ecology"]
regions:
  - id: "goblin_camp"
    type: "wilderness"
    grid_bounds: [95, 20, 125, 55]
    terrain: "forest"
    hazard_level: 3.0
    hazard_kind: "NATURAL_TERRAIN"
    tags: [forest]
    # Idea 66, Stage B (TCK-20260902-PLACE-MIGRATION-STAGE-B-ROLLOUT): CAMP-kind Place,
    # position is the centroid of grid_bounds. maturity left unset -- no calibrated value
    # exists yet (same caution as Stage A's scale field).
    places:
      # TCK-20260904-CAMP-CONTENT-AUTHORING-BRIDGE: creature_kind activates
      # CampService.process_camps()'s per-tick maturity/spawn/raid machinery for this
      # Place (src/worldbuilding/compiler.py:336-341 only builds a CampState when
      # creature_kind is set) — goblin matches this region's own goblin_warband
      # faction/goblin_raiding_party population, and CAMP (not NEST) per
      # CampService.NEST_RACE_KINDS, which does not include goblin.
      - id: "goblin_camp_place"
        kind: "camp"
        position: [110, 38]
        creature_kind: "goblin"
factions: ["goblin_warband"]
populations: ["goblin_raiding_party"]
relationships: ["town_to_goblin_warband", "goblin_warband_to_town"]
observability_tags: ["conflict", "faction_pressure"]
quest_definitions:
  - id: "goblin_hunt_warlord"
    type: "hunt"
    required_participant_tags: ["humanoid", "opportunistic"]
    required_location_tags: ["wilderness", "forest"]
    reward_budget: 150
    procedural_hints:
      difficulty: 3
      escalation: true
    tags: ["goblin", "conflict", "bounty"]
  - id: "goblin_fetch_stolen_goods"
    type: "fetch"
    required_participant_tags: ["humanoid", "opportunistic"]
    required_location_tags: ["wilderness", "forest"]
    reward_budget: 100
    procedural_hints:
      difficulty: 2
      escalation: false
    tags: ["goblin", "conflict", "loot"]
  - id: "goblin_defend_village_perimeter"
    type: "defend"
    required_participant_tags: ["humanoid", "opportunistic"]
    required_location_tags: ["wilderness", "forest"]
    reward_budget: 120
    procedural_hints:
      difficulty: 2
      escalation: true
    tags: ["goblin", "conflict", "defense"]
