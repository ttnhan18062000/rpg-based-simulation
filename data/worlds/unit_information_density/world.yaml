schema_version: "worldcomposition.v1"
world_id: "unit_information_density"
name: "Unit Test — Information Event Density"
description: "Unit-tier isolation world for the INFORMATION pillar, complementary to unit_information_source. That world deliberately seeds exactly one information_source_profiles/pending_information_responses pair as a pure isolation probe (minimal, event-starved by design, per TCK-20260704-SIMQ-CORPUS-UNIT-WORLDS-FACTION-INFO). This world instead seeds 3 pending_information_responses entries (one per hero_adventurers population slot, pop_0/pop_1/pop_2) against the same shared information_source_profiles entry, to probe INFORMATION event *density* rather than mere presence — TCK-20260713-SIMQ-SCORE-CEILING-FIX found the pillar's positive weight scale cannot reach grade A on any single-event corpus scenario without a per-event weight so large it would dominate the pillar (a discriminative-power problem in its own right), so this world supplies the additional real event density the fix's modest weight raise needs to reach A on a genuine, reproducible scenario. Composes frontier_village_core + hero_adventurers (byte-for-byte unit_information_source's module pair). faction_tension_overrides stays at catalog default and pending_self_model_information_events stays empty — every other Pattern-6 field stays baseline so this isolates INFORMATION alone."
modules:
  - "frontier_village_core"
  - "hero_adventurers"
generation_seed: 503
information_source_profiles:
  - source_id: "town_notice_board"
    source_kind: "guide"
    knowledge_scopes: ["regional_danger", "common_resource_sources"]
    accuracy: 0.4
    freshness: 0.6
    bias: 0.1
    cost_gold: 0
    max_answers_per_query: 2
pending_information_responses:
  - target_population_id: "pop_0"
    subject: "hometown_danger"
    query_kind: "danger_rating"
    source_id: "town_notice_board"
    answer_kind: "KNOWN_FACT"
    certainty: 0.8
    details:
      danger_level: "low"
      region: "hometown"
    cost_paid: 0
  - target_population_id: "pop_1"
    subject: "trade_route_resources"
    query_kind: "material_source"
    source_id: "town_notice_board"
    answer_kind: "KNOWN_FACT"
    certainty: 0.8
    details:
      resource: "timber"
      region: "hometown"
    cost_paid: 0
  - target_population_id: "pop_2"
    subject: "border_patrol_danger"
    query_kind: "danger_rating"
    source_id: "town_notice_board"
    answer_kind: "KNOWN_FACT"
    certainty: 0.8
    details:
      danger_level: "moderate"
      region: "hometown"
    cost_paid: 0
