schema_version: worldspec.v1
world_id: hero_guild_routing
name: Hero Guild Routing
description: 'Real-scale routing-capable archetype: a hero guild''s home settlement
  dispatches adventuring parties across three competing destinations — a mountain
  pass, a goblin camp, and haunted ruins — choosing between routes rather than following
  one linear path. Adventuring and route-selection are the world''s central framing,
  not an incidental settlement feature — distinct from urban_political''s settlement/
  trade-pressure framing and dungeon_crawl''s pure dungeon-exploration framing. ENABLE_ADVENTURE_ROUTING
  is ON by design from this world''s first compile (see config/simulation_quality/profiles/hero_guild_routing.yaml).

  '
