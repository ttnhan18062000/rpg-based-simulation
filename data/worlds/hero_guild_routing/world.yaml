schema_version: "worldcomposition.v1"
world_id: "hero_guild_routing"
name: "Hero Guild Routing"
description: >
  Real-scale routing-capable archetype: a hero guild's home settlement dispatches
  adventuring parties across three competing destinations — a mountain pass, a goblin
  camp, and haunted ruins — choosing between routes rather than following one linear
  path. Adventuring and route-selection are the world's central framing, not an
  incidental settlement feature — distinct from urban_political's settlement/
  trade-pressure framing and dungeon_crawl's pure dungeon-exploration framing.
  ENABLE_ADVENTURE_ROUTING is ON by design from this world's first compile (see
  config/simulation_quality/profiles/hero_guild_routing.yaml).
provided_features:
  - "settlement"
  - "hero_presence"
  - "mountain_traversal"
  - "conflict"
  - "dungeon"
  - "quest_seeding"
  - "adventure_routing"
module_refs:
  - module_id: "frontier_village_core"
    order: 0
  - module_id: "hero_adventurers"
    order: 1
  - module_id: "mountain_pass"
    order: 2
  - module_id: "ruins_mystery_quest"
    order: 3
  - module_id: "goblin_camp_conflict"
    order: 4
generation_seed: 717

# LOC-08 (owner decision 13): authored precedence where region bounds overlap; winner first. The resolved region
# list order is the precedence order every consumer reads. Cross-module pairs are declared here, at composition
# level, because the same bare region id names different bounds in different worlds; a module declares its own
# internal pairs. Undeclared nested regions resolve contained-wins; other undeclared overlaps fall back to
# resolved declaration order and are reported as advisories.
region_precedence:
  - winner: "haunted_battlefield"
    over: ["mountain_pass_zone"]
