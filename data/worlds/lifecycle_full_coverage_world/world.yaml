# TCK-20260808-LIFECYCLE-FULL-COVERAGE-WORLD
schema_version: "worldcomposition.v1"
world_id: "lifecycle_full_coverage_world"
name: "Lifecycle Full-Coverage World"
description: >
  Stress-tier world authored to fill a named scale-diversity gap: no world in the corpus
  structurally exercises all reachable entity_lifecycle_score.py lifecycle_phase_buckets at once.
  Composes 8 proven-compatible modules (hero_guild_routing's own 5-module base plus
  simq_scale_stress_seed42's hostile-module additions) with ENABLE_ADVENTURE_ROUTING,
  ENABLE_SOCIAL_COOPERATION, ENABLE_BELIEF_ASSIMILATION, and ENABLE_GUILD_QUEST_GENERATION all ON.
  IDENTITY (entity_role_changed/entity_faction_changed) is confirmed unreachable by any content
  (no producer exists anywhere in src/) -- this world's own honest phase_coverage ceiling is
  9/10, not 10/10.
