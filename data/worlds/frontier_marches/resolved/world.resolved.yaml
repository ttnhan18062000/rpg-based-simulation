schema_version: worldspec.v1
world_id: frontier_marches
name: Frontier Marches
description: A sprawling borderland where a frontier village, a hero guild, a wolf-infested
  forest, a goblin war-camp, a bandit-held road, an orc stronghold, a haunted battlefield,
  a sunken swamp, and an old mine all sit within reach of one another — comparable
  in scale to frontier_extended, but authored with FACTION tension and INFORMATION
  content from its very first compile rather than retrofitted after anchoring.
