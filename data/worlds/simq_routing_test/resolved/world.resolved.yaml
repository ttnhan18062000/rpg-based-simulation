schema_version: worldspec.v1
world_id: simq_routing_test
name: SimQ Routing Test
description: 'Minimal world for SimQ 10-pillar calibration. Combines a frontier village
  (economy, social, information, faction), an old mine (extra resource nodes and faction
  pressure), a goblin conflict (combat, faction diplomacy), and hero adventurers (agency,
  progression). ENABLE_ADVENTURE_ROUTING must be ON for route_selected / action_executed
  events.

  '
