    count: 15
    faction: villagers
    spawn_region: town_center
  - role: monster
    count: 5
    faction: monsters
    spawn_distribution:
      type: region_random
      region: woods
  - role: hero
    count: 3
    faction: villagers
    spawn_region: town_center
resources:
- resource_type: wood
  count: 10
