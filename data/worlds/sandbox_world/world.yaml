  type: town
  grid_bounds:
  - 10
  - 10
  - 40
  - 40
  terrain: GRASS
  hazard_level: 0.0
- id: woods
  type: wilderness
  grid_bounds:
  - 50
  - 50
  - 110
  - 110
  terrain: FOREST
  hazard_level: 1.5
factions:
- id: villagers
  type: civilian
- id: monsters
  type: hostile
