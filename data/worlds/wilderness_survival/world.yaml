# LOC-08 (owner decision 13): authored precedence where region bounds overlap; winner first. The resolved region
# list order is the precedence order every consumer reads. Cross-module pairs are declared here, at composition
# level, because the same bare region id names different bounds in different worlds; a module declares its own
# internal pairs. Undeclared nested regions resolve contained-wins; other undeclared overlaps fall back to
# resolved declaration order and are reported as advisories.
region_precedence:
  - winner: "survivor_outpost"
    over: ["near_forest"]
