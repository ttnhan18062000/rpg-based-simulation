# Docker Compose configuration for production-grade stack
services:
  backend:
    build: 
      context: .
      dockerfile: backend.Dockerfile
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    restart: unless-stopped
    environment:
      - REDIS_URL=redis://redis:6379/0
    volumes:
      # Optional: mount data directory for persistent game state / config changes
      - ./data:/app/data
    depends_on:
      - redis
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    restart: unless-stopped
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  ai_worker:
    build:
      context: .
      dockerfile: backend.Dockerfile
    # Override FastAPI command to run the V2 live anomaly worker
    command: python -m src.observability.anomaly.worker
    environment:
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      redis:
        condition: service_started
    restart: unless-stopped
    # Use deploy block to easily scale workers: docker compose up --scale ai_worker=3
    deploy:
      replicas: 1

  frontend:
    build:
      context: .
      dockerfile: frontend.Dockerfile
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      - backend
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.50.0
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 5s
      timeout: 5s
      retries: 5
    depends_on:
      - backend

  grafana:
    image: grafana/grafana:10.3.3
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/etc/grafana/dashboards
    restart: unless-stopped
    depends_on:
      - prometheus

  loki:
    image: grafana/loki:3.0.0
    ports:
      - "${LOKI_PORT:-3100}:3100"
    command: -config.file=/etc/loki/local-config.yaml
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3100/ready"]
      interval: 5s
      timeout: 5s
      retries: 5

  promtail:
    image: grafana/promtail:3.0.0
    volumes:
      - ./promtail-config.yml:/etc/promtail/config.yml
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock
    command: -config.file=/etc/promtail/config.yml
    restart: unless-stopped
    depends_on:
      - loki

  watchdog:
    build:
      context: .
      dockerfile: backend.Dockerfile
    command: python -m src.observability.watchdog
    environment:
      - BACKEND_URL=http://backend:8000
      - LOKI_URL=http://loki:3100
      - POLL_INTERVAL=10
      - LOG_LEVEL=INFO
      - SIM_ALERTS_WEBHOOK_URL=${SIM_ALERTS_WEBHOOK_URL:-}
      - SIM_ALERTS_WEBHOOK_ENABLED=${SIM_ALERTS_WEBHOOK_ENABLED:-false}
    depends_on:
      - backend
      - loki
      - prometheus
    restart: unless-stopped

volumes:
  prometheus_data:
  grafana_data:
  redis_data:
