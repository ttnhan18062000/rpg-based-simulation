# Normalizes exactly the two hook types actually wired in .claude/settings.json today. No
# speculative SessionStart/Stop/other hook type — this file documents the real, current
# vocabulary only.
hook_schema_version: 1
hook_types:
  - id: PreToolUse
    description: Fired before a tool call executes.
  - id: PostToolUse
    description: Fired after a tool call completes; feeds tools.jsonl writes.
