# One entry per .claude/skills/*/SKILL.md directory. Distinct vocabulary axis from roles/*.yaml
# (reusable skills vs. delegated subagent roles) — see test_skills_yaml_does_not_duplicate_role_fields.
# `workflows`/`roles` only reference ids that actually exist elsewhere in this contract today
# (workflows/implement-ticket.yaml, roles/*.yaml); left empty where the corresponding
# workflows/<name>.yaml file has not been built yet in this first vertical slice.
# `companion_assets` is a curated per-skill allowlist of non-SKILL.md files (relative to the
# skill's own .claude/skills/<id>/ directory) that the Codex adapter also copies into
# .agents/skills/<id>/ — not derived from directory listing or from SKILL.md's own references.
