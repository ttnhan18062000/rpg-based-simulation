# Settings for tools/sessions/project_sync.py (TCK-20261112-PROJECT-SYNC-DRY-RUN): the GitHub Project as a generated,
# read-only view of ticket state. Design: .claude/handover/drafts/github-project-ticket-view-2026-11-12.md.
# No field ids live here: the sync looks fields up by name on every run (P1).
project:
  owner: rpg-sim-lab   # an organization (the repo moved to the org); P1b creates the Project under it
  number: 1            # the Project number (github.com/orgs/rpg-sim-lab/projects/1, owner #715 6873428846)
pilot_lanes: [rpg]     # a ticket qualifies when found on a worktree whose domain (or branch prefix) is one of these
pilot_start: 2026-11-12  # a Done item is created only when the ticket reached done/ on origin/main on or after this date
done_window_days: 14   # a Done item is archived this many days after the ticket reached done/
stale_host_hours: 24   # a host whose last run is older than this is flagged in the output
stale_branch_days: 14  # a ticket whose working branches are all older than this (newest commit or index change) shows Stale, not In progress
host_names:            # hostname -> the short host tag used in Branch/Host entries; an unlisted hostname is used as is
  u24desktop-Virtual-Machine: u24desktop
  ubuntu: ubuntu
