# Mechanism Registry — the single hand-authored source for what simulation mechanisms exist,
# which layer each belongs to, and what each depends on.
#
# UNLIKE THIS DIRECTORY'S OTHER FOUR REGISTRIES (layer_registry.jsonl, tag_registry.jsonl,
# tag_category_registry.jsonl, capability_envelope_registry.jsonl), this one is NOT append-only.
# Those four are allowlists cited by id from tickets/docs, so a value can never be renamed or
# removed once added. This file records mechanism STATE (done/partial/gap/orphan/gated/skeleton),
# which is a live fact about the codebase, not an allowlist entry -- correcting a wrong state in
# place (with a `verified` block explaining the correction) is expected, ordinary maintenance, not
# a violation of anything this directory's own convention implies. It is also the only YAML file
# here (the other four are JSONL) since its own schema -- nested `depends_on`/`verified` blocks --
# doesn't fit a flat per-line record.
#
# TCK-20260915-MECHANISM-REGISTRY-FOUNDATION (child of TCK-20260915-EPIC-MECHANISM-REGISTRY).
# Moved from docs/brainstorm/mechanisms.yaml to registries/mechanisms.yaml by
# TCK-20260917-MECHANISM-REGISTRY-RELOCATION -- `docs/brainstorm/` implies "not officially applied
# yet," which is exactly backwards for CI-enforced, six-invariant-validated data; rendered views
# (mechanism_registry_view.md, mechanism_verification_view.md, mechanism_priority_view.md,
# mechanism_registry.html) stay in docs/brainstorm/ alongside their actual peers (the atlas,
# capabilities page, wiring map) -- this file is the one thing in that split that is source of
# truth, not a rendering.
# See docs/plans/mechanism_registry_initiative.md for the full design rationale and
# staging_artifacts/TCK-20260915-MECHANISM-REGISTRY-FOUNDATION/investigation.md for the full
# per-mechanism citation/provenance trail (source doc, atlas/wiring-map card index, every judgment
# call made while deriving this list).
#
# Source corpus, as of 2026-09-16: docs/brainstorm/rpg_feature_atlas.html (primary — 71 of this
# file's 75 mechanisms cite an atlas JSON card, `id="card-sections-data"`) and
# docs/brainstorm/rpg_simulation_wiring_map.html (secondary — supplies `nest`/`lair`, which have no
# atlas JSON card, plus dependency-arrow evidence and layer-assignment cross-checks for others).
#
# THREE AXES, kept deliberately distinct — do not conflate when hand-editing `depends_on`:
#   1. CONTAINMENT (the wiring map's own Layer Model lanes, e.g. "Faction contains Entities") —
#      not represented in this file at all; containment is not dependency.
#   2. EXECUTION ORDER (the wiring map's own mermaid sequence arrows within one tick, e.g.
#      "Perceive --> Self-Model") — also not `depends_on`. Most wiring-map arrows encode this axis,
#      not the third one below, which is why `depends_on` below is deliberately sparse (~25 of 75
#      rows) rather than populated from every visible arrow.
#   3. FUNCTIONAL DEPENDENCY (`depends_on` below) — "this mechanism cannot produce a meaningful
#      result without that one already existing/having run." Hand-author only real edges backed by
#      a defensible "consumes this mechanism's output/state" reading. Do not guess, and do not
#      convert a wiring-map sequence arrow into `depends_on` just because one exists.
#
# `depends_on` is the ONLY hand-authored edge — dependent-count is computed by traversal, never
# stored here (a stored count and a hand-authored edge list disagree within a month; the stored one
# is the one people read).
#
# `implemented_by` (optional, list of repo-relative paths) is the real code binding
# (TCK-20260916-MECHANISM-IMPLEMENTED-BY-BINDING) -- the RimWorld-Def-style pattern where every
# Def corresponds to a real class. The original 75 mechanisms below cite atlas cards / wiring-map
# node names only, never source; that citation gap is why the atlas's own drift (17% wiring-map
# error, 2 stale badges, the `camp` seeding error, `motivation_doctrine` reading "confirmed live"
# for 8 days after its own code was deleted) went uncaught. `mechanism_registry.py::validate()`
# checks every `implemented_by` path exists on disk, so a deleted implementing module fails
# validation the day it's deleted. NOT backfilled for all mechanisms at once -- it grows organically
# as tickets touch each mechanism, per `tools/mechanism_registry/mechanism_registry_completeness_check.py`'s own
# "N of 86 have no implemented_by" gap report.
#
# Frequency lives ONLY on layers, never on a mechanism.
#
# `rank` is an ORDINAL (position from the bottom, 1=lowest/most-frequent layer, 5=highest/rarest) --
# it does NOT mean "priority multiplier." `weight` is the explicit, independently-settable field for
# that (TCK-20260916-MECHANISM-PRIORITY-LAYER-WEIGHT-INVERTED): priority() multiplies by `weight`,
# never by `rank`. These two fields deliberately mirror each other across the 5 current layers
# (weight = 6 - rank) but are NOT defined in terms of one another in code -- a future layer addition
# must set both explicitly, so the direction can never again be silently re-derived wrong the way it
# was the first time (priority = rank * dependents rewarded the rarest layers, the exact opposite of
# "lower layers first... more frequency is more priority").
#
# `state` is one of exactly six classes, matching the atlas's own existing vocabulary (no seventh
# invented): done | partial | gap | orphan | gated | skeleton.
#
# `verified` (nullable — TCK-20260915-MECHANISM-VERIFICATION-AXIS) records whether a mechanism
# has been *observed working*, not just built. Absent or explicit `null` is the ONLY way to
# represent "unverified" — when present, all 4 sub-fields are required and `instrument` is never
# itself null inside a present block:
#   verified:
#     instrument: scenario   # census | scenario | corpus_run | code_trace
#     verdict: observed      # observed | contradicted | inconclusive
#     date: "2026-09-16"
#     note: "one line, what was actually seen"
#
# STATIC vs RUNTIME evidence, kept explicitly distinct — the single most expensive lesson of this
# whole arc: combat judgement passed a code trace cleanly (real code, reachable, called — all true,
# all confirmable statically) and was write-only across four conditions; only a runtime instrument
# (a real 1960->837 corpus measurement) caught that. `code_trace` proves what the code *says*
# (this is called, this field is never populated, this has zero callers) — it can NEVER establish
# that reachable code has its claimed runtime effect. `census`/`scenario`/`corpus_run` are runtime
# evidence — they prove what the simulation actually *does*. A `code_trace`/`observed` row must
# never be read as equally strong as a runtime-confirmed one; the verification view groups them
# separately for exactly this reason, not merged into one undifferentiated list.
#
# `verdict` and `state` are separate fields answering different questions and compose rather than
# collapse: `state` says whether the mechanism is built/reachable; `verified.verdict` says whether
# the evidence matches that claim. A `code_trace` confirming an already-`orphan` mechanism really
# doesn't fire is `verdict: observed` (the state's own claim confirmed true), not `contradicted` —
# `contradicted` is reserved for the historically expensive case: `state: done` with a *runtime*
# instrument finding the claimed behavior doesn't actually happen.
#
# For how this file's state/verified axes relate to the compass's §10 runtime-status vocabulary
# and the control plane's Rule realization vocabulary, see docs/plans/status_axis_model.md.
#
# Validate with: make mechanism-registry-validate  (tools/mechanism_registry/registry.py)
# Render the verification view with: make mechanism-verification-view
#
# KNOWN PLACEHOLDER: `race_collective_force` and `settlement_capacity_axis` are assigned
# `layer: faction` as the nearest organizational tier a real implementation would likely live in —
# this is a guess, not a citation-backed placement (see investigation.md Judgment Call 8 / Risk 2).
# A future layer-design ticket should be able to find this flagged here, not discover it was
# silently decided.

layers:
  entity:  { cadence: per_tick, rank: 1, weight: 5 }
  group:   { cadence: per_tick, rank: 2, weight: 4 }
  faction: { cadence: daily,    rank: 3, weight: 3 }
  region:  { cadence: slow,     rank: 4, weight: 2 }
  world:   { cadence: rare,     rank: 5, weight: 1 }

mechanisms:

  # ── Entity layer — Action (9, atlas `entity-action`) ──────────────────────────────────────

  - id: combat_resolution
    layer: entity
    systems: [combat]
    depends_on: [movement, status_effects, entity_role]
    state: done
    implemented_by: [src/engine/combat.py::CombatResolutionSystem]
    verified:
      instrument: scenario
      verdict: observed
      date: "2026-09-19"
      note: >-
        Real reachability split by edge, not just a single "is this reached" answer.
        `CombatResolutionSystem.resolve_attack()` (reached via `tactical_decision` ->
        `ActionRouter.execute_action()`) had 0-2 real calls per 1000-2000 ticks across
        `crowded_frontier`/`quest_dense_frontier`/`hero_guild_routing`.
        `resolve_multi_attack()` (reached via `movement`'s own opportunity-attack mechanic,
        `src/engine/movement.py`, never through `tactical_decision`/`ActionRouter` at all) had
        181-2177 real calls per 1000 ticks in the same worlds. Found while resolving
        TCK-20260915-CROSS-FACTION-COMBAT-RARITY-INVESTIGATION's own 7th candidate.
        **`depends_on: [tactical_decision]` removed 2026-09-17**
        (`TCK-20260917-MECHANISM-IDENTITY-RULES-AND-CHANGE-TAXONOMY`): checked against this
        registry's own stated definition (`registries/mechanisms.yaml`'s own header, "this
        mechanism cannot produce a meaningful result without that one already existing/having
        run") -- `resolve_attack()`/`resolve_multi_attack()` compute a real, meaningful outcome
        given any attacker/defender pairing regardless of how that pairing was decided;
        `combat_resolution` does not require `tactical_decision`'s own output to already exist.
        `tactical_decision` is a real *caller* of `combat_resolution` (execution order), not a
        functional prerequisite for it -- exactly the conflation the header's own closing line
        warns against. `movement` is kept: combat resolution reads position/range state that
        `movement`'s own domain establishes, a genuine functional dependency, even though
        `movement.py` is what calls `combat_resolution` in code (call direction and `depends_on`
        direction diverge here by design, not by error). See
        docs/plans/mechanism_identity_and_change_taxonomy.md §3 for the full reasoning. Multiple
        entry points into the same internal logic (this entry's own two-caller finding above) is
        not itself a split signal -- see that same doc's §1.
        **2026-09-19 update (`TCK-20260919-COMBAT-ENGAGED-HOSTILES-UNIFY-CATALOG-SEMANTICS`):**
        the 181-2177 `resolve_multi_attack()` figure above was measured against the pre-fix
        `LegalityServiceV2.get_engaged_hostiles_at_pos()`, which determined hostility from the
        raw legacy `Faction` enum rather than the real content catalog -- substantially phantom
        combat, per `TCK-20260919-COMBAT-HOSTILITY-SOURCE-DIVERGENCE-UNIFICATION`'s own
        measurement (97% of `hero_guild_routing`'s legacy-triggered engagements were not real
        catalog hostility). After the fix, real, catalog-correct `resolve_multi_attack()` volume
        over the same 2000-tick runs: `crowded_frontier` 874 -> 133 (-84.8%), `hero_guild_routing`
        1418 -> 58 (-95.9%), `quest_dense_frontier` 0 -> 0 (unchanged, already zero). The large
        drop is the fix working as intended -- combat volume in these worlds was substantially not
        the game's own authored hostility model -- not a regression.
        **Value-differential added 2026-09-21, instrument upgraded corpus_run -> scenario**
        (TCK-20260921-MECHANISM-COMBAT-VALUE-DIFFERENTIAL-INSTRUMENT, narrow re-scope: one direct
        question rather than a full 8-mechanism sweep, per peer instruction, motivated by
        `TCK-20260921-STATS-DIRTY-RECALC-DISCARDS-SPECIES-BASE-STATS`'s own open question).
        `tests/mechanic_scenarios/test_combat_resolution_damage_value_differential.py` confirms
        `calculate_damage()`'s own formula responds exactly to `combat.atk`/`combat.def_stat`
        (positive control) and ignores `identity.evolution_level` (negative control, already
        proven irrelevant to combat resolution in the progression program).
        `tests/mechanic_scenarios/test_combat_attributes_real_fight_outcome_value_differential.py`
        answers the narrow question directly: within a real, dispatched fight, a real strength
        difference (5 -> 20, via the real `LevelingService.recalculate_combat_stats()` derivation,
        called directly rather than staged same-tick -- the real apply-path sequencing recalculates
        derived stats only at the end of the tick that changed them, so a same-tick change-then-
        attack test would use the OLD atk and risk a vacuous negative arm) deals measurably more
        real damage; `charisma` (confirmed unread by the derivation function) does not move the
        outcome at all. Neither function contains an RNG call -- confirmed by direct code trace
        before staging anything, then confirmed empirically. **Answer: yes, an entity's own combat
        attributes have real, formula-exact purchase on how a fight resolves** -- which means
        `TCK-20260921-STATS-DIRTY-RECALC-DISCARDS-SPECIES-BASE-STATS`'s own species-base-stat
        erosion is destroying something demonstrably real, not a cosmetic drift.
  - id: tactical_decision
    layer: entity
    systems: [combat]
    depends_on: []
    state: done
    implemented_by: [src/engine/tactical.py::TacticalDecisionSystem]
    verified:
      instrument: corpus_run
      verdict: contradicted
      date: "2026-09-19"
      note: >-
        The `ATTACK`-intent branch (the decision this mechanism exists to make) is effectively
        dormant in real corpus play: 0-2 real `CombatResolutionSystem.resolve_attack()` calls per
        1000-2000 ticks across `crowded_frontier`, `quest_dense_frontier`, and
        `hero_guild_routing` -- independently corroborated three separate times, for three
        unrelated reasons, across six weeks (TCK-20260808-LIFE-ARC-REBIRTH-REACHABILITY-
        INVESTIGATION, 2026-08; TCK-20260915-CROSS-FACTION-COMBAT-RARITY-INVESTIGATION's own
        candidate 5, 2026-09-15). state stays `done` -- no evidence the decision logic itself is
        wrong, only that it essentially never selects ATTACK in these worlds' real play.
        **Root-caused 2026-09-19** (`TCK-20260917-TACTICAL-ATTACK-PATH-NEVER-FIRES-INVESTIGATION`,
        real `Kernel.tick_once()` instrumentation, `LocalSequentialExecutor` forced to avoid the
        real concurrency this arc's own prior addendum found unsafe for a shared-mutable-state
        probe): two compounding, independently-measured causes, not one. (1) The strategic layer
        essentially never assigns a `DEFEAT_ENEMY` objective in these worlds' sampled windows (0
        occurrences across 3 corpus worlds, 2 sample points each) -- entities have nothing telling
        them to fight regardless of what's nearby. (2) Even when the brain does run -- itself
        suppressed 6-25x below the raw strategic-intelligence cadence ceiling by a three-layer
        sticky-task/cadence gate stack in `scheduler.py`/`cognition.py`, larger than the
        previously-cited 93.7% figure -- `hostiles` was found non-empty **0 of 1130** real calls
        across the three corpus worlds. On the rare occasion a fresh decision does happen (2 of
        1130 calls, both worlds), it reliably dispatches -- one decision produced 2 and 29 real
        `execute_attack()` calls respectively via the same sticky-task re-execution mechanism, so
        there is no emission-vs-dispatch defect, only rarity of the initial decision.
        `metropolis`, the intended control, proved unreliable for this specific investigation: its
        own `build_metropolis_state()` perf-harness has real spawn collisions (confirmed via
        direct construction-time hard-law-violation logging) that make its entities' default task
        state unrepresentative of curated world content -- disclosed as a limitation, not chased
        to a separate root cause (out of this investigation's own scope). Whether the decision path
        firing more often is desirable is a **design** question for the user, unresolved here per
        this investigation's own Assumption #2 -- what this closes is the mechanism, not the
        disposition. See `combat_resolution` and `combat_engagement` for the rest of this same
        finding, and `stored_artifacts/TCK-20260917-TACTICAL-ATTACK-PATH-NEVER-FIRES-INVESTIGATION/`
        for the full per-world evidence table.
        **Scope note, added 2026-09-20 (TCK-20260920-MECHANISM-COGNITION-DIFFERENTIAL-RUNTIME-
        VERIFICATION), made explicit per peer review rather than left as an unrecorded reasoning
        step**: `TacticalDecisionSystem` (`src/engine/tactical.py`) is the only `implemented_by`
        binding here, but its real targeting logic also calls a second, real, currently-unregistered
        component, `src/world/perception/gate.py::PerceptionGate` (`tactical.py:181,199`,
        `_gate.can_perceive(...)`), which gates raw sense-profile detection (vision/hearing/smell/
        etc. against a target's emitted signals) before a target is even considered for a decision.
        This is deliberately NOT added to `implemented_by` above and NOT registered as its own
        mechanism -- `PerceptionGate` is real, live, and load-bearing, but its own scope (raw
        detection capability, upstream of any decision) is narrower than `tactical_decision`'s own
        concept (which decision to make once a target is already knowable), so folding it into this
        binding would misattribute a distinct concern rather than merely omit a citation. Recorded
        here explicitly so the reasoning survives -- an un-registered dependency that "everyone
        knows" is implicitly covered is exactly the kind of knowledge that decays. Not the same
        finding as `perception`'s own dormancy (a different, unrelated component under a similar
        directory name) -- see that entry's own note.
  - id: combat_engagement
    layer: entity
    systems: [combat]
    depends_on: [personality]
    state: done
    implemented_by: [src/domains/combat_engagement/service.py::CombatEngagementDecisionService]
    verified:
      instrument: scenario
      verdict: observed
      date: "2026-09-16"
      note: >-
        Corpus: posture gate moved attacks 1960 -> 837. Scenario: risk-rejected posture -> 0
        attacks vs no posture -> attack proceeds, all else identical.
        **World-specificity, added 2026-09-17**: the "1960 -> 837" figure is the `metropolis`
        synthetic reference scenario specifically, the one world class where the decision-driven
        `ATTACK` path this gate governs actually fires. In `crowded_frontier`,
        `quest_dense_frontier`, and `hero_guild_routing`, that same path sees 0-2 real calls per
        1000-2000 ticks regardless of this gate's state -- the gate has no measurable effect there,
        not because it's weak, but because the path it governs is already dormant (see
        `tactical_decision`). A verdict proves the mechanism works under the conditions measured;
        this one was never a general claim about the simulation, and is corrected here to say so
        explicitly rather than leaving "1960 -> 837" to be read as one.
        **Card-desc addendum, 2026-09-23 (TCK-20260916-ATLAS-CARD-DESCRIPTION-EFFECT-CAVEAT-AUDIT)**:
        this card's own desc text carries a 2026-09-15 self-correction ("nothing downstream ever
        acts on the result... does not reproduce on current code, should be read as historical, not
        current") that is now itself stale -- confirmed by direct code read that this "1960 -> 837"
        figure's real mechanism is `action_router.py`'s per-attack risk gate
        (`src/engine/domain/action_router.py:74-98`, `_RISK_ACCEPTED_POSTURES` check against
        `entity.identity.properties["last_combat_posture"]`), added by the already-closed
        `TCK-20260915-COMBAT-ENGAGEMENT-POSTURE-NEVER-WIRED-TO-EXECUTION` -- same day as, but after,
        the desc's own "nothing consumes this" correction. `PostureIntentResolver.resolve()`'s own
        `intent`/`strat` output is still discarded (`EntityUpdate.intent_results` stays
        hardcoded `[]` in `combat_engagement/phase.py`) -- that specific claim in the desc remains
        true -- but the desc's broader "posture selection has no real effect" framing is false as of
        that fix: the property-keyed gate is a second, separate, real consumer, and this verified
        block's own "1960 -> 837" figure already reflects it. Card desc corrected to cite this
        instead of reading as an open, unresolved contradiction between its own two paragraphs.
  - id: movement
    layer: entity
    systems: [combat, world]
    depends_on: []
    state: done
    implemented_by: [src/engine/movement.py::MovementSystem]
    verified:
      instrument: code_trace
      verdict: observed
      date: "2026-09-20"
      note: >-
        TCK-20260920-MECHANISM-BOUND-UNVERIFIED-INSTRUMENT-RUN (batch 3 of the unbound-claims
        program: verification runs against 20 mechanisms already bound but never given a
        `verified` block). `MovementSystem.resolve_move()` confirmed real, non-test caller at
        `src/engine/pipeline_phases/movement.py:286` and `src/engine/domain/movement_actions.py:27`.
        No contradiction from `mechanism_state_caller_check.py`'s own full-registry run.
  # SPLIT 2026-09-17 (TCK-20260917-MECHANISM-IDENTITY-RULES-AND-CHANGE-TAXONOMY, the falsification
  # test for the identity rule -- "if the rule doesn't split this, the rule is wrong"): this entry
  # used to be action_pacing_readiness covering both the readiness gate and the agility-scaling
  # recalculation under one verdict. Split into the gate (kept under this id, now `done`) and
  # `readiness_speed_scaling` (new, `partial`) below. See
  # docs/plans/mechanism_identity_and_change_taxonomy.md §4-5 for the full reasoning.
  - id: action_pacing_readiness
    layer: entity
    systems: [combat]
    depends_on: []
    state: done
    implemented_by:
      - src/engine/legality.py::LegalityServiceV2::verify_readiness
    verified:
      instrument: scenario
      verdict: observed
      date: "2026-09-16"
      note: >-
        Differential scenario (tests/mechanic_scenarios/test_action_pacing_readiness_gate.py):
        readiness=50.0 withholds a staged attack (INSUFFICIENT_READINESS), readiness=100.0 lets it
        proceed, through a real Kernel tick against a real compiled world. The gate itself -- what
        all transitive dependents actually need -- genuinely works.
        **Split 2026-09-17**: this entry previously also covered the separate agility-scaling
        recalculation under state `partial`; that half is now its own entry, `readiness_speed_scaling`,
        since the two halves diverge in real-world outcome (this gate confirmed working;
        the scaling half confirmed starved) and bundling them under one verdict buried the
        distinction in prose. This entry is now scoped to the gate only, `state: done` (no known
        deficiency in the gate itself).
        **Bound 2026-09-20** (TCK-20260920-MECHANISM-ENTITY-LAYER-UNBOUND-CLAIMS-RESOLUTION):
        `LegalityServiceV2.verify_readiness()` is a real, wired caller-confirmed method (called from
