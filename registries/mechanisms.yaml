        a real `StrategicUpdate` proposed by an EARLIER phase this same tick --
        `capacity_enforcement.py`'s own `if not ent_upd or not ent_upd.strategic: continue` skips
        an entity with nothing else proposed for it, even one genuinely over cap in raw state) kept
        it falling through 4 waves without ever getting a disposition recorded. Resolved by
        chaining two already-validated real mechanisms rather than forcing a route: a stale lead
        (`discovered_tick=0`, `state.tick=50`) produces a real, non-empty update via
        `belief_cycle`'s own already-verified staleness-decay phase
        (`belief_staleness_decay`, runs before `capacity_enforcement` in the same tick), giving
        `enforce()` a genuine `ent_upd.strategic` to evaluate
        (`tests/mechanic_scenarios/test_cognition_capacity_fatigue_lead_trim.py`). 9 real leads
        (over `max_leads=8`, the compiled default): the lowest-scored survivor (the stale lead,
        decayed to `VAGUE`) is trimmed by `CapacityService.trim_dict()` through a real
        `Kernel.tick_once()`, leaving exactly the 8 higher-scored keepers. 8 real leads (at, not
        over, the cap): nothing is trimmed. Reach confirmed directly for the negative arm (§5 item
        5): the stale lead's own certainty is checked as `VAGUE` in both conditions, proving
        `belief_staleness_decay` genuinely ran in the at-cap case too -- "nothing trimmed" is a
        reached-and-declined result, not the entity being skipped before ever being considered.
        **The precondition this verdict is conditional on, stated explicitly per peer review --
        read from the simulation's side, not just the scenario's own staging need**: enforcement
        only evaluates an entity that ALREADY has a real `StrategicUpdate` proposed by some OTHER
        phase that same tick (`capacity_enforcement.py`'s own `if not ent_upd or not
        ent_upd.strategic: continue`). An entity genuinely over its own cognitive cap, with nothing
        else proposing anything for it that tick, is silently skipped rather than trimmed -- it
        stays over cap indefinitely, not just for one tick. This verdict is `observed` for "does
        enforcement correctly trim when it runs," not for "does an over-cap entity always get
        enforced" -- those are different claims, and only the first is what this scenario (or any
        scenario built the same way) can show. Whether piggybacking on another phase's own update
        is the INTENDED design (opportunistic enforcement) or a real gap (should be unconditional)
        is a design question, not settled here -- see
