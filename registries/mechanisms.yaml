        **Value-differential added 2026-09-21** (TCK-20260921-MECHANISM-PROGRESSION-VALUE-
        DIFFERENTIAL-INSTRUMENT, new axis distinct from the reachability instrumentation above):
        `tests/mechanic_scenarios/test_readiness_and_derived_stats_value_differential.py` confirms,
        via a real call into `ApplyPath._apply_entity_update()` (the same authoritative merge code
        a full Kernel tick runs, not a separate bypassed phase -- `stats_dirty`'s own trigger and
