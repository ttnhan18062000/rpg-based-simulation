        already-known COMB-318 gap. See TCK-20260916-DERIVED-COMBAT-STAT-RECALCULATION-UNOBSERVED-
        IN-CORPUS, now root-caused (2026-09-17): content-composition/pacing, not a wiring gap --
        the combat-XP-to-level-up chain is directly confirmed correct and reachable (see
        `xp_leveling`'s own verified block below), it just never accumulates enough real combat
        volume to cross a single level threshold within any tested 1000-tick corpus window. This
        verdict does not need revisiting on that basis; the note is updated only to close the
        open thread the prior note left.
