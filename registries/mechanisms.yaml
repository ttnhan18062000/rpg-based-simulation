  - id: interaction_channeling
    layer: entity
    systems: [social]
    depends_on: []
    state: done
    implemented_by:
      - src/engine/interaction.py::InteractionSystem
    verified:
      instrument: code_trace
      verdict: observed
      date: "2026-09-20"
      note: >-
        TCK-20260920-MECHANISM-ENTITY-LAYER-UNBOUND-CLAIMS-RESOLUTION.
        `InteractionComponent`'s own docstring ("State for multi-tick channeling logic") names
        this mechanism directly. `InteractionSystem.enforce()` (`src/engine/interaction.py`, the
