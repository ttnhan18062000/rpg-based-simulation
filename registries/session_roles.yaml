      accepts_dispatch_from: [user, agent-working-designer-u24, agent-working-planner-u24]
    capability: {may_write: ["**"]}
    placement: {worktree: agent-working-u24, max_sessions: 1}
    handover: .claude/handover/agent-working-implementer-u24.md
    card_note: "Host u24desktop; twin is plain."

# Exclusive resources. The writer slot belongs to the worktree; a worktree hosts exactly one role, its
# writer (every designer, planner and implementer has its own worktree and lands its own PR, except a role
# with `placement.launch: main-checkout`, which names no worktree and holds no lease). The lease itself is
# taken at SessionStart by M2 and is runtime state.
