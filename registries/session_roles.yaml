# Session role manifest: the single source of truth for long-lived interactive sessions.
# Plan: docs/plans/agent_infrastructure/session_layer_working_process.md (sections 3, 4).
# Not to be confused with agent-working/agent-orchestration/roles/*.yaml (delegated subagent roles).
# Validated by tools/sessions/validate.py. Authority lives in registries/session_authority.yaml.
# Liveness and the current holder are runtime state (derivable); nothing here stores them.
version: 1

# Domain defaults: a role inherits owns / owns_not / routes from its domain unless it overrides
# them in its own entry (every override is counted in the complexity report).
domains:
  rpg:
    owns:
      - src/**
      - frontend/**
      - docs/mechanics/**
      - docs/engine/**
      - docs/parity_ledger/**
      - docs/plans/rpg_design_roadmap/**
      - docs/plans/simulation_semantic_control_plane/**
      - docs/plans/systemic_world/**
      - docs/world_rules/**
      - docs/brainstorm/**
      - registries/mechanisms.yaml
      - tests/**
    owns_not: []
    routes:
      "agent-working/**": agent-working-designer
      ".claude/**": agent-working-designer
      "tools/agent-monitoring/**": agent-working-designer
      "docs/plans/test_architecture/**": testing-planner
      "tests/architecture/**": testing-planner
  agent-working:
    owns:
      - tools/agent-monitoring/**
      - tools/delivery/**
      - tools/gate_checks/**
      - tools/agent_orchestration/**
      - tools/sessions/**
      - tools/mechanism_registry/**
      - docs/agent-monitoring/**
      - docs/plans/agent_infrastructure/**
      - docs/guidelines/session_roles/**
      - agent-working/agent-orchestration/**
      - agent-working/agent-monitoring/retro/**
      - registries/session_roles.yaml
      - registries/session_authority.yaml
      - .claude/agents/**
      - tests/tools/**
      - tests/docs/**
    owns_not:
      - registries/mechanisms.yaml   # content is rpg-domain; only the advisory tooling around it stays here
    routes:
      "registries/mechanisms.yaml": rpg-planner
      "src/**": rpg-planner
      "tests/architecture/**": testing-planner
  codebase:
    owns:
      - codebase/**
      - docs/plans/codebase_health/**
      - docs/guidelines/python_code_standard.md
      - .pre-commit-config.yaml
      - tests/codebase/**
    owns_not: []
    routes:
      "src/**": rpg-planner                   # ask before touching RPG logic
      "agent-working/**": agent-working-designer   # process problems
      "tools/test_architecture/**": testing-planner
      "tools/**": agent-working-designer
      "tests/architecture/**": testing-planner
  testing:
    owns:
      - docs/plans/test_architecture/**
      - tests/architecture/**
      - tests/mutation/**
      - tools/test_architecture/**
      - .github/workflows/test.yml            # owner 2026-10-08: testing holds the test CI workflows
      - .github/workflows/slow-regression*.yml   # includes slow-regression-watchdog.yml
    owns_not: []
    routes:
      "src/**": rpg-planner                   # ask before touching RPG logic
      "docs/mechanics/**": rpg-planner
      "agent-working/**": agent-working-designer   # process problems
      "tools/**": agent-working-designer

  asset:   # TCK-20261009-REGISTER-OTHER-HOST-SEATS; paths confirmed by asset-planner on PR #476
    owns:
      - visual_assets/**
      - docs/assets/**
      - docs/plans/visual-asset-*/**        # foundation, management-runtime-integration
      - docs/plans/aseprite-mcp-pixel-art/**
      - tests/visual_assets/**
      - tools/visual_assets_*.py
      - tools/ci_aseprite_skip_line.py
      - frontend/src/visualAssets/**         # the client half of the store
      - frontend/rehearsal-capture/**
      - docs/architecture/visual_asset_foundation_adr.md   # D1-D23
    owns_not: []
    routes:
      "src/**": rpg-planner                   # activation of adopted art waits on the RPG core
      "frontend/**": rpg-planner              # outside frontend/src/visualAssets/ and frontend/rehearsal-capture/
      "agent-working/**": agent-working-designer   # process problems; owned paths (.mcp.json, tests/architecture) route by owner
  perf:    # TCK-20261009-REGISTER-OTHER-HOST-SEATS; paths confirmed by perf-planner on PR #476
    owns:
      - src/perf/**
      - tests/perf/**
      - tools/perf/**
      - tools/perf_guard.py
      - tools/bench_corpus_world.py
      - docs/performance/**
      - docs/plans/design_enhancement/performance_optimization/**
      - docs/architecture/performance_optimization_decisions.md   # PERF-D records; the owner approves
      - tests/unit/perf/**
      - perf_baselines.json                  # PerfBudget store (M2-T03 decides absorb or retire)
      - tests/tools/perf_assertions.py       # soft-threshold helper; perf is first reviewer
    owns_not: []
    routes:
      "src/**": rpg-planner                   # core windows are opened by the owner with RPG-core
      "docs/engine/**": rpg-planner           # performance_contract.md stays rpg-owned (P1)
      "agent-working/**": agent-working-designer   # process problems
      "tests/architecture/**": testing-planner     # test.yml is testing's by ownership
  lead:    # TCK-20261009-REGISTER-OTHER-HOST-SEATS; requested by lead-planner on PR #476 (owner, 2026-10-09)
    owns:  # the tech-stack roots route.py reported unowned; domain implementers still make the edits
      - pyproject.toml
      - uv.lock
      - Makefile
      - compose.yaml
      - docker/**
      - dashboard-frontend/**
      - website/**
      - .mcp.json
      - .github/workflows/deploy-docs.yml
      - docs/architecture/**                 # asset's ADR and perf's PERF-D file are split below
      # agent-working/lead/** joins once its first file is on main (an owns glob must match a file)
    owns_not: []
    routes:
      "src/**": rpg-planner
      "frontend/**": rpg-planner
      "visual_assets/**": asset-planner
      "tools/**": agent-working-designer
      "agent-working/**": agent-working-designer
# Intentional overlaps between domains (a path matched by two domains' owns is an error unless a
# split here names both domains and covers it).
ownership_splits:
  - {paths: ["tests/architecture/**", "tests/mutation/**"], domains: [rpg, testing],
     reason: "rpg owns tests/** generally; the testing domain owns the architecture and mutation suites"}
  - {paths: ["tests/tools/**", "tests/docs/**"], domains: [rpg, agent-working],
     reason: "rpg owns tests/** generally; agent-working owns the tooling and docs suites"}

  - {paths: ["tests/codebase/**"], domains: [rpg, codebase],
     reason: "rpg owns tests/** generally; the codebase domain owns the code-health suites"}
  - {paths: ["tests/visual_assets/**"], domains: [rpg, asset],
     reason: "rpg owns tests/** generally; the asset domain owns the visual-asset store suites"}
  - {paths: ["src/perf/**", "tests/perf/**", "tests/unit/perf/**"], domains: [rpg, perf],
     reason: "rpg owns src/** and tests/** generally; the perf domain owns the bench/profiling harness and perf suites"}
  - {paths: ["tests/tools/perf_assertions.py"], domains: [rpg, perf],
     reason: "rpg owns tests/** generally; perf owns the soft-threshold helper it rewrites in M2-T03"}
  - {paths: ["tests/tools/perf_assertions.py"], domains: [agent-working, perf],
     reason: "agent-working owns tests/tools/** generally; perf owns this one helper (longest glob routes it to perf)"}
  - {paths: ["frontend/src/visualAssets/**", "frontend/rehearsal-capture/**"], domains: [rpg, asset],
     reason: "rpg owns frontend/** generally; the asset domain owns the client half of the visual-asset store"}
  - {paths: ["docs/architecture/visual_asset_foundation_adr.md"], domains: [lead, asset],
     reason: "lead owns docs/architecture/** generally; the asset ADR (D1-D23) is asset's"}
  - {paths: ["docs/architecture/performance_optimization_decisions.md"], domains: [lead, perf],
     reason: "lead owns docs/architecture/** generally; the PERF-D records are perf's"}

roles:
  - role: rpg-designer
    identity: {domain: rpg, function: designer, session_name: rpg-designer,
               legacy_session_name: world-rule-catalog-design, seat_status: staffed}
    responsibility:
      accepts_dispatch_from: [user]
    capability: {may_write: [".claude/handover/drafts/**", "docs/world_rules/**", "docs/plans/systemic_world/**"]}
    placement: {worktree: rpg-designer, max_sessions: 1}
    handover: .claude/handover/rpg-designer.md
  - role: rpg-planner
    identity: {domain: rpg, function: planner, session_name: rpg-planner,
               legacy_session_name: rpg-feature-planning, seat_status: staffed}
    responsibility:
      accepts_dispatch_from: [user, rpg-designer]
    capability: {may_write: [".claude/handover/drafts/**", "docs/plans/**", "agent-working/tickets/**"]}
    placement: {worktree: rpg-planner, max_sessions: 1}
    handover: .claude/handover/rpg-planner.md
  - role: rpg-implementer
    identity: {domain: rpg, function: implementer, session_name: rpg-implementer,
               legacy_session_name: rpg-implementer, seat_status: staffed}
    responsibility:
      accepts_dispatch_from: [user, rpg-planner]
    capability: {may_write: ["**"]}
    placement: {worktree: rpg, max_sessions: 3}
    handover: .claude/handover/rpg-implementer.md
  - role: agent-working-designer
    identity: {domain: agent-working, function: designer, session_name: agent-working-designer,
               legacy_session_name: agent-working-design, seat_status: staffed}
    responsibility:
      accepts_dispatch_from: [user]
    capability: {may_write: [".claude/handover/drafts/**", "docs/plans/agent_infrastructure/**"]}
    placement: {worktree: agent-working-designer, max_sessions: 1}
    handover: .claude/handover/agent-working-designer.md
  - role: agent-working-planner
    identity: {domain: agent-working, function: planner, session_name: agent-working-planner,
               legacy_session_name: agent-working-design, seat_status: unstaffed,
               interim_holder: agent-working-designer}   # named holder until the seat is staffed
    responsibility:
      accepts_dispatch_from: [user, agent-working-designer]
    capability: {may_write: [".claude/handover/drafts/**", "agent-working/tickets/**"]}
    placement: {worktree: agent-working-planner, max_sessions: 1}
    handover: .claude/handover/agent-working-planner.md
  - role: agent-working-implementer
    identity: {domain: agent-working, function: implementer, session_name: agent-working-implementer,
               legacy_session_name: agent-working-implementer, seat_status: staffed}
    responsibility:
      accepts_dispatch_from: [user, agent-working-designer, agent-working-planner]
    capability: {may_write: ["**"]}
    placement: {worktree: agent-working, max_sessions: 1}
    handover: .claude/handover/agent-working-implementer.md
  - role: testing-designer
    identity: {domain: testing, function: designer, session_name: testing-designer,
               legacy_session_name: null, seat_status: unstaffed,
               interim_holder: testing-planner}   # the roadmap's author became the reviewer
    responsibility:
      accepts_dispatch_from: [user]
    capability: {may_write: [".claude/handover/drafts/**", "docs/plans/test_architecture/**"]}
    placement: {worktree: testing-designer, max_sessions: 1}
    handover: .claude/handover/testing-designer.md
  - role: testing-planner
    identity: {domain: testing, function: planner, session_name: testing-planner,
               legacy_session_name: test-architecture-reviewer, seat_status: staffed}
    responsibility:
      accepts_dispatch_from: [user, testing-designer]
    capability: {may_write: [".claude/handover/drafts/**", "docs/plans/test_architecture/**", "agent-working/tickets/**"]}
    placement: {worktree: testing-planner, max_sessions: 1}
    handover: .claude/handover/testing-planner.md
  - role: testing-implementer
    identity: {domain: testing, function: implementer, session_name: testing-implementer,
               legacy_session_name: test-architecture-implementer, seat_status: staffed}
    responsibility:
      accepts_dispatch_from: [user, testing-planner]
    capability: {may_write: ["**"]}
    placement: {worktree: testing, max_sessions: 1}
    handover: .claude/handover/testing-implementer.md

  - role: codebase-designer
    identity: {domain: codebase, function: designer, session_name: codebase-designer,
               legacy_session_name: null, seat_status: unstaffed,
               interim_holder: agent-working-designer}   # no codebase session exists yet
    responsibility:
      accepts_dispatch_from: [user]
    capability: {may_write: [".claude/handover/drafts/**", "docs/plans/codebase_health/**"]}
    placement: {worktree: codebase-designer, max_sessions: 1}
    handover: .claude/handover/codebase-designer.md
  - role: codebase-planner
    identity: {domain: codebase, function: planner, session_name: codebase-planner,
               legacy_session_name: codebase-planner, seat_status: staffed}   # runs on host ubuntu (2026-10-09)
    responsibility:
      accepts_dispatch_from: [user, codebase-designer]
    capability: {may_write: [".claude/handover/drafts/**", "docs/plans/codebase_health/**", "agent-working/tickets/**"]}
    placement: {worktree: codebase-planner, max_sessions: 1}
    handover: .claude/handover/codebase-planner.md
  - role: codebase-implementer
    identity: {domain: codebase, function: implementer, session_name: codebase-implementer,
               legacy_session_name: codebase-implementer, seat_status: staffed}   # runs on host ubuntu (2026-10-09)
    responsibility:
      accepts_dispatch_from: [user, codebase-planner]
    capability: {may_write: ["**"]}
    placement: {worktree: codebase, max_sessions: 1}
    handover: .claude/handover/codebase-implementer.md

  - role: asset-planner
    identity: {domain: asset, function: planner, session_name: asset-planner,
               legacy_session_name: asset-planner, seat_status: staffed}   # runs on host ubuntu (2026-10-09)
    responsibility:
      accepts_dispatch_from: [user]   # no asset-designer seat; the owner directs
    capability: {may_write: [".claude/handover/drafts/**", ".claude/handover/asset-planner.md", "docs/assets/**",
                             "docs/plans/visual-asset-foundation/**", "docs/plans/visual-asset-management-runtime-integration/**",
                             "agent-working/tickets/**", "agent-working/staging_artifacts/**",
                             "agent-working/agent-monitoring/**", "docs/REGISTRY.yaml"]}
    placement: {worktree: asset-planner, max_sessions: 1}   # ubuntu: proposed ~/Work/rpg-asset-planner (owner decides)
    handover: .claude/handover/asset-planner.md
  - role: asset-implementer
    identity: {domain: asset, function: implementer, session_name: asset-implementer,
               legacy_session_name: asset-implementer, seat_status: staffed}   # runs on host ubuntu (2026-10-09)
    responsibility:
      accepts_dispatch_from: [user, asset-planner]
    capability: {may_write: ["**"]}
    placement: {worktree: asset, max_sessions: 1}   # ubuntu: launch.py --worktree ~/Work/rpg-aseprite-mcp
    handover: .claude/handover/asset-implementer.md

  - role: perf-planner
    identity: {domain: perf, function: planner, session_name: perf-planner,
               legacy_session_name: perf-planner, seat_status: staffed}   # runs on host ubuntu (2026-10-09)
    responsibility:
      accepts_dispatch_from: [user]   # no perf-designer seat; roadmap "Ownership model" (2026-10-02)
    capability: {may_write: [".claude/handover/drafts/**", "docs/performance/**",
                             "docs/plans/design_enhancement/performance_optimization/**",
                             "docs/architecture/performance_optimization_decisions.md", "agent-working/tickets/**",
                             "agent-working/agent-monitoring/**", "docs/REGISTRY.yaml"]}
    placement: {worktree: perf-planner, max_sessions: 1}   # ubuntu: proposed ~/Work/rpg-perf-planner
    handover: .claude/handover/perf-planner.md
  - role: perf-implementer
    identity: {domain: perf, function: implementer, session_name: perf-implementer,
               legacy_session_name: perf-implementer, seat_status: staffed}   # runs on host ubuntu (2026-10-09)
    responsibility:
      accepts_dispatch_from: [user, perf-planner]
    capability: {may_write: ["**"]}
    placement: {worktree: perf, max_sessions: 1}   # ubuntu: launch.py --worktree ~/Work/rpg-perf
    handover: .claude/handover/perf-implementer.md

  - role: lead-planner   # advisory and sequencing only: it must never appear in any accepts_dispatch_from
    identity: {domain: lead, function: planner, session_name: lead-planner,
               legacy_session_name: null, seat_status: staffed}   # runs on host ubuntu (2026-10-09)
    responsibility:
      accepts_dispatch_from: [user]
    capability: {may_write: [".claude/handover/drafts/**", "agent-working/lead/**", "agent-working/tickets/**",
                             "docs/architecture/**", "agent-working/agent-monitoring/**", "docs/REGISTRY.yaml"]}
    placement: {worktree: lead-planner, max_sessions: 1}   # mostly reads from the main checkout
    handover: .claude/handover/lead-planner.md

# Exclusive resources. The writer slot belongs to the worktree; a worktree hosts exactly one role, its
# writer (every designer, planner and implementer has its own worktree and lands its own PR). The lease
# itself is taken at SessionStart by M2 and is runtime state.
worktrees:
  rpg: {writer: rpg-implementer}
  agent-working: {writer: agent-working-implementer}
  testing: {writer: testing-implementer}
  codebase: {writer: codebase-implementer}
  rpg-designer: {writer: rpg-designer}
  rpg-planner: {writer: rpg-planner}
  agent-working-designer: {writer: agent-working-designer}
  agent-working-planner: {writer: agent-working-planner}
  testing-designer: {writer: testing-designer}
  testing-planner: {writer: testing-planner}
  codebase-designer: {writer: codebase-designer}
  codebase-planner: {writer: codebase-planner}
  asset: {writer: asset-implementer}
  asset-planner: {writer: asset-planner}
  perf: {writer: perf-implementer}
  perf-planner: {writer: perf-planner}
  lead-planner: {writer: lead-planner}
