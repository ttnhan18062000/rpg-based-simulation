# GOVERNING FILE (plan section 10): a session must not silently rewrite the policy that constrains it.
# Every change needs the user's confirmation of the LITERAL diff, like CLAUDE.md and settings.json.
# Since 2026-10-07 (owner: "Drop all but critical") the guard no longer asks about governing-file edits: governing
# files are protected only by review and PR merge. The guard asks only for merge, push_default_branch,
# delete_remote_branch, delete_worktree_or_data and workflow_run.
# Enforcement of these entries is M5; this file only declares them. Validated by tools/sessions/validate.py.
governing_file: true
version: 1

# Defaults by function (plan section 10 table). `forbidden`: the role never does it (hands drafts).
# `needs_user`: needs the user's explicit go each time unless a dated grant below covers it.
function_defaults:
  designer:
    forbidden: [commit, push, open_pr]
    needs_user: [merge, push_default_branch, workflow_run, delete_remote_branch, delete_worktree_or_data]
  planner:
    forbidden: [commit, push, open_pr]
    needs_user: [merge, push_default_branch, workflow_run, delete_remote_branch, delete_worktree_or_data]
  implementer:
    forbidden: []
    needs_user: [push_default_branch, merge, workflow_run, delete_remote_branch, delete_worktree_or_data]

# Own-branch rule (owner, 2026-10-06: "only block the merge branch to main, every action on their own branch is
# allowed"): commit, push, force-push, local merge and open_pr on a non-default branch are not listed in
# needs_user. `push_default_branch` (a push whose destination is main) and `merge` (gh pr merge) always ask.
# Per-role entries: only a role with a dated, quoted, revocable grant needs one. `needs_user` always wins
# over a grant for merge, push_default_branch, workflow_run and the delete classes.
authority:
  agent-working-implementer:
    # SUPERSEDED 2026-10-06 by the own-branch rule above: push/open_pr no longer need a grant. Kept for its quote.
    grants:
      - action: [push, open_pr]
        scope: "after a complete batch, on the batch's own branch"
        date: 2026-10-04
        quote: "after a batch you always need to push and open PR"
        source: user, in the agent-working-implementer terminal
