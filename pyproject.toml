[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rpg-based-simulation"
version = "0.1.0"
description = "Deterministic Concurrent RPG Engine"
requires-python = ">=3.11"
dependencies = [
    "xxhash>=3.4.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.0.0",
    "sse-starlette>=3.3.0",
    "prometheus-client>=0.20.0",
    "redis>=5.0.0",
    "pika>=1.3.2",
    "confluent-kafka>=2.6.0",
    "psutil>=5.9.0",
    "python-json-logger>=2.0.7",
    "requests>=2.31.0",
    "msgpack>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "testcontainers[redis]>=4.0.0",
    "httpx>=0.27.0",
    "hypothesis>=6.0.0",
    "memray>=1.0.0",
    "mypy",
]
# torch must be installed separately from the CPU wheel before this extra:
#   pip install torch --index-url https://download.pytorch.org/whl/cpu
knowledge = [
    "sentence-transformers>=2.7.0",
    "sqlite-vec>=0.1.1",
    "rank-bm25>=0.2.2",
]
search-mcp = [
    "mcp>=1.0.0",
]

[project.scripts]
rpg-sim = "src.__main__:main"
rpg-world = "src.worldbuilding.cli:main"
rpg-lab = "src.lab.cli:main"


[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
pythonpath = ["."]
norecursedirs = [
    "reviews",
    "scratch",
    "stored_artifacts",
    "tests_legacy",
    ".venv",
    ".git",
    "node_modules",
    "__pycache__",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "extra_slow: marks tests as extremely slow (>60s, deselect with '-m \"not extra_slow\"')",
    "world_long_run: long-run living-world stability tests",
    "legacy_characterization: proves legacy behavior in src",
    "v2_contract: defines a new V2-specific contract",
    "differential: parity test comparing src and src_legacy",
    "intentional_divergence: asserts a documented behavioral difference",
    "regression: targets a specific bug identified during porting",
    "certification: engine integrity proof for milestone gates",
    "perf: performance measurement tests",
    "integration: integration tests across multiple components",
    "e2e: end-to-end simulation scenario tests",
    "strategic_loop: strategic loop mechanics tests",
    "worldassembly: world module assembly, composition, provenance, and compile-context tests",
    "catalog: content catalog schema, adapter, and runtime content mode tests",
    "content_graph: content reference graph and active-data-consumer gate tests",
    "registry_projection: registry bootstrap mode routing and adapter projection tests",
    "scenario_setup: scenario schema, resolver, and modifier applicator tests",
    "strict_matrix: cumulative world module matrix tests (worldassembly subset)",
    "legacy_compat: arena and certification regression tests preserving legacy behavior",
    "content_pack: content pack format validation and expansion gate tests",
    "architecture: static architecture guard tests (no runtime, no catalog load)",
    "e2e_golden: golden artifact fixture tests validating schema compatibility with real engine output",
    "scenario_flags: per-scenario feature flag default and configuration assertions",
    "feature_flag_default: feature flag default value and stability assertions",
    "corpus_flag_guardrail: per-world calibration-profile feature-flag/content-field guardrail assertions",
]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
warn_return_any = true
warn_unused_ignores = true
exclude = [
    "src/ai/",
    "src/town/",
    "src/quests/",
    "src/entities/",
    "src/progression/",
]
