[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rpg-based-simulation"
version = "0.1.0"
description = "Deterministic Concurrent RPG Engine"
requires-python = ">=3.11"
# Single source of dependency declarations. uv.lock is resolved from this file and
# requirements.txt is a generated export of the lock (never edit it by hand):
#   uv export --frozen --no-hashes --no-emit-project -o requirements.txt
# See docs/guidelines/agent_working_environment.md.
dependencies = [
    "xxhash>=3.4.0",
    "fastapi>=0.115.0",
    "starlette>=0.40.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.0.0",
    "typing-extensions>=4.8.0",
    "sse-starlette>=3.3.0",
    "prometheus-client>=0.20.0",
    "redis>=5.0.0",
    "psutil>=5.9.0",
    "python-json-logger>=2.0.7",
    "requests>=2.31.0",
    "msgpack>=1.0.0",
    "pyyaml>=6.0",
    "duckdb>=1.0.0",
    "pyarrow>=15.0.0",
]

[project.optional-dependencies]
# torch must be installed separately from the CPU wheel before this extra:
#   pip install torch --index-url https://download.pytorch.org/whl/cpu
knowledge = [
    "sentence-transformers>=2.7.0",
    "sqlite-vec>=0.1.1",
    "rank-bm25>=0.2.2",
]
search-mcp = [
    "mcp>=1.0.0",
]

# Test and dev tooling. `dev` is installed by default by `uv sync` and is part of the
# requirements.txt export; `profiling` is opt-in (`uv sync --group profiling`).
[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=1.0.0",
    "httpx>=0.27.0",
    "hypothesis>=6.0.0",
    "coverage>=7.0.0",
    "mypy",
    "jsonschema>=4.0.0",
    # Also declared as the `search-mcp` extra, which existing tests pin; the dev group makes
    # the default export (requirements.txt) reach it for tests/tools/test_search_mcp.py.
    "mcp>=1.0.0",
    "websockets>=12.0",
    # Code-health tools (TCK-20261002-CODE-HEALTH-TOOL-CONFIG). Pinned exactly: a new release
    # can add or retune rules, which would change the measured baseline without a code change.
    # jscpd is a Node tool and is pinned separately (JSCPD_VERSION in the Makefile).
    "ruff==0.16.10",
    "complexipy==8.0.1",
]
profiling = [
    "memray>=1.0.0",
]

[project.scripts]
rpg-sim = "src.__main__:main"
rpg-world = "src.worldbuilding.cli:main"
rpg-lab = "src.lab.cli:main"


[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
pythonpath = ["."]
norecursedirs = [
    "reviews",
    "scratch",
    "stored_artifacts",
    ".venv",
    ".venv-knowledge",
    ".git",
    "node_modules",
    "__pycache__",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "extra_slow: marks tests as extremely slow (>60s, deselect with '-m \"not extra_slow\"')",
    "world_long_run: long-run living-world stability tests",
    "legacy_characterization: proves legacy behavior in src",
    "v2_contract: defines a new V2-specific contract",
    "differential: parity test comparing src and src_legacy",
    "intentional_divergence: asserts a documented behavioral difference",
    "regression: targets a specific bug identified during porting",
    "certification: engine integrity proof for milestone gates",
    "perf: performance measurement tests",
    "integration: integration tests across multiple components",
    "e2e: end-to-end simulation scenario tests",
    "strategic_loop: strategic loop mechanics tests",
    "worldassembly: world module assembly, composition, provenance, and compile-context tests",
    "catalog: content catalog schema, adapter, and runtime content mode tests",
    "content_graph: content reference graph and active-data-consumer gate tests",
    "registry_projection: registry bootstrap mode routing and adapter projection tests",
    "scenario_setup: scenario schema, resolver, and modifier applicator tests",
    "strict_matrix: cumulative world module matrix tests (worldassembly subset)",
    "legacy_compat: arena and certification regression tests preserving legacy behavior",
    "content_pack: content pack format validation and expansion gate tests",
    "architecture: static architecture guard tests (no runtime, no catalog load)",
    "e2e_golden: golden artifact fixture tests validating schema compatibility with real engine output",
    "scenario_flags: per-scenario feature flag default and configuration assertions",
    "feature_flag_default: feature flag default value and stability assertions",
    "corpus_flag_guardrail: per-world calibration-profile feature-flag/content-field guardrail assertions",
    "resource_budget_large: forces --resource-budget large (600s/8GB) regardless of the CLI default; for tests inherently >60s (TCK-20260829-SIMQ-PERSISTENCE-BACKPRESSURE-PERF-INVESTIGATION)",
    "domain(name): gameplay domain a core-RPG test is about; values are defined in docs/testing/test_taxonomy.md section 10",
    "level(name): test level (unit, kernel_integration, mechanic_scenario, ...); values are defined in docs/testing/test_taxonomy.md section 10",
]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
warn_return_any = true
warn_unused_ignores = true
exclude = [
    "src/ai/",
    "src/town/",
    "src/quests/",
    "src/entities/",
    "src/progression/",
]

# ── Code health (python_code_craft_roadmap.md section 6; docs/guidelines/python_code_standard.md) ──
# Check only: no formatter is adopted (roadmap decision 8.3), so there is no [tool.ruff.format].
# Existing violations are held in an external baseline, not fixed or suppressed in src/.
[tool.ruff.lint]
# Only the rules the standard names. Selecting these replaces ruff's default E/F set, so the
# baseline stays about the standard and not about unrelated style.
select = [
    "ANN",      # T1: annotations on every argument and return value
    "B006",     # F3: no mutable default arguments
    "B904",     # E4: chain re-raised exceptions
    "BLE001",   # E2: no blind `except Exception` (justify with `# noqa: BLE001` plus reason)
    "C901",     # S3: cyclomatic complexity
    "D100", "D101", "D102", "D103", "D104",  # D1: public module/class/method/function/package docstrings
    "E722",     # E1: no bare except
    "F403",     # M2: no wildcard imports
    "I001",     # M1: import grouping
    "N",        # N2: PEP 8 identifier case
    "PLC0415",  # M1: imports at module top (justify with `# noqa: PLC0415` plus reason)
    "PLR0912",  # S6: branches
    "PLR0913",  # S5: arguments
    "PLR0915",  # S2: statements
    "PLR1702",  # S7: nesting depth (a preview rule, see below)
]
# T2 (`Any` in a public signature) is a reviewer rule in the standard, not a tool rule.
ignore = ["ANN401"]
# PLR1702 is preview-only. Preview behaviour is enabled but every preview *rule* must be
# selected by its exact code, so no other preview rule turns on.
preview = true
explicit-preview-rules = true

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-args = 5
max-branches = 12
max-statements = 50
max-nested-blocks = 5

# Cognitive complexity limit; complexipy reads this table and exits non-zero above it.
[tool.complexipy]
paths = ["src"]
max-complexity-allowed = 15

# Length limits read by tools/code_health/line_count.py.
[tool.code_health.size]
function-warn-lines = 50
function-fail-lines = 80
class-lines = 500
module-lines = 1000
