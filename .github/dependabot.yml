# Dependabot version updates (TCK-20261014-DEPENDABOT-AND-BASE-IMAGE-PINS). Monthly, minor/patch grouped, semver-major ignored, no auto-merge.
# Review routing by the file a PR changes (labels below): uv.lock and frontend/** -> rpg; test.yml actions -> testing;
# everything else -> platform.
version: 2
updates:
  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    # Major bumps are deliberate tickets owned by the file's domain, not automated PRs (TCK-20261014-DEPENDABOT-IGNORE-MAJOR-BUMPS).
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    labels: [dependencies, platform]
    groups:
      docker-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    # Major bumps are deliberate tickets owned by the file's domain, not automated PRs (TCK-20261014-DEPENDABOT-IGNORE-MAJOR-BUMPS).
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    labels: [dependencies, platform]
    groups:
      compose-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    # Major bumps are deliberate tickets owned by the file's domain, not automated PRs (TCK-20261014-DEPENDABOT-IGNORE-MAJOR-BUMPS).
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    labels: [dependencies, platform]
    groups:
      actions-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    # Major bumps are deliberate tickets owned by the file's domain, not automated PRs (TCK-20261014-DEPENDABOT-IGNORE-MAJOR-BUMPS).
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    labels: [dependencies, rpg]
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    # Major bumps are deliberate tickets owned by the file's domain, not automated PRs (TCK-20261014-DEPENDABOT-IGNORE-MAJOR-BUMPS).
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    labels: [dependencies, rpg]
    groups:
      uv-minor-patch:
        update-types: [minor, patch]
