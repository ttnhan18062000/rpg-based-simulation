# Dependabot version updates (TCK-20261014-DEPENDABOT-AND-BASE-IMAGE-PINS, TCK-20261014-DEPENDABOT-GROUPED-MAJORS-MONTHLY).
# Monthly. Each ecosystem opens at most two PRs a month: one for major updates, one for minor/patch. We stay current on majors.
# Review routing by the file a PR changes (labels below): uv.lock and frontend/** -> rpg; test.yml actions -> testing;
# everything else -> platform.
version: 2
updates:
  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    labels: [dependencies, platform]
    # Stay on an even (LTS) Node line: do not propose Node 25+ (Node 24 LTS is the owner's choice, 2026-10-14).
    # Widen this deliberately when the next even LTS line matures.
    ignore:
      - dependency-name: node
        versions: [">=25"]
      # Python 3.14+ waits for rpg's dependency window: CI, uv.lock and setup-uv are on 3.13 and the image
      # check "Image runs the CI Python" fails on a different line. 3.13.x patch updates still come through.
      # Widen this when rpg moves CI and the lockfile to the next line.
      - dependency-name: python
        versions: [">=3.14"]
      # The uv image pin moves together with test.yml's setup-uv `version:` input, which Dependabot cannot bump
      # (see the header of docker/backend.Dockerfile). Bump both by hand. The name is the one Dependabot
      # reported for ghcr.io/astral-sh/uv in #576's update metadata.
      - dependency-name: astral-sh/uv
    groups:
      docker-major:
        update-types: [major]
      docker-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    labels: [dependencies, platform]
    groups:
      compose-major:
        update-types: [major]
      compose-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    labels: [dependencies, platform]
    groups:
      actions-major:
        update-types: [major]
      actions-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    labels: [dependencies, rpg]
    groups:
      npm-major:
        update-types: [major]
      npm-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    labels: [dependencies, rpg]
    groups:
      uv-major:
        update-types: [major]
      uv-minor-patch:
        update-types: [minor, patch]
