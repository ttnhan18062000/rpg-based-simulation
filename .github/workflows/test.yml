  # ── Frontend: vitest + build ──────────────────────────────────────────────
  # TCK-20260825-CI-FRONTEND-TEST-COVERAGE-GAP: this workflow previously had zero npm/vitest/
  # frontend coverage -- every other job runs pytest only. Always runs (no changed-files gate)
  # since the frontend suite is fast (~1-2s measured) and a path-filter skip risks silently
  # masking a real break on a PR that doesn't touch frontend/ but still needs the build gate
  # (e.g. a root-level config change).
  frontend:
    name: "Frontend"
    runs-on: ubuntu-latest
    # TCK-20260906-CI-FRONTEND-PATH-FILTER: path-filtered via the changed-files gate below --
    # frontend/ is a fully separate toolchain (no Python import graph), so unlike the 9 explicitly
    # out-of-scope Python jobs, a path-based skip here carries no false-negative risk.
    needs: [changed-files]
    if: ${{ !cancelled() && (needs.changed-files.result != 'success' || needs.changed-files.outputs.run_frontend == 'true') }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: cd frontend && npm ci
      - name: Test
        run: cd frontend && npx vitest run
      - name: Build
        run: cd frontend && npm run build

  # ── Changed-files gate (path-based skip for perf-cert-arena / migration-lanes / frontend) ──
  # TCK-20260819-CI-NARROW-PATH-FILTERED-JOBS: always runs (no if: of its own -- a
  # gate job that could itself be skipped would cascade-skip both downstream jobs via
  # the needs-success mechanism this ticket exists to avoid). Scoped to pull_request
  # events only; all other event types force both outputs true unconditionally.
  # run_frontend added by TCK-20260906-CI-FRONTEND-PATH-FILTER, same fail-open shape.
  changed-files:
    name: "Changed files (path-filter gate)"
    runs-on: ubuntu-latest
    outputs:
      run_perf_cert_arena: ${{ steps.diff.outputs.run_perf_cert_arena }}
      run_migration_lanes: ${{ steps.diff.outputs.run_migration_lanes }}
      run_frontend: ${{ steps.diff.outputs.run_frontend }}
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - id: diff
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "run_perf_cert_arena=true" >> "$GITHUB_OUTPUT"
            echo "run_migration_lanes=true" >> "$GITHUB_OUTPUT"
            echo "run_frontend=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"
          if ! CHANGED=$(git diff --name-only "$BASE...$HEAD" 2>&1); then
            echo "::warning::changed-files diff failed ($CHANGED) — failing open, both jobs will run"
            echo "run_perf_cert_arena=true" >> "$GITHUB_OUTPUT"
            echo "run_migration_lanes=true" >> "$GITHUB_OUTPUT"
            echo "run_frontend=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$CHANGED"
          PERF_RE='^(tests/(perf|certification|arena)/|src/(ai|api|certification|cognition|config|core|domains|engine|observability|perf|platform|replay|world|worldbuilding)/|Makefile$|requirements\.txt$|\.github/workflows/test\.yml$)'
          MIG_RE='^(tests/architecture/|tests/(integration|unit)/(content|scenarios|worldassembly|certification|runtime)/|tests/conftest\.py$|src/(core|content|platform|runtime|scenarios|worldassembly|worldbuilding|worldmodules|certification)/|Makefile$|requirements\.txt$|\.github/workflows/test\.yml$)'
          FRONTEND_RE='^(frontend/|\.github/workflows/test\.yml$)'
          echo "run_perf_cert_arena=$(echo "$CHANGED" | grep -qE "$PERF_RE" && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "run_migration_lanes=$(echo "$CHANGED" | grep -qE "$MIG_RE" && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "run_frontend=$(echo "$CHANGED" | grep -qE "$FRONTEND_RE" && echo true || echo false)" >> "$GITHUB_OUTPUT"

  # ── Perf / certification / arena ─────────────────────────────────────────
  perf-cert-arena:
    name: "Perf / cert / arena"
    runs-on: ubuntu-latest
    needs: [changed-files]
    if: ${{ !cancelled() && (needs.changed-files.result != 'success' || needs.changed-files.outputs.run_perf_cert_arena == 'true') }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.13", cache: pip }
      - run: pip install -r requirements.txt
      - name: Run
        run: |
          pytest tests/perf \
                 tests/certification \
                 tests/arena \
                 -m "not slow and not extra_slow" --tb=short -q \
                 --junit-xml=reports/junit/perf-cert-arena.xml
      - name: Fetch base branch for collect-only diff
        if: github.event_name == 'pull_request'
        run: |
          if ! git fetch origin "${{ github.base_ref }}" --depth=1 2>&1; then
            echo "::warning::base-branch fetch failed — new/existing breakdown will be skipped"
            exit 0
          fi
          if ! git worktree add /tmp/base-checkout FETCH_HEAD 2>&1; then
            echo "::warning::base-branch worktree add failed — new/existing breakdown will be skipped"
            exit 0
          fi
      - name: Base branch test collection
        if: github.event_name == 'pull_request'
        run: |
          if [ -d /tmp/base-checkout ]; then
            cd /tmp/base-checkout && pytest tests/perf \
                   tests/certification \
                   tests/arena \
                   -m "not slow and not extra_slow" --collect-only -q > /tmp/base-collect.txt 2>&1 || true
          fi
      - name: Job summary
        if: always()
        run: python3 tools/ci_junit_summary.py "reports/junit/perf-cert-arena.xml" "perf-cert-arena" "/tmp/base-collect.txt" >> "$GITHUB_STEP_SUMMARY"

  # ── Migration lanes + expansion gate ─────────────────────────────────────
  migration-lanes:
    name: "Migration lanes"
    runs-on: ubuntu-latest
    needs: [changed-files]
    if: ${{ !cancelled() && (needs.changed-files.result != 'success' || needs.changed-files.outputs.run_migration_lanes == 'true') }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.13", cache: pip }
      - run: pip install -r requirements.txt
      - name: Fast lanes
        run: make lane-all-fast
      - name: Expansion gate
        run: make gate-expansion

  # ── Type check (informational) ────────────────────────────────────────────
  typecheck:
    name: "Type check (informational)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.13", cache: pip }
      - run: pip install -r requirements.txt
      - run: pip install mypy
      # Remove continue-on-error once baseline error count is documented
      # (open_audit_findings_backlog §1G).
      - name: mypy
        run: python3 -m mypy src/ --config-file pyproject.toml --no-error-summary || true
        continue-on-error: true

  # ── SimQ grade-anchor drift (informational) ──────────────────────────────
  simq-grade-drift:
    name: "SimQ grade-anchor drift (informational)"
    runs-on: ubuntu-latest
    # TCK-20260903-WORLD-COMPILE-REPORT-BASELINE-STALENESS: test_grade_regression.py's own
    # anchor-comparison tests only ever run against data/calibration/ (gitignored,
    # developer-machine-local) and pytest.skip() silently whenever it's absent -- which is
    # every PR-gating "Simulation quality" job run today, since no CI job populates it. That
    # silence is exactly how 61/81 grade_anchors.json entries drifted from real current `main`
    # behavior with zero visible CI signal. This job runs `make simq-full-audit-full`, which
    # re-runs the engine for real (populating data/calibration/) and diffs against the
    # committed anchors (tools/evaluate_simq.py, exit 1 on REGRESS) -- same push-to-main-only
    # cadence as the "Slow regression" job below, since it re-runs the engine and shouldn't
    # gate fast PR iteration. Deliberately informational (continue-on-error), NOT blocking:
    # 61/81 anchors are already known-drifted (a separate, deliberately-deferred decision on
    # whether/how to regenerate them -- see the ticket), so a hard-blocking gate would fail
    # every push to main immediately over already-known, already-accepted drift. This job's
    # job is to make new drift visible for human review, not to silently re-accept it as
    # passing (which is the exact failure mode it exists to replace) or to force premature
    # acceptance of the historical backlog.
    if: github.ref == 'refs/heads/main' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.13", cache: pip }
      - run: pip install -r requirements.txt
      - name: SimQ full audit (engine re-run + anchor diff + regression tests + coverage scan)
        run: make simq-full-audit-full || true
        continue-on-error: true

  # ── Slow regression (main + PRs targeting main) ──────────────────────────
  slow:
    name: "Slow regression"
    runs-on: ubuntu-latest
    # TCK-20260818-STANDARD-SLOW-REGRESSION-OFF-PR-PATH: no longer runs on every PR push
    # (github.base_ref == 'main') -- the ~45-90min slow suite (9021-deselected-tests-heavy)
    # blocked fast development iteration on every commit. Still runs as a real safety net:
    # (a) on push to main itself (post-merge), (b) on the nightly schedule, (c) on manual
    # dispatch when a developer/agent wants pre-merge confidence.
    if: github.ref == 'refs/heads/main' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs:
      - unit-core-world
      - unit-gameplay
      - unit-infra
      - integration
      - api-tools
      - agent-orchestration
      - simulation-quality
      - arch-docs
      - frontend
      - perf-cert-arena
      - migration-lanes
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.13", cache: pip }
      - run: pip install -r requirements.txt
      - name: Slow tests — corpus diversity (isolated per-test, TCK-20260715-SIMQ-CORPUS-DIVERSITY-SESSION-LOAD-FLAKE)
        run: make simq-corpus-diversity-slow-isolated
      - name: Slow tests (includes 5k behavioral regression)
        run: |
          pytest tests/ -m "slow or extra_slow" --resource-budget large --tb=short -q --ignore=tests/unit/worldassembly/test_corpus_diversity.py
      - name: Legacy regression
        run: make lane-legacy-regression
      - name: Upload certification report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: certification-report-${{ github.sha }}
          path: reports/certification/
          retention-days: 30
