name: Tests

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast:
    name: Fast gate (PR + main)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fast lanes
        run: make lane-all-fast

      - name: Expansion gate
        run: make gate-expansion

      - name: Doc integrity
        run: pytest tests/docs/ -x -q

      - name: Install mypy
        run: pip install mypy

      # mypy runs informational on first pass. Remove continue-on-error once
      # baseline error count is documented in follow-up ticket (open_audit_findings_backlog §1G).
      - name: Type check (informational)
        run: python3 -m mypy src/ --config-file pyproject.toml --no-error-summary || true
        continue-on-error: true

  slow:
    name: Legacy regression (main only)
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    needs: fast

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Legacy regression
        run: make lane-legacy-regression
