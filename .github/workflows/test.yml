name: Tests

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Unit: core engine + world layer ──────────────────────────────────────
  unit-core-world:
    name: "Unit · core / world"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13", cache: pip }
      - run: pip install -r requirements.txt
      - name: Run
        run: |
          pytest tests/unit/core \
                 tests/unit/kernel \
                 tests/unit/engine \
                 tests/unit/config \
                 tests/unit/runtime \
                 tests/unit/platform \
                 tests/unit/world \
                 tests/unit/worldassembly \
                 tests/unit/worldbuilding \
                 tests/unit/worldgeneration \
                 tests/unit/worldmodules \
                 tests/unit/content \
                 tests/unit/content_semantics \
                 tests/unit/feature_packs \
                 tests/unit/culture \
                 -m "not slow" --tb=short -q

  # ── Unit: gameplay systems ────────────────────────────────────────────────
  unit-gameplay:
    name: "Unit · gameplay"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13", cache: pip }
      - run: pip install -r requirements.txt
      - name: Run
        run: |
          pytest tests/unit/strategic \
                 tests/unit/combat \
                 tests/unit/social \
                 tests/unit/economy \
                 tests/unit/resource \
                 tests/unit/progression \
                 tests/unit/quest \
                 tests/unit/movement \
                 tests/unit/faction \
                 tests/unit/motivation \
                 tests/unit/tactical \
                 tests/unit/campaigns \
                 tests/unit/scenarios \
                 -m "not slow" --tb=short -q

  # ── Unit: infra / observability / domains ─────────────────────────────────
  unit-infra:
    name: "Unit · infra / observability"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13", cache: pip }
      - run: pip install -r requirements.txt
      - name: Run
        run: |
          pytest tests/unit/domains \
                 tests/unit/observability \
                 tests/unit/optimization \
                 tests/unit/lab \
                 tests/unit/lab_agent \
                 tests/unit/api \
                 tests/unit/cli \
                 tests/unit/views \
                 tests/unit/diagnostics \
                 tests/unit/perf \
                 tests/unit/entity \
                 tests/unit/entities \
                 tests/unit/chronicle \
                 tests/unit/cognition \
                 tests/unit/docs \
                 tests/unit/certification \
                 -m "not slow" --tb=short -q

  # ── Integration tests (excluding slow) ────────────────────────────────────
  integration:
    name: "Integration"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13", cache: pip }
      - run: pip install -r requirements.txt
      - name: Run
        run: |
          pytest tests/integration \
                 -m "not slow and not extra_slow" --tb=short -q

  # ── API / CLI / tools ─────────────────────────────────────────────────────
  api-tools:
    name: "API / tools / logging"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13", cache: pip }
      - run: pip install -r requirements.txt
      - name: Run
        run: |
          pytest tests/api \
                 tests/cli \
                 tests/tools \
                 tests/logging \
                 tests/engine \
                 tests/observability \
                 -m "not slow" --tb=short -q

  # ── Architecture / docs / static guards ──────────────────────────────────
  arch-docs:
    name: "Architecture / docs / static"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13", cache: pip }
      - run: pip install -r requirements.txt
      - name: Run
        run: |
          pytest tests/architecture \
                 tests/docs \
                 tests/integrity \
                 tests/static \
                 tests/refactor \
                 -m "not slow" --tb=short -q

  # ── Perf / certification / arena ─────────────────────────────────────────
  perf-cert-arena:
    name: "Perf / cert / arena"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13", cache: pip }
      - run: pip install -r requirements.txt
      - name: Run
        run: |
          pytest tests/perf \
                 tests/certification \
                 tests/arena \
                 -m "not slow" --tb=short -q

  # ── Migration lanes + expansion gate ─────────────────────────────────────
  migration-lanes:
    name: "Migration lanes"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13", cache: pip }
      - run: pip install -r requirements.txt
      - name: Fast lanes
        run: make lane-all-fast
      - name: Expansion gate
        run: make gate-expansion

  # ── Type check (informational) ────────────────────────────────────────────
  typecheck:
    name: "Type check (informational)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13", cache: pip }
      - run: pip install -r requirements.txt
      - run: pip install mypy
      # Remove continue-on-error once baseline error count is documented
      # (open_audit_findings_backlog §1G).
      - name: mypy
        run: python3 -m mypy src/ --config-file pyproject.toml --no-error-summary || true
        continue-on-error: true

  # ── Slow regression (main + PRs targeting main) ──────────────────────────
  slow:
    name: "Slow regression"
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.base_ref == 'main'
    needs:
      - unit-core-world
      - unit-gameplay
      - unit-infra
      - integration
      - api-tools
      - arch-docs
      - perf-cert-arena
      - migration-lanes
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13", cache: pip }
      - run: pip install -r requirements.txt
      - name: Slow tests
        run: |
          pytest tests/ -m "slow or extra_slow" --tb=short -q
      - name: Legacy regression
        run: make lane-legacy-regression
