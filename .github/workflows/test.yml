name: Tests

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Nightly, low-traffic UTC hour — catches slow-lane regressions without
    # blocking every PR iteration on the ~45-90min slow suite (TCK-20260818-
    # STANDARD-SLOW-REGRESSION-OFF-PR-PATH).
    - cron: "0 3 * * *"
  workflow_dispatch: {}

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Unit: core engine + world layer ──────────────────────────────────────
  # TCK-20260819-HOTFIX-CI-TEST-DIR-COVERAGE-CHECK: tests/unit/test_dirty_refresh.py (and two
  # siblings wired into unit-infra below) sat directly under tests/unit/ with no owning job --
  # same orphaned-test shape as TCK-20260817's 16 directories, just at file instead of directory
  # granularity, found by the coverage check this ticket added.
  unit-core-world:
    name: "Unit · core / world"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.13", cache: pip }
      - run: pip install -r requirements.txt
      - name: Run
        run: |
          pytest tests/unit/core \
                 tests/unit/kernel \
                 tests/unit/engine \
                 tests/unit/config \
                 tests/unit/runtime \
                 tests/unit/platform \
                 tests/unit/world \
                 tests/unit/worldassembly \
                 tests/unit/worldbuilding \
                 tests/unit/worldgeneration \
                 tests/unit/worldmodules \
                 tests/unit/content \
                 tests/unit/content_semantics \
                 tests/unit/replay \
                 tests/unit/test_dirty_refresh.py \
                 -m "not slow and not extra_slow" --tb=short -q \
                 --junit-xml=reports/junit/unit-core-world.xml
      - name: Fetch base branch for collect-only diff
        if: github.event_name == 'pull_request'
        run: |
          if ! git fetch origin "${{ github.base_ref }}" --depth=1 2>&1; then
            echo "::warning::base-branch fetch failed — new/existing breakdown will be skipped"
            exit 0
          fi
          if ! git worktree add /tmp/base-checkout FETCH_HEAD 2>&1; then
            echo "::warning::base-branch worktree add failed — new/existing breakdown will be skipped"
            exit 0
          fi
      - name: Base branch test collection
        if: github.event_name == 'pull_request'
        run: |
          if [ -d /tmp/base-checkout ]; then
            cd /tmp/base-checkout && pytest tests/unit/core \
                   tests/unit/kernel \
                   tests/unit/engine \
                   tests/unit/config \
                   tests/unit/runtime \
                   tests/unit/platform \
                   tests/unit/world \
                   tests/unit/worldassembly \
                   tests/unit/worldbuilding \
                   tests/unit/worldgeneration \
                   tests/unit/worldmodules \
                   tests/unit/content \
                   tests/unit/content_semantics \
                   tests/unit/replay \
                   tests/unit/test_dirty_refresh.py \
                   -m "not slow and not extra_slow" --collect-only -q > /tmp/base-collect.txt 2>&1 || true
          fi
      - name: Job summary
        if: always()
        run: python3 tools/ci_junit_summary.py "reports/junit/unit-core-world.xml" "unit-core-world" "/tmp/base-collect.txt" >> "$GITHUB_STEP_SUMMARY"

  # ── Unit: gameplay systems ────────────────────────────────────────────────
  unit-gameplay:
    name: "Unit · gameplay"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
