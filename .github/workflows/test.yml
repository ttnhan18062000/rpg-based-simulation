name: Tests

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Nightly, low-traffic UTC hour — catches slow-lane regressions without
    # blocking every PR iteration on the ~45-90min slow suite (TCK-20260818-
    # STANDARD-SLOW-REGRESSION-OFF-PR-PATH).
    - cron: "0 3 * * *"
  workflow_dispatch: {}

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Unit: core engine + world layer ──────────────────────────────────────
  unit-core-world:
    name: "Unit · core / world"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13", cache: pip }
      - run: pip install -r requirements.txt
      - name: Run
        run: |
          pytest tests/unit/core \
                 tests/unit/kernel \
                 tests/unit/engine \
                 tests/unit/config \
                 tests/unit/runtime \
                 tests/unit/platform \
                 tests/unit/world \
                 tests/unit/worldassembly \
                 tests/unit/worldbuilding \
                 tests/unit/worldgeneration \
                 tests/unit/worldmodules \
                 tests/unit/content \
                 tests/unit/content_semantics \
                 tests/unit/feature_packs \
                 tests/unit/culture \
                 -m "not slow and not extra_slow" --tb=short -q

  # ── Unit: gameplay systems ────────────────────────────────────────────────
  unit-gameplay:
    name: "Unit · gameplay"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13", cache: pip }
      - run: pip install -r requirements.txt
      - name: Run
        run: |
          pytest tests/unit/strategic \
                 tests/unit/combat \
                 tests/unit/social \
                 tests/unit/economy \
                 tests/unit/resource \
                 tests/unit/progression \
                 tests/unit/quest \
                 tests/unit/movement \
                 tests/unit/faction \
                 tests/unit/motivation \
                 tests/unit/tactical \
                 tests/unit/campaigns \
                 tests/unit/scenarios \
                 tests/unit/systems \
                 tests/unit/actions \
                 tests/unit/ai \
                 -m "not slow and not extra_slow" --tb=short -q

  # ── Unit: infra / observability / domains ─────────────────────────────────
  unit-infra:
    name: "Unit · infra / observability"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13", cache: pip }
      - run: pip install -r requirements.txt
      - name: Run
        run: |
          pytest tests/unit/domains \
                 tests/unit/observability \
                 tests/unit/optimization \
                 tests/unit/lab \
                 tests/unit/lab_agent \
                 tests/unit/api \
                 tests/unit/cli \
                 tests/unit/views \
                 tests/unit/diagnostics \
                 tests/unit/perf \
                 tests/unit/entity \
                 tests/unit/entities \
                 tests/unit/chronicle \
                 tests/unit/cognition \
                 tests/unit/docs \
                 tests/unit/certification \
                 tests/unit/tools \
                 -m "not slow and not extra_slow" --tb=short -q

  # ── Integration tests (excluding slow) ────────────────────────────────────
  integration:
    name: "Integration"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13", cache: pip }
      - run: pip install -r requirements.txt
      - name: Run
        run: |
          pytest tests/integration \
                 -m "not slow and not extra_slow" --tb=short -q

  # ── API / CLI / tools ─────────────────────────────────────────────────────
  api-tools:
    name: "API / tools / logging"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13", cache: pip }
      - run: pip install -r requirements.txt
      - name: Run
        run: |
          pytest tests/api \
                 tests/cli \
                 tests/tools \
                 tests/logging \
                 tests/engine \
                 tests/observability \
                 -m "not slow and not extra_slow" --tb=short -q

  # ── Agent orchestration / codex / replay ──────────────────────────────────
  # TCK-20260817-CI-COVERAGE-GAP-16-ORPHANED-TEST-DIRS: these 12 directories (added by commit
  # 29d78798, "Simulation quality #20") were never wired into any CI job -- 439 of their 440
  # tests had never run in CI at all until this batch of fixes. Own dedicated job (not folded
  # into api-tools) given the volume (83 files).
  agent-orchestration:
    name: "Agent orchestration / codex / replay"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13", cache: pip }
      - run: pip install -r requirements.txt
      - name: Run
        run: |
          pytest tests/agent_codex_live_transport \
                 tests/agent_codex_pilot_executor \
                 tests/agent_codex_pilot_guardrails \
                 tests/agent_codex_pilot_orchestration \
                 tests/agent_codex_posttool_adapter \
                 tests/agent_codex_realrepo_pilot_harness \
                 tests/agent_codex_runtime_shadow \
                 tests/agent_orchestration \
                 tests/agent_orchestration_claude_adapter \
                 tests/agent_orchestration_codex_adapter \
                 tests/agent_replay \
                 tests/agent_replay_codex \
                 -m "not slow and not extra_slow" --tb=short -q

  # ── Simulation quality (SimQ scoring module) ──────────────────────────────
  simulation-quality:
    name: "Simulation quality"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13", cache: pip }
      - run: pip install -r requirements.txt
      - name: Run
        run: |
          pytest tests/simulation_quality \
                 -m "not slow and not extra_slow" --tb=short -q

  # ── Architecture / docs / static guards ──────────────────────────────────
  arch-docs:
    name: "Architecture / docs / static"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13", cache: pip }
      - run: pip install -r requirements.txt
      - name: Run
        run: |
          pytest tests/architecture \
                 tests/docs \
                 tests/integrity \
                 tests/static \
                 tests/refactor \
                 -m "not slow and not extra_slow" --tb=short -q

  # ── Perf / certification / arena ─────────────────────────────────────────
  perf-cert-arena:
    name: "Perf / cert / arena"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13", cache: pip }
      - run: pip install -r requirements.txt
      - name: Run
        run: |
          pytest tests/perf \
                 tests/certification \
                 tests/arena \
                 -m "not slow and not extra_slow" --tb=short -q

  # ── Migration lanes + expansion gate ─────────────────────────────────────
  migration-lanes:
    name: "Migration lanes"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13", cache: pip }
      - run: pip install -r requirements.txt
      - name: Fast lanes
        run: make lane-all-fast
      - name: Expansion gate
        run: make gate-expansion

  # ── Type check (informational) ────────────────────────────────────────────
  typecheck:
    name: "Type check (informational)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13", cache: pip }
      - run: pip install -r requirements.txt
      - run: pip install mypy
      # Remove continue-on-error once baseline error count is documented
      # (open_audit_findings_backlog §1G).
      - name: mypy
        run: python3 -m mypy src/ --config-file pyproject.toml --no-error-summary || true
        continue-on-error: true

  # ── Slow regression (main + PRs targeting main) ──────────────────────────
  slow:
    name: "Slow regression"
    runs-on: ubuntu-latest
    # TCK-20260818-STANDARD-SLOW-REGRESSION-OFF-PR-PATH: no longer runs on every PR push
    # (github.base_ref == 'main') -- the ~45-90min slow suite (9021-deselected-tests-heavy)
    # blocked fast development iteration on every commit. Still runs as a real safety net:
    # (a) on push to main itself (post-merge), (b) on the nightly schedule, (c) on manual
    # dispatch when a developer/agent wants pre-merge confidence.
    if: github.ref == 'refs/heads/main' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs:
      - unit-core-world
      - unit-gameplay
      - unit-infra
      - integration
      - api-tools
      - agent-orchestration
      - simulation-quality
      - arch-docs
      - perf-cert-arena
      - migration-lanes
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13", cache: pip }
      - run: pip install -r requirements.txt
      - name: Slow tests — corpus diversity (isolated per-test, TCK-20260715-SIMQ-CORPUS-DIVERSITY-SESSION-LOAD-FLAKE)
        run: make simq-corpus-diversity-slow-isolated
      - name: Slow tests (includes 5k behavioral regression)
        run: |
          pytest tests/ -m "slow or extra_slow" --resource-budget large --tb=short -q --ignore=tests/unit/worldassembly/test_corpus_diversity.py
      - name: Legacy regression
        run: make lane-legacy-regression
      - name: Upload certification report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: certification-report-${{ github.sha }}
          path: reports/certification/
          retention-days: 30
