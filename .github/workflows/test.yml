                   tests/unit/social \
                   tests/unit/economy \
                   tests/unit/resource \
                   tests/unit/progression \
                   tests/unit/quest \
                   tests/unit/movement \
                   tests/unit/motivation \
                   tests/unit/tactical \
                   tests/unit/scenarios \
                   tests/unit/systems \
                   tests/unit/actions \
                   tests/unit/ai \
                   -m "not slow and not extra_slow" --collect-only -q > /tmp/base-collect.txt 2>&1 || true
