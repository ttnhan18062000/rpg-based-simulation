name: Slow regression

# TCK-20261001-SIMQ-GRADE-ANCHORS-RED-ON-MAIN-UNREPORTED (Reporting-Path Design, P1/P2):
# the slow suite (~2 h) used to be a job of `Tests`, whose cancel-in-progress group evicted it on
# nearly every main push, and nothing reported its result. It now has a workflow of its own:
#   - schedule + manual dispatch only, no `push` trigger (owner decision D3);
#   - a non-cancelling concurrency group, so every run that starts also finishes;
#   - no `needs:` on the fast jobs (the slow suite is informational);
#   - a final report step that keeps ONE rolling GitHub issue and comments only when the set of
#     failing tests changes.
#
# TCK-20261008-SLOW-REGRESSION-SCHEDULE-WATCHDOG: GitHub's schedule trigger is best-effort (a slot was
# never created on 2026-10-08, others start up to 3.5 h late), so `slow-regression-watchdog.yml` runs
# hourly and dispatches this workflow on main when none is queued or running and the newest run is 10 h
# old or more. 10 h = 6 h period + 3.5 h observed lateness + 0.5 h grace; a shorter threshold would
# double the cost when a late scheduled run is still on its way. Rule: tools/test_architecture/slow_regression_watchdog.py.
#
# TCK-20261009-SLOW-REGRESSION-OFF-HOUR-AND-SKIP-UNCHANGED-MAIN: the `gate` job skips a SCHEDULED run when main's head
# was already actually tested less than 24 h ago (one same-commit rerun a day stays, to keep failing-set flapping
# visible). A `workflow_dispatch` run always tests. A skipped run runs only the gate (about one billed minute), leaves
# the report and rolling issue #390 untouched, and its suite job concludes `skipped`, which is how later gates tell it
# from a run that tested. Rule and the "actually tested" definition: tools/test_architecture/slow_regression_gate.py.

on:
  schedule:
    # Every 6 hours (owner decision D2): about 4 x 2 runner-hours a day. Off the hour (owner, 2026-10-09,
    # TCK-20261009-SLOW-REGRESSION-OFF-HOUR-AND-SKIP-UNCHANGED-MAIN): GitHub delays or drops top-of-hour
    # schedules under load, and the :00 slots here started 1.5 to 5.5 h late or never.
    - cron: "41 2,8,14,20 * * *"
  workflow_dispatch: {}

concurrency:
  group: slow-regression-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gate:
    name: "Gate: skip if main was tested recently"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    outputs:
      decision: ${{ steps.decide.outputs.decision }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      # Sparse checkout: only the pure decision module, not the slow suite.
      - uses: actions/checkout@v5
        with:
          sparse-checkout: |
            tools/test_architecture/__init__.py
            tools/test_architecture/slow_regression_gate.py
          sparse-checkout-cone-mode: false
      # Schedule events only: a workflow_dispatch run (a human asked, or the watchdog decided) always tests. If this
      # step errors, `decision` stays empty and the suite still runs (fail open).
      - name: Decide
        id: decide
        if: ${{ github.event_name == 'schedule' }}
        run: |
          set -o pipefail  # without it a crashing gate hides behind `| tee`: empty decision, no red signal
          python3 -m tools.test_architecture.slow_regression_gate decide \
            --head-sha "${{ github.sha }}" --exclude-run-id "${{ github.run_id }}" | tee decision.txt
          cat decision.txt >> "$GITHUB_OUTPUT"
          {
            echo "### Slow regression gate"
            sed 's/^/- /' decision.txt
          } >> "$GITHUB_STEP_SUMMARY"

  slow:
    name: "Slow regression"
    needs: gate
    # `!cancelled()` so a failed gate does not skip the suite (fail open); skip only on an explicit `skip` decision.
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || needs.gate.outputs.decision != 'skip') }}
    runs-on: ubuntu-latest
    timeout-minutes: 240
    # Job-level permissions drop everything not listed: checkout needs contents, the report step
    # needs issues.
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v10.2.0
        with: { version: "0.11.2", python-version: "3.13", activate-environment: true, enable-cache: true }
      - run: uv sync --locked --no-install-project --no-group lint
      - name: Slow tests — corpus diversity (isolated per-test, TCK-20260715-SIMQ-CORPUS-DIVERSITY-SESSION-LOAD-FLAKE)
        id: corpus_diversity
        continue-on-error: true
        run: make simq-corpus-diversity-slow-isolated
      # TCK-20261005-SLOW-REGRESSION-GATE-SKIPS-ITS-ONLY-TEST-STEP-ON-MAIN: the two steps below
      # test unrelated things from step 5, so a step-5 failure must not skip them (the default
      # `success()` did, on every main run where step 5 failed). `!cancelled()` and not `always()`:
      # a cancelled run must stay cancelled.
      #
      # Steps 5-7 are `continue-on-error: true` (reporting-path hardening, 2026-10-07; this reverses the
      # "no continue-on-error" pin of #360/#377): a workflow that is red forever gets ignored, so the job's
      # verdict belongs to the report step. It exits 1 on an UNOWNED or EXPIRED red, a missing step, or a
      # GitHub error, and 0 when every red is mapped and in date. `steps.<id>.outcome` still says "failure" for a
      # red step, so the outcome summary stays truthful. The report step itself is NOT continue-on-error.
      - name: Slow tests (includes 5k behavioral regression)
        id: slow_tests
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: |
          pytest tests/ -m "slow or extra_slow" --resource-budget large --tb=short -q --ignore=tests/unit/worldassembly/test_corpus_diversity.py --junitxml=reports/slow/slow_tests.xml
      - name: Legacy regression
        id: legacy_regression
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          PYTEST_ADDOPTS: --junitxml=reports/slow/legacy_regression.xml
        run: make lane-legacy-regression
      - name: Slow regression step outcomes
        if: ${{ !cancelled() }}
        run: |
          {
            echo "### Slow regression step outcomes"
            echo "- corpus diversity: ${{ steps.corpus_diversity.outcome }}"
            echo "- slow tests: ${{ steps.slow_tests.outcome }}"
            echo "- legacy regression: ${{ steps.legacy_regression.outcome }}"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Report failing-set changes
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 tools/test_architecture/slow_regression_report.py \
            --junit-dir reports/slow \
            --repo "${{ github.repository }}" \
            --run-id "${{ github.run_id }}" \
            --sha "${{ github.sha }}" \
            --known-reds tools/test_architecture/slow_known_reds.yaml
      - name: Upload certification report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: certification-report-${{ github.sha }}
          path: reports/certification/
          retention-days: 30
      - name: Upload slow JUnit reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: slow-junit-${{ github.sha }}
          path: reports/slow/
          retention-days: 30
