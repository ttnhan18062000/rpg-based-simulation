# Temporarily disabled (TCK-20260916-DISABLE-DOCS-PAGES-DEPLOY-WORKFLOW, 2026-09-16): GitHub
# Pages is not enabled for this repository (gh api repos/:owner/:repo/pages returns 404), so
# `Configure Pages` can never succeed regardless of what `Build` produces -- this workflow has
# failed on every push to main for days as a result. The push trigger is narrowed to
# workflow_dispatch only so the build config, its history, and manual runs all survive; only the
# automatic push-triggered failures stop. Re-enabling (restoring the push trigger once Pages is
# enabled and the docs site is ready to publish a first version) is tracked by
# TCK-20260916-REENABLE-DOCS-PAGES-PUBLISHING -- do not restore the push trigger without that
# ticket's own conditions being met.
name: Deploy Docs to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time; don't cancel in-progress so we don't
# leave a half-deployed site.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        run: cd website && npm ci

      - name: Build
        env:
          DOCS_URL: https://ttnhan18062000.github.io
          DOCS_BASE_URL: /rpg-based-simulation/
          NODE_OPTIONS: --max-old-space-size=8192
        run: cd website && npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v4

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: website/build

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
