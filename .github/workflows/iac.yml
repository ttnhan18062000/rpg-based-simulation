name: iac

# Prove the Terraform under infra/ at $0 and with no credentials (TCK-20261018-IAC-WORKFLOW-AND-ROLES; ADR D6, lead decision D-2):
# fmt -check, init -backend=false + validate per root, tflint, and trivy config (report-only, exit code 0, ADR D3).
# There is no plan, apply or destroy here, no cloud credential and no OIDC use. Actions are pinned by SHA (like publish-images.yml),
# Terraform, tflint and trivy by version. The runner label is not pinned (precheck decision, TCK-20261009-UBUNTU-26-RUNNER-PRECHECK).

on:
  pull_request:
    paths:
      - "infra/**"
      - ".github/workflows/iac.yml"
  push:
    branches: [main]
    paths:
      - "infra/**"
      - ".github/workflows/iac.yml"
  workflow_dispatch:

concurrency:
  group: iac-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  TERRAFORM_VERSION: "1.16.5"
  TFLINT_VERSION: "v0.64.0"
  TRIVY_VERSION: "v0.70.0"

jobs:
  terraform:
    name: terraform (${{ matrix.root }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        root: [bootstrap, service]
    defaults:
      run:
        working-directory: infra/terraform/${{ matrix.root }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false
      - name: terraform fmt
        run: terraform fmt -check -recursive
      - name: terraform init (no backend)
        run: terraform init -backend=false -input=false
      - name: terraform validate
        run: terraform validate

  tflint:
    name: tflint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
        with:
          tflint_version: ${{ env.TFLINT_VERSION }}
      - name: tflint --init
        working-directory: infra/terraform
        env:
          GITHUB_TOKEN: ${{ github.token }} # only raises the GitHub API rate limit for the ruleset download
        run: tflint --init
      - name: tflint --recursive
        working-directory: infra/terraform
        run: tflint --recursive --format compact

  trivy-config:
    name: trivy config (report-only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Trivy config scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: infra/terraform
          version: ${{ env.TRIVY_VERSION }}
          format: json
          output: trivy-config.json
          exit-code: "0" # report-only (ADR D3); flipping it to blocking needs its own owner decision
      - name: Trivy summary
        if: always()
        run: |
          if [ ! -f trivy-config.json ]; then
            echo "Trivy config did not produce a report" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo "### Trivy config (infra/terraform) - report only"
            echo
            echo "| Severity | Count |"
            echo "|---|---|"
            for sev in CRITICAL HIGH MEDIUM LOW; do
              n=$(jq "[.Results[]?.Misconfigurations[]? | select(.Severity==\"$sev\")] | length" trivy-config.json)
              echo "| $sev | $n |"
            done
            echo
            echo "| Check | Severity | File |"
            echo "|---|---|---|"
            jq -r '.Results[]? | .Target as $t | .Misconfigurations[]? | "| \(.ID) | \(.Severity) | \($t) |"' trivy-config.json
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload Trivy report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: trivy-config
          path: trivy-config.json
          if-no-files-found: warn
