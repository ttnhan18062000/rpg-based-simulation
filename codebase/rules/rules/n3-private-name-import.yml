id: n3-private-name-import
language: python
severity: warning
message: "Do not import a _private name from another module (standard rule N3). Make it public in its home module, or use that module's public API."
# A `dotted_name` after the `import` keyword of a from-import (a module name before `import` is not matched),
# plain or as `_x as y`. tree-sitter labels every imported name `name`, but ast-grep's `field` only checks the first.
rule:
  kind: dotted_name
  regex: '^_[^_]'
  any:
    - inside:
        kind: import_from_statement
      follows:
        regex: '^import$'
        stopBy: end
    - inside:
        kind: aliased_import
        inside:
          kind: import_from_statement
        follows:
          regex: '^import$'
          stopBy: end
