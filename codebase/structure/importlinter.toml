# import-linter config (TCK-20261004-IMPORT-LINTER-ADOPTION, advisory). Run:
#   uvx --from import-linter==2.15 lint-imports --config codebase/structure/importlinter.toml
# (or `lint-imports --config ...` from the `lint` group). Docs: docs/guidelines/agent_working_environment.md.
# Only the block between the GENERATED markers is rewritten (python3 -m codebase.structure.import_contracts);
# everything else is edited by hand.
#
# `src` has 20 namespace packages without `__init__.py`; import-linter only sees them when each is its own
# root (`src.<pkg>`), and `src` stays listed for the regular packages (without it `src.lab` does not exist).
# tests/codebase/test_import_contracts.py pins this list to codebase/structure/package_registry.jsonl.
# `src/engine/intent` stays uncovered (no `__init__.py` inside a regular package; a `src/` decision).
# `exclude_type_checking_imports` is global and false: a TYPE_CHECKING import counts, so no contract is looser
# than the test it will replace; contracts whose tests skip TYPE_CHECKING pin those lines in `ignore_imports`.
[tool.importlinter]
root_packages = [
    "src",
    "src.actions",
    "src.ai",
    "src.api",
    "src.certification",
    "src.content",
    "src.content_semantics",
    "src.core",
    "src.domains",
    "src.logging",
    "src.observability",
    "src.perf",
    "src.strategy",
    "src.systems",
    "src.testing",
    "src.town",
    "src.views",
    "src.world",
    "src.worldassembly",
    "src.worldgeneration",
    "src.worldmodules",
]
include_external_packages = true
exclude_type_checking_imports = false

