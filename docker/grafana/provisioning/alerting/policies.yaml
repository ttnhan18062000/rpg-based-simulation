apiVersion: 1

# Default route: everything goes to ntfy. Timings: the first notification waits 30s for grouped alerts, a changed group is
# re-sent after 5m, an unchanged firing group repeats every 4h. TCK-20261018-GRAFANA-ALERTING-NTFY-AND-BASE-RULES.
policies:
  - orgId: 1
    receiver: ntfy
    group_by: ["alertname", "job"]
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h
