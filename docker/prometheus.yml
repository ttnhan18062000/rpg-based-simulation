global:
  scrape_interval: 5s
  evaluation_interval: 5s

# The `job` label is the name the runbooks (docs/runbooks) use for a target.
# The backend is scraped on its internal metrics port 9109 (rpg R1, #648; `expose` only in compose.yaml). The old job on backend:8000
# was removed by TCK-20261018-BASE-ALERT-SCRAPES-AND-NODE-EXPORTER: /metrics there is admission-gated and returns 401.
scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "grafana"
    metrics_path: /metrics
    static_configs:
      - targets: ["grafana:3000"]

  - job_name: "loki"
    metrics_path: /metrics
    static_configs:
      - targets: ["loki:3100"]

  - job_name: "tempo"
    metrics_path: /metrics
    static_configs:
      - targets: ["tempo:3200"]

  - job_name: "node-exporter"
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: "ntfy"
    static_configs:
      - targets: ["ntfy:9091"]

  - job_name: "rpg-backend"
    static_configs:
      - targets: ["backend:9109"]

  - job_name: "redis"
    static_configs:
      - targets: ["redis-exporter:9121"]

  - job_name: "promtail"
    static_configs:
      - targets: ["promtail:9080"]
