global:
  scrape_interval: 5s
  evaluation_interval: 5s

# The `job` label is the name the runbooks (docs/runbooks) use for a target.
# `rpg-backend` on backend:8000 was removed (TCK-20261018-BASE-ALERT-SCRAPES-AND-NODE-EXPORTER): /metrics there is
# admission-gated and returns 401, so a target-down rule on it would fire forever. TCK-20261018-SCRAPE-BACKEND-METRICS-PORT
# adds backend:9109 when rpg's R1 lands.
scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "grafana"
    metrics_path: /metrics
    static_configs:
      - targets: ["grafana:3000"]

  - job_name: "loki"
    metrics_path: /metrics
    static_configs:
      - targets: ["loki:3100"]

  - job_name: "tempo"
    metrics_path: /metrics
    static_configs:
      - targets: ["tempo:3200"]

  - job_name: "node-exporter"
    static_configs:
      - targets: ["node-exporter:9100"]
