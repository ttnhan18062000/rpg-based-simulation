INFORMATION:
  # Positive per-event weights raised x5 (TCK-20260713-SIMQ-SCORE-CEILING-FIX): the
  # richest pre-fix anchor scenario (unit_information_source, 1 event, raw_score=2.0,
  # normalized_score=0.04) would need a single-event weight of 25 to cross A on its own
  # (denom=50) — above PROGRESSION's own pre-fix milestone-tier ceiling (15), the
  # escalation condition from plan.md's Step 5, since a per-event weight that large would
  # let one occurrence dominate the entire pillar (a discriminative-power problem in its
  # own right, not a fix). Per the escalation path, a new Unit-tier probe world
  # (unit_information_density, 3 belief_assimilated events/run instead of 1) was added to
  # the corpus to supply real event density. Recomputing M against THAT scenario's
  # richest run (raw_score=6.0, denom=50) gives M_INFORMATION = ceil((0.5 * 50) / 6) = 5 —
  # the same order of magnitude as the other 3 pillars, non-degenerate. paid_information_
  # transaction's scoring ownership stays here (not EconomyScorer, per INFRA-245).
  # Negative/dormancy weights below are untouched.
  belief_active: 10.0
  intel_quality_up: 10.0
  knowledge_economy_active: 15.0
