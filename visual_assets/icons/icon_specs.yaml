    parts: [stone frame, arched dark opening, base step]
    reads_as: a doorway into a dungeon or cave
    must_not_read_as: a window, a tombstone, a mailbox, a tunnel seen from the side
    synonyms: [door, arch, archway, gate, entrance, tunnel, cave, dungeon, portal, doorway, tomb]
    distractors: [window, grave marker, mailbox, oven, bridge, helmet]
