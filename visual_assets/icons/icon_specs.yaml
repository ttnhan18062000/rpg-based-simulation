    parts: [pyramid tip, shaft with a light left edge, gold marks, plinth]
    reads_as: a standing stone, obelisk or monument
    must_not_read_as: a bell, a bottle, a tombstone, a candle
    synonyms: [obelisk, monolith, monument, pillar, standing stone, spire, tower, stone, shrine, totem]
    distractors: [bell, bottle, grave marker, candle, rocket, chess piece]
