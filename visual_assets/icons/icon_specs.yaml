# Construction specs of every icon (TCK-20261008-VISUAL-ASSETS-ICON-RECOGNISABILITY-CHECKS), written 2026-10-08 BEFORE any redraw.
# One entry per registered icon key. `status: v2` entries are targets for the drawing (the 4c redraw works to them); `status: adopted` entries DESCRIBE the adopted art as it is.
# `synonyms` are what counts as naming the object in the blind recognition check (case-insensitive substring of the free-text answer); `distractors` join the intended name in the candidate list.
# The human-readable table in docs/assets/icon_style_guide.md is generated from this file (python -m tests.visual_assets.icon_specs --table); a test fails if they differ.
# Reference studies: Kenney Tiny Dungeon (CC0, "Kenney", https://kenney.nl/assets/tiny-dungeon) and Kenney 1-Bit Pack (CC0, https://kenney.nl/assets/1-bit-pack), looked at only, nothing traced or copied.
families:
  marker: {size: 16, convention: "16x16 glyph, live area 12x12 (2 px margin), dark outline #0e1018, drawn over the plate; one object, upright and centred, no scene"}
  building: {size: 24, convention: "24x24 panel icon, live area 20x20; one object, centred; the object as seen from the front, light from the top left"}
  class: {size: 24, convention: "24x24 panel icon, live area 20x20; the class's signature object alone (no figure)"}
  item: {size: 24, convention: "24x24; one object per family; weapons point UP on the vertical axis (Tiny Dungeon's convention) so they never share a pose with the class dagger, which is diagonal; the tool is a WRENCH (the catalog's two tool items are a repair kit and a spirit lantern: no mining tool, and a hammer or pick reads as a weapon), diagonal"}
  rarity: {size: 8, convention: "8x8 badge, a gem or bead silhouette that is never an octagon or a diamond (those are the tier ladder); name stays as text"}
  tier: {size: 8, convention: "8x8 rank badge: octagon (E to A) or diamond (S to SSS), pips cut out for steps"}
  status: {size: 16, convention: "16x16 frame with one arrow inside; the arrow's direction carries the meaning, not colour"}
  plate: {size: 16, convention: "16x16 rounded plate, rim #9ea4b6, composited under a location glyph"}
icons:
  icon.marker.resource_grove:
    status: v2
    subject: a tree
    orientation: upright, centred
    proportions: "crown 10-12 px wide and about 8 px tall; trunk 2 px wide and 3-4 px tall, centred under the crown; the crown is wider than tall"
    parts: [crown, shaded right side, trunk]
    reads_as: a broadleaf tree
    must_not_read_as: a bush, a speech bubble, a cloud, a lollipop
    synonyms: [tree, oak, forest, grove, woods]
    distractors: [bush, cloud, mushroom, speech bubble, lollipop, broccoli]
  icon.marker.ruins:
    status: v2
    subject: a ruined brick wall
    orientation: "upright, wider than tall, the broken top edge shaped like a U (never a one-way slope: that read as a boot, and a slab under it as a sole)"
    proportions: "wall 10 px wide and about 9 px tall; 4 courses of bricks, two rows each, alternating light and dark with staggered mortar joints; a broken top edge with two towers of different heights (4 and 3 px from the top) either side of a low jagged gap; at least one fallen brick (a loose group of 2 or more px) lying in the gap; no ground slab and no matched pair of bricks under the wall (they read as wheels and a cart)"
    parts: [brick courses, mortar joints, two towers, low jagged gap, fallen brick]
    reads_as: a broken brick wall
    must_not_read_as: mountain peaks, a wagon, a boot, a chess piece, a stair, a tooth, a crown
    synonyms: [ruin, wall, brick, masonry, rubble, crumbl, castle, fortress, battlement]
    distractors: [mountain, boot, wagon, chess piece, staircase, tooth]
