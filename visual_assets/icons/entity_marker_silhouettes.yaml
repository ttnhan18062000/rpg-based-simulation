# Proposed one-colour silhouettes of the 11 entity role markers (TCK-20261013-VISUAL-ASSETS-ENTITY-MARKER-DRAFTS, step 1 of the recognisability process). `#` is a pixel of the shape.
# Keyed by the presenter's role `kind`; the key family is `icon.entity.<kind>` (owner decision 2026-10-19, 16x16 on the map cell like icon.node.*). Nothing here is adopted or drawn in colour.
# Treatments (the owner picks ONE for the whole set):
#   a  the bare object, 12x12 live area, no token                (given for the three kinds in `compare`, candidate A)
#   b  the emblem (at most 8x8, centred) on a shared round unit token, 12x12 live area   (given for every candidate)
#   c  a figure silhouette, 12x12 live area                       (given for the three kinds in `compare`, candidate A)
# `nearest` is the existing adopted glyph the new marker is shown beside (the collision map in the investigation).
record_type: entity_marker_silhouettes
# OWNER GATE 2026-10-19 (via lead, neutral options): treatment (a) the bare object for the whole set; chosen candidate per kind in `chosen` (worker A, guard D, scout C, raider B, sentinel B, merchant A, blacksmith A, leader A, alpha B, predator_hunter A, wild_creature A). The `bare` rows of worker, guard and sentinel are the chosen shapes at 12x12; the other eight are drawn from the 8x8 emblem in colour.
