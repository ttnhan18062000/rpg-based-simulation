# Docker Compose configuration for production-grade stack
#
# Profiles:
#   default (`docker compose up`)                  backend, redis, ai_worker, frontend
#   `--profile observability` (adds to the above)  prometheus, grafana, loki, promtail, watchdog
# watchdog sits in the observability profile because it depends_on loki and prometheus and polls Loki.
# Every service has a memory limit (mem_limit); see TCK-20261014-COMPOSE-OBSERVABILITY-PROFILE-AND-LIMITS.
services:
  backend:
    build: 
      context: .
      dockerfile: docker/backend.Dockerfile
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    restart: unless-stopped
    environment:
      - REDIS_URL=redis://redis:6379/0
    volumes:
      # Optional: mount data directory for persistent game state / config changes
      - ./data:/app/data
    mem_limit: 1g
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      # urlopen raises on HTTP >= 400 (a bare requests.get never fails on a 500), so a non-2xx or a down backend exits non-zero.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=4)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  redis:
    # Pinned to the exact 7.4.11 build, by digest (the multi-arch index; `redis:7-alpine` and `redis:7.4.11-alpine` resolve to it on 2026-10-13),
    # so a new 7.x patch cannot change the observability stream, anomaly worker or readiness behaviour with no diff here. Bump deliberately.
    image: redis:7.4.11-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    ports:
      - "${REDIS_PORT:-6379}:6379"
    restart: unless-stopped
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  ai_worker:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    # Override FastAPI command to run the V2 live anomaly worker
    command: python -m src.observability.anomaly.worker
    environment:
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 512m
    # No healthcheck: the worker exposes no HTTP port (a metrics port is tracked by rpg's TCK-20261014-AI-WORKER-EXPOSES-STREAM-CONSUMER-LAG-AND-PENDING-METRICS).
    # Use deploy block to easily scale workers: docker compose up --scale ai_worker=3
    deploy:
      replicas: 1

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 64m
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 5

  prometheus:
    profiles: ["observability"]
    # Third-party images are pinned by digest (the multi-arch index current on 2026-10-14; no version change); Dependabot bumps them.
    image: prom/prometheus:v3.15.0@sha256:efd719c99d83b060d9daefdcf00360461adf279f45ef5391f8d111892118753e
    mem_limit: 512m
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 5s
      timeout: 5s
      retries: 5
    depends_on:
      backend:
        condition: service_healthy

  grafana:
    profiles: ["observability"]
    image: grafana/grafana:13.2.4@sha256:dbbc38ea21103cefb50396340cd88afec779c7e070b0a7bf5a75b4ce46651d3f
    # Grafana 13 needs more than the 10.x limit of 256m: it hit 256m and restarted once, then peaked at 480 MiB during first start (317 MiB settled).
    mem_limit: 768m
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./docker/grafana/provisioning:/etc/grafana/provisioning
      - ./docker/grafana/dashboards:/etc/grafana/dashboards
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 120s # Grafana 13 runs a long first-start migration
    depends_on:
      prometheus:
        condition: service_healthy

  loki:
    profiles: ["observability"]
    image: grafana/loki:3.7.8@sha256:1107dd5274e0ada47e42472b7a7e71f3b2a2fe878878108f3e2f9e51528f0193
    mem_limit: 512m
    ports:
      - "${LOKI_PORT:-3100}:3100"
    command: -config.file=/etc/loki/local-config.yaml
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3100/ready"]
      interval: 5s
      timeout: 5s
      retries: 5

  promtail:
    profiles: ["observability"]
    image: grafana/promtail:3.6.8@sha256:6cfa64ec432b24a912d640e2edb940eeae2666f61861a66c121d763dd7241381
    mem_limit: 128m
    healthcheck:
      # The promtail image has bash but no wget/curl: read the first line of GET /ready over /dev/tcp and require HTTP 200.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/9080 && printf 'GET /ready HTTP/1.0\\r\\n\\r\\n' >&3 && head -n1 <&3 | grep -q ' 200 '"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - ./docker/promtail-config.yml:/etc/promtail/config.yml
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock
    command: -config.file=/etc/promtail/config.yml
    restart: unless-stopped
    depends_on:
      loki:
        condition: service_healthy

  watchdog:
    profiles: ["observability"]
    mem_limit: 256m
    # No healthcheck: the watchdog is a poller with no HTTP port.
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    command: python -m src.observability.watchdog
    environment:
      - BACKEND_URL=http://backend:8000
      - LOKI_URL=http://loki:3100
      - POLL_INTERVAL=10
      - LOG_LEVEL=INFO
      - SIM_ALERTS_WEBHOOK_URL=${SIM_ALERTS_WEBHOOK_URL:-}
      - SIM_ALERTS_WEBHOOK_ENABLED=${SIM_ALERTS_WEBHOOK_ENABLED:-false}
    depends_on:
      backend:
        condition: service_healthy
      loki:
        condition: service_healthy
      prometheus:
        condition: service_healthy
    restart: unless-stopped

volumes:
  prometheus_data:
  grafana_data:
  redis_data:
