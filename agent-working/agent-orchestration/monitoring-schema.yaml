# Execution-identity field model, carried verbatim from docs/ai/monitoring_writer_decision.md
# §2 "Execution Identity Model" — already decided there and consumed as an input by
# docs/architecture/agent_orchestration_contract.md's "Execution Identity (Consumed Input)"
# subsection. This ticket does not re-derive or alter these fields' shape, and this file does
# not itself write to any real agent-working/agent-monitoring/*.jsonl file.
schema_version: 1
fields:
  execution_id:
    description: >
      Immutable per-execution key: f"{provider}-{ticket_id}-{unix_ts_ms}-{secrets.token_hex(4)}".
      Generated fresh once per workflow execution. Never reused. Never a join key.
    format: "{provider}-{ticket_id}-{unix_ts_ms}-{token_hex_8}"
    source: docs/ai/monitoring_writer_decision.md#execution-identity-model
  run_id:
    description: >
      Human-readable run reference, unchanged shape (TCK-YYYYMMDD-SHORT-SCOPE or EPIC-*/FOLDER-*).
      Display/reference field, not the execution's primary key.
    source: docs/ai/monitoring_writer_decision.md#execution-identity-model
  ticket_id:
    description: >
      Stable cross-run join key. All records for all executions of the same ticket, by any
      provider, share the same ticket_id value.
    source: docs/ai/monitoring_writer_decision.md#execution-identity-model
  # Path-record fields (TCK-20261006-PATH-REASON-AND-PHASE-COVERAGE-RECORD). Not identity fields: they say how a run
  # got its path, so that a phase that never ran can be told from one that was never logged.
  path_reason:
    description: >
      Run field. Why the ticket took its path: pipeline_default (the formal pipeline ran, set by the pipeline itself),
      pipeline_unavailable, native_port_blocked, small_change, owner_directed, batch_hand_close, investigation_only,
      other (needs a path_note) or unstated (the writers' default when nobody said).
    source: tools/agent-monitoring/vocabulary.py#PATH_REASONS
  phases_omitted:
    description: >
      Run field. Phases the run's tier marks `full` in workflows/implement-ticket.yaml that have no event in the run.
      Derived at write time from that file, never hard-coded; conditional and skipped_event phases are never counted,
      and a tier the file does not list records an empty list.
    source: tools/agent-monitoring/path_record.py
  skip_reason:
    description: >
      Event field, only on status `skipped`: tier_plan, condition_false, not_applicable, no_hand_tool, deferred, other
      or unstated (the default).
    source: tools/agent-monitoring/vocabulary.py#SKIP_REASONS
